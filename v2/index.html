    if (keys.KeyA || keys.ArrowLeft || M.touchL) s -= 1;
    if (keys.KeyD || keys.ArrowRight || M.touchR) s += 1;
    if (joy.on) s = clamp(joy.x * 1.5, -1, 1);
    if (M.ai) s = driveAI();
    M.steer += (s - M.steer) * Math.min(1, dt * 12);
    M.x = clamp(M.x + M.steer * 2.1 * dt, -1, 1);
    // 기본 속도는 살짝 느리게. 앞(W·↑)은 조금 빠르게, 뒤(S·↓)는 조금 느리게
    let th = 0;
    if (keys.KeyW || keys.ArrowUp || M.touchU) th += 1;
    if (keys.KeyS || keys.ArrowDown || M.touchD) th -= 1;
    if (joy.on && Math.abs(joy.y) > .35) th = -Math.sign(joy.y);
    M.th += (th - M.th) * Math.min(1, dt * 5);
    const v = (440 + Math.min(220, M.run * 8)) * (1 + M.th * .3) * (M.slow > 0 ? .45 : 1);
    M.v = v; M.y += v * dt; M.score += v * dt / 20;
    if (M.slow > 0) M.slow -= dt;
    while (M.next < M.y + 1300) spawnObj(M);
    for (const o of M.objs) {
      if (o.done) continue;
      const dz = o.y - M.y;
      if (dz < 40 && dz > -30) {
        if (Math.abs((o.x - M.x) * LANE) < objHalf(o.kind) + 52) {
          o.done = true;
          if (o.kind === 'bug') { sfx('pop'); M.bugs++; M.combo++; const p = 80 + Math.min(10, M.combo) * 8; M.score += p; M.fx.push({s:`🐛 +${p}`, t:1, c:'#2f8a3e'}); }
          else { sfx('crash'); M.hits++; M.combo = 0; M.score = Math.max(0, M.score - 150); M.slow = .9; M.shake = .4; M.fx.push({s:o.kind === 'rock' ? '쿵! 바위!' : '우지끈! 가지!', t:1, c:'#d6372c'}); }
        }
      }
      if (dz < -80) o.done = true;
    }
    M.objs = M.objs.filter(o => o.y - M.y > -200);
    if (M.run >= DRIVE_SEC) { M.phase = 'end'; M.t = 0; finishDrive(); }
  } else if (M.phase === 'end') { if (M.t > 4) closeDrive(); }
  for (const p of M.puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 50; p.a -= dt * .8; }
  M.puffs = M.puffs.filter(p => p.a > 0);
  if (M.phase === 'run') for (const sd of [-1, 1]) M.puffs.push({x:960 + M.x * LANE + sd * rnd(40, 70), y:CAR_Y + rnd(-20, 10), vx:sd * rnd(260, 480), vy:rnd(40, 160), r:rnd(18, 30), a:.6});

}

  const M = MINI;

  const danger = x => bad.some(o => o.y - M.y < 380 && Math.abs((o.x - x) * LANE) < objHalf(o.kind) + 70);

  const qb = {S:3, A:2, B:1, C:0}[r.g];
  if (qb) G.trees.forEach(t => { if (t) t.bon += qb; });

const driveTree = {};
function drawDrive(){

const TIER_POWER = [0, 28, 55, 95];
function farmerPower(){ const f = farmer(); return f.atk + f.def * 1.5 + (f.hp - 100) / 5 + f.lv * 2; }
function raidTier(){
  const pw = farmerPower(); let t = 0;
  for (let i = 1; i < TIER_POWER.length; i++) if (pw >= TIER_POWER[i]) t = i;

// ----- F: 일하기 -----
function pressF(){
  if (inCombat()) { P.touchBlock = true; return; }
  if (!UI.free() || P.act > 0 || ssAnim) return;
  const t = findTarget(); if (!t) return;
  act(t);
}
function act(t){
  if (t.kind === 'go') { P.tgt = {x:t.x, y:t.y}; P.pend = t.pend; return; }
  if (t.kind === 'tree') {
    const k = taskFor(t.i);
    if (!k) { if (G.trees[t.i] && !AUTO) treeInfo(t.i); return; }
    if (k === 'plant' && G.money < SAPLING) { toast('돈이 모자라서 묘목을 못 사요.', 'bad'); return; }
    if (k === 'plant' && AUTO) { const opts = VAR_KEYS.filter(unlocked); G.selVar = opts[Math.floor(t.i / PER_ROW) % opts.length]; }
    const p = treePos(t.i);
    P.dir = Math.abs(p.x - P.x) > Math.abs(p.y - P.y) ? (p.x < P.x ? 2 : 3) : (p.y < P.y ? 1 : 0);
    P.actI = t.i; P.sw = .3; finishAct(); // 기다림 없이 바로
  }
  else if (t.kind === 'grandma') talkGrandma();
  else if (t.kind === 'chief') talkChief();
  else if (t.kind === 'npc') talkNpc(NPCS[t.n]);
  else if (t.kind === 'nongmak') uiNongmak();
  else if (t.kind === 'forage') pickForage(t.f);
  else if (t.kind === 'shed') uiStore();
  else if (t.kind === 'hanok') uiSave();
}
function finishAct(){
  const i = P.actI, r = doTask(i, 'me');
  if (!r) return;
  gainXp(r.k === 'harvest' ? 4 : 2);
  const p = treePos(i);
  if (r.k === 'plant' && blocked(P.x, P.y)) { P.y = p.y + 46; }
  const txt = {plant:'🌱 심었다!', prune:'✂️ 싹둑!', blossom:'🌸 꽃솎기!', thin:'🍏 솎았다!'}[r.k] || `🍎 ${r.g.name} ${r.bx}상자!`;
  floats.push({x:p.x, y:p.y - 160, s:txt, t:1.4, c:r.k === 'harvest' ? r.g.col : INK});
  if (!AUTO || !G.facts[r.k]) factCard(r.k);
}
function treeInfo(i){

// ----- 매 프레임 -----
function update(dt){
  if (UI.free() && speed > 0 && !ssAnim) advance(dt / DAY_SEC * 14 * speed * (inHunt(P.x, P.y) ? .1 : 1)); // 사냥터에선 시간이 천천히
  updateSS(dt);
  // 하루 이동
  let mx = 0, my = 0;
  if (UI.free() && !ssAnim) {
    if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
    if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
    if (joy.on) { mx = joy.x; my = joy.y; }
    if (mx || my) { P.tgt = null; P.pend = null; }
    else if (P.tgt) {
      const dx = P.tgt.x - P.x, dy = P.tgt.y - P.y, d = Math.hypot(dx, dy);
      if (d < 10) { P.tgt = null; if (P.pend) { const pd = P.pend; P.pend = null; act(pd); } }
      else { mx = dx / d; my = dy / d; }
    }
  }
  const sp = P.spd * (1 + farmer().spd / 100) * (P.blk ? .45 : 1), m = Math.hypot(mx, my);
  if (P.kb) { moveBy(P, P.kb.x * dt, P.kb.y * dt); P.kb.t -= dt; if (P.kb.t <= 0) P.kb = null; }
  else if (m > .1 && P.act <= 0) {
    const nx = mx / Math.max(1, m), ny = my / Math.max(1, m);
    const ox = P.x, oy = P.y;
    moveBy(P, nx * sp * dt, ny * sp * dt);
    P.walk += dt * 11;
    P.dir = Math.abs(nx) > Math.abs(ny) ? (nx < 0 ? 2 : 3) : (ny < 0 ? 1 : 0);
    if (Math.abs(nx) > .2) P.face = nx < 0 ? -1 : 1;
    const moved = Math.hypot(P.x - ox, P.y - oy);
    if (P.tgt && moved < .5) { P.stuck = (P.stuck || 0) + dt; if (P.stuck > .4) { P.stuck = 0; detour(); } } else P.stuck = 0;
    cam.ox *= .9; cam.oy *= .9;
  } else P.walk = 0;
  if (P.sw > 0) P.sw -= dt;
  // 인부
  if (workerS.on) {
    const dx = workerS.tx - workerS.x, dy = workerS.ty - workerS.y, d = Math.hypot(dx, dy);
    if (d > 4) { const s = Math.min(d, 320 * dt); workerS.x += dx / d * s; workerS.y += dy / d * s; workerS.walk += dt * 11; workerS.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0); }
    else workerS.walk = 0;
    if (workerS.act > 0) workerS.act -= dt;
    if (G.worker <= 0) { workerS.tx = SPOT.shed.x; workerS.ty = SPOT.shed.y + 30; if (d < 8) workerS.on = false; }
  }
  updateCritters(dt); updateVillagers(dt); updateHunt(dt);
  for (const f of flies) { f.t += dt; f.x += Math.cos(f.t * .7) * 40 * dt + 10 * dt; f.y += Math.sin(f.t * 1.3) * 30 * dt; if (f.x > WORLD_W) f.x = 0; }
  for (const f of floats) { f.t -= dt; f.y -= dt * 40; }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t <= 0) floats.splice(i, 1);
  for (const m2 of mist) { m2.a -= dt * .35; m2.r += dt * 18; }
  for (let i = mist.length - 1; i >= 0; i--) if (mist[i].a <= 0) mist.splice(i, 1);
  // 카메라
  if (!ssAnim) { cam.x += (P.x + cam.ox - cam.x) * Math.min(1, dt * 6); cam.y += (P.y - 60 + cam.oy - cam.y) * Math.min(1, dt * 6); }
  const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  cam.x = clamp(cam.x, WX0 + hw, WX1 - hw); cam.y = clamp(cam.y, WY0 + hh, worldBot() - hh);
}
function detour(){
  if (!P.tgt) return;
  const dx = P.tgt.x - P.x, dy = P.tgt.y - P.y;
  const cands = [[-dy, dx], [dy, -dx], [0, 1], [0, -1], [1, 0], [-1, 0]].map(([a, b]) => { const l = Math.hypot(a, b) || 1; return [P.x + a / l * 110, P.y + b / l * 110]; }).filter(([x, y]) => !blocked(x, y));
  if (!cands.length) { P.tgt = null; P.pend = null; return; }
  const [x, y] = cands[0];
  const real = P.tgt, pend = P.pend;
  P.tgt = {x, y}; P.pend = {kind:'go', x:real.x, y:real.y, pend};
}

// ----- 자동플레이 -----
let autoT = 0, autoIdle = 0;
function autoTick(dt){
  if (!AUTO || !UI.free() || P.act > 0 || ssAnim) return;
  autoT -= dt; if (autoT > 0) return; autoT = .2;
  if (P.tgt) return;
  for (const k of ['dis', 'pest']) if (sprayState(k).ok && G.money >= sprayCost()) { autoSpray(k); return; }
  if (sprayState('nutri').ok && G.week % 4 === 0 && G.money >= sprayCost() + 1000000) { autoSpray('nutri'); return; }
  for (const o of G.orders) if (canDeliver(o)) { deliver(o); return; }
  if (TASKS.plant.ok(G.week) && G.trees.some(t => !t) && G.money > 1500000) {
    const opts = VAR_KEYS.filter(unlocked); let n = 0;
    for (let i = 0; i < G.trees.length; i++) if (!G.trees[i] && G.money > 1500000) { G.selVar = opts[Math.floor(i / PER_ROW) % opts.length]; doTask(i, 'auto'); n++; }
    if (n) toast(`🌱 묘목 ${n}그루를 한꺼번에 심었어요.`, 'good');
    return;
  }
  autoBuy();
  const pend = activeTasks().reduce((s, a) => s + a.n, 0);
  if (pend > 30 && !G.worker && G.money > 3000000 && !(activeTasks().length === 1 && activeTasks()[0].k === 'plant')) hireWorker(3);
  if (G.errand && totalStock() >= G.errand.need) return walkTo('chief');
  const i = nearestTask(P, false);
  if (i >= 0 && !(taskFor(i) === 'plant' && G.money < 1500000 + SAPLING && G.year > 1)) { const p = treePos(i); P.tgt = {x:p.x, y:p.y + 46}; P.pend = {kind:'tree', i}; return; }
  if (G.quizDay !== weekId() && G.week % 4 === 2 && G.quizDay < weekId() - 21) return walkTo('grandma');
  if (!G.errand && G.year >= 2 && Math.random() < .3) return walkTo('chief');
  if (totalStock() > 0 && !G.orders.some(o => stockAtLeast(o.g) < o.n && G.week <= o.due)) { auction(Object.keys(G.stock)); return; }
  if (totalStock() > 60) { auction(Object.keys(G.stock)); return; }
  // 할 일이 없으면 잠깐 쉬었다가 다음 주로 (너무 빨리 넘기지 않게)
  autoIdle += .2;
  if (autoIdle >= 3) { autoIdle = 0; skipWeek(); }
}
function walkTo(who){ P.tgt = {x:SPOT[who].x + 60, y:SPOT[who].y + 30}; P.pend = {kind:who}; }
const AUTO_BUY = [['b', 'beehive'], ['d', 'flowers'], ['d', 'dog'], ['b', 'beehive'], ['b', 'wondumak'], ['b', 'beehive'], ['b', 'fence'], ['d', 'pond'], ['b', 'frostfan'], ['b', 'hailnet'], ['d', 'rabbit'], ['d', 'chicken'], ['d', 'cat'], ['d', 'blossom'], ['L'], ['b', 'cold'], ['d', 'jangdok'], ['d', 'sotdae'], ['b', 'drone'], ['L'], ['b', 'factory'], ['L'], ['b', 'sarang'], ['L'], ['L'], ['L'], ['L'], ['L'], ['L']];
function autoBuy(){
  for (const [t, k] of AUTO_BUY) {
    if (t === 'L') {
      if (G.rows >= MAX_ROWS) continue;
      if (G.money > ROW_PRICE + 4000000 && (G.week >= 49 || G.week <= 10)) { expandLand(); toast(`🗺️ 땅을 한 줄 넓혔어요 (${G.rows}줄)`, 'gold'); }
      return;
    }
    const def = t === 'b' ? BUILD[k] : DECO[k];
    const have = t === 'b' ? (G.b[k] || 0) >= (def.max || 1) : G.deco[k];
    if (have) continue;
    const reserve = G.year === 1 ? 6000000 : 3000000;
    if (G.money > def.price + reserve) { t === 'b' ? buyBuild(k) : buyDeco(k); }
    return;
  }
}

// ----- 입력 -----
function stagePt(e){ const r = $('#stage').getBoundingClientRect(), s = r.width / W; return {x:(e.clientX - r.left) / s, y:(e.clientY - r.top) / s}; }
function toWorld(p){ return {x:cam.x + (p.x - W / 2) / cam.z, y:cam.y + (p.y - H / 2) / cam.z}; }
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'KeyF' && !e.repeat && !inCombat()) pressF();
  if (e.code === 'Space' || e.code === 'KeyJ') { e.preventDefault(); if (UI.free()) heroAttack(); }
  if (e.code === 'KeyQ' && UI.free()) heroGong();
  if (e.code === 'KeyI' && !e.repeat) { if (UI.modal && UI.modal.inv) UI.close(); else if (UI.free()) uiInv(); }
  if (e.code === 'KeyP') { if (UI.free()) { speed = speed ? 0 : 1; updateHUD(true); } }
  if (e.code === 'Escape' && UI.modal && !UI.modal.noX) UI.close();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const p = stagePt(e); ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) drag = {x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = stagePt(e); ptrs.set(e.pointerId, p);
  if (drag) {
    if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
    if (drag.moved) { cam.ox -= (p.x - drag.x) / cam.z; cam.oy -= (p.y - drag.y) / cam.z; cam.ox = clamp(cam.ox, -900, 900); cam.oy = clamp(cam.oy, -700, 700); }
    drag.x = p.x; drag.y = p.y;
  }
});
const endPtr = e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === 'pointerup' && UI.free()) clickWorld(toWorld(stagePt(e)));
  if (!ptrs.size) drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => e.preventDefault(), {passive:false}); // 확대·축소 없음 (시점 고정)
function clickWorld(w){
  if (ssAnim) return;
  // 나무나 사람을 눌렀으면 거기로 가서 일하기
  let best = null, bd = 60 * 60;
  for (let i = 0; i < G.trees.length; i++) {
    const p = treePos(i), d = (p.x - w.x) ** 2 + ((p.y - 70 - w.y) * .55) ** 2;
    if (d < bd) { bd = d; best = {kind:'tree', i, x:p.x, y:p.y + 46}; }
  }
  for (const k of ['grandma', 'chief']) { const s = SPOT[k]; if ((s.x - w.x) ** 2 + (s.y - 40 - w.y) ** 2 < 70 * 70) best = {kind:k, x:s.x + 60, y:s.y + 30}; }
  for (const n of NPCS) if ((n.x - w.x) ** 2 + (n.y - 45 - w.y) ** 2 < 55 * 55) best = {kind:'npc', n:n.i, x:n.x + 55, y:n.y + 20};
  if (Math.abs(w.x - SPOT.shed.x) < 80 && w.y < SPOT.shed.y + 5 && w.y > SPOT.shed.y - 160) best = {kind:'shed', x:SPOT.shed.x, y:SPOT.shed.y + 40};
  for (const m of MONS) if (m.hp > 0 && (m.x - w.x) ** 2 + (m.y - 40 - w.y) ** 2 < 90 * 90) { if (Math.hypot(m.x - P.x, m.y - P.y) < 170) { P.face = m.x < P.x ? -1 : 1; heroAttack(); P.tgt = null; } else { P.tgt = {x:m.x, y:m.y}; P.pendMon = m; } P.pend = null; return; }
  P.pendMon = null;
  if (best) { P.tgt = {x:best.x, y:best.y}; P.pend = best.kind === 'tree' && !taskFor(best.i) && !G.trees[best.i] ? null : best; }
  else { P.tgt = {x:w.x, y:w.y}; P.pend = null; }
  floats.push({x:w.x, y:w.y, s:'·', t:.4});
}

// 터치: 조이스틱·F 버튼
if (isTouch) document.body.classList.add('touch');
const joyEl = $('#joy');
joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.on = false; joy.id = null; joyEl.firstElementChild.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
function joyMove(e){
  const r = joyEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  joy.on = l > .12; joy.x = dx; joy.y = dy;
  joyEl.firstElementChild.style.transform = `translate(${dx * 95}px,${dy * 95}px)`;
}
$('#fBtn').addEventListener('pointerdown', e => { e.preventDefault(); pressF(); });
const fUp = () => { P.touchBlock = false; };
$('#atkBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (UI.free()) heroAttack(); });
$('#gongBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (UI.free()) heroGong(); });
$('#fBtn').addEventListener('pointerup', fUp); $('#fBtn').addEventListener('pointercancel', fUp); $('#fBtn').addEventListener('pointerleave', fUp);
$('#fsBtn').onclick = () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) Promise.resolve(req.call(el)).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => toast('이 브라우저는 전체화면을 막아요. 아이폰은 공유 → 홈 화면에 추가로 열면 꽉 차게 보여요.'));
  else toast('아이폰은 공유 → 홈 화면에 추가로 열면 주소창 없이 꽉 차게 보여요.');
};
const miniEl = $('#mini');
miniEl.addEventListener('pointerdown', e => { const p = stagePt(e);

  if (p.x < W / 2) MINI.touchL = true; else MINI.touchR = true;
  if (p.y < H * .35) MINI.touchU = true; else if (p.y > H * .8) MINI.touchD = true; });
const miniUp = () => { MINI.touchL = MINI.touchR = MINI.touchU = MINI.touchD = false; };
miniEl.addEventListener('pointerup', miniUp); miniEl.addEventListener('pointercancel', miniUp); miniEl.addEventListener('pointerleave', miniUp);
setInterval(() => { const f = $('#fLab'); if (f) f.textContent = inCombat() ? '🛡️ 막기' : targetLabel(curTarget) || '일하기'; }, 300);

// 무대 크기 맞추기
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  const st = $('#stage');
  st.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && G) saveLocal(); });
document.addEventListener('gesturestart', e => e.preventDefault());

// ----- 시작 -----
function boot(){
  fit(); bindUI();
  let loaded = false;
  const s = store.get(SAVE_KEY, null);
  if (s) { try { deserialize(s); loaded = true; } catch (e) {} }
  if (!loaded) newGame();
  afterLoad();
  if (!loaded) uiHeroPick(intro); else toast(`🍎 ${G.year}년차 ${G.week}주차에서 이어 해요.`);
  setInterval(saveLocal, 30000);
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    try {
      if (MINI.on) updateDrive(dt);
      else { update(dt); render(ctx, dt, T); updateHUD(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('20px Jua'), new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
else boot();

</script>
