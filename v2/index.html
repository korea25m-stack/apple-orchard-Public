  if (keyWait) { e.preventDefault(); setKey(e.code); return; } // 키 설정 창에서 새 키 받는 중
  if (swallow[e.code]) { e.preventDefault(); return; } // 창 닫을 때 누른 키는 뗄 때까지 무시
  // 2026-10-13 창이 떠 있을 때 F·Space(일하기·공격 키)를 누르면 확인 버튼을 눌러 닫아요
  if (UI.modal && !e.repeat && (e.code === 'KeyF' || e.code === 'Space' || bound('interact', e.code) || bound('attack', e.code)) && confirmModal()) { e.preventDefault(); swallow[e.code] = true; return; }
  if (UI.modal && (e.code === 'Space' || bound('attack', e.code))) e.preventDefault();
  keys[e.code] = true;
  // 2026-10-13 키 설정(KB)에 따라: 공격·일하기(농막에선 자기)·꽹과리·가방·멈춤
  const acts = actsOf(e.code);
  if (acts.length && (e.code === 'Space' || e.code === 'Tab')) e.preventDefault();
  if (!e.repeat) for (const a of acts) pressAct(a);
  else if (acts.includes('attack')) pressAct('attack');
  if (e.code === 'Escape' && UI.modal && !UI.modal.noX) UI.close();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { if (swallow[e.code]) { e.preventDefault(); delete swallow[e.code]; } keys[e.code] = false; });
const swallow = {};
// 확인 버튼 찾기: 농막 자기 → 알림·대화 '알겠어요/고마워요/좋아요' → 버튼이 하나뿐인 창
function confirmModal(){
  const o = UI.modal; if (!o || !o.el) return false;
  const pick = ['#nmSleep', '#popOk', '#tOk', '#cOk'].map(s => o.el.querySelector(s)).find(b => b && !b.disabled);
  const btns = o.footEl ? [...o.footEl.querySelectorAll('button')].filter(b => !b.disabled && b.offsetParent !== null) : [];
  const b = pick || (btns.length === 1 && !o.body.querySelector('input,textarea,[data-a]') ? btns[0] : null);
  if (!b) return false;
  b.click(); return true;
}
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in MB) MB[k] = false; });
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') MB['Mouse' + e.button] = false; });

const ptrs = new Map(); let drag = null, pinch = null;
// 마우스 버튼 눌림: 키 설정에 따라 공격·막기 등. true면 걷기·드래그로 쓰지 않아요
function mouseBtnDown(btn, p){
  const code = 'Mouse' + btn; MB[code] = true;
  const w = toWorld(p), acts = actsOf(code).filter(a => !['block', 'up', 'down', 'left', 'right'].includes(a));
  if (btn !== 0) { for (const a of acts) pressAct(a, {wx:w.x}); return true; }
  if (acts.includes('attack') && fightMode() && UI.free()) { for (const a of acts) pressAct(a, {wx:w.x}); return true; }
  for (const a of acts) if (a !== 'attack') pressAct(a);
  return false;
}
// 다른 버튼을 누른 채로 또 누르면 pointerdown이 안 와요 → pointermove로 알아채요
cv.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || e.button < 0) return;
  const mask = [1, 4, 2, 8, 16][e.button] || 0, code = 'Mouse' + e.button;
  if (e.buttons & mask) { if (!MB[code]) mouseBtnDown(e.button, stagePt(e)); } else MB[code] = false;
});
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const p = stagePt(e);
  // 2026-10-13 마우스 버튼도 키 설정대로 (기본: 왼쪽 = 공격, 오른쪽 = 막기)
  if (e.pointerType === 'mouse' && mouseBtnDown(e.button, p)) { e.preventDefault(); return; }
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) drag = {x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = stagePt(e); ptrs.set(e.pointerId, p);
  if (drag) {
    if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
    if (drag.moved) { cam.ox -= (p.x - drag.x) / cam.z; cam.oy -= (p.y - drag.y) / cam.z; cam.ox = clamp(cam.ox, -900, 900); cam.oy = clamp(cam.oy, -700, 700); }
    drag.x = p.x; drag.y = p.y;
  }
});
const endPtr = e => {
  if (e.pointerType === 'mouse') MB['Mouse' + e.button] = false;
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === 'pointerup' && UI.free()) clickWorld(toWorld(stagePt(e)));
  if (!ptrs.size) drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => e.preventDefault(), {passive:false}); // 확대·축소 없음 (시점 고정)
function clickWorld(w){
  if (ssAnim) return;
  // 나무나 사람을 눌렀으면 거기로 가서 일하기
  let best = null, bd = 60 * 60;
  for (let i = 0; i < G.trees.length; i++) {
    const p = treePos(i), d = (p.x - w.x) ** 2 + ((p.y - 70 - w.y) * .55) ** 2;
    if (d < bd) { bd = d; best = {kind:'tree', i, x:p.x, y:p.y + 46}; }
  }
  for (const k of ['grandma', 'chief']) { const s = SPOT[k]; if ((s.x - w.x) ** 2 + (s.y - 40 - w.y) ** 2 < 70 * 70) best = {kind:k, x:s.x + 60, y:s.y + 30}; }
  for (const n of NPCS) if ((n.x - w.x) ** 2 + (n.y - 45 - w.y) ** 2 < 55 * 55) best = {kind:'npc', n:n.i, x:n.x + 55, y:n.y + 20};
  if ((Math.abs(w.x - SPOT.shed.x) < 80 * shedS() && w.y < SPOT.shed.y + 5 && w.y > SPOT.shed.y - 160 * shedS()) || (Math.abs(w.x - SPOT.shed.x - 70 * shedS() - 58) < 62 && w.y < SPOT.shed.y + 10 && w.y > SPOT.shed.y - 170)) best = {kind:'shed', x:SPOT.shed.x, y:SPOT.shed.y + 40};
  for (const m of MONS) if (m.hp > 0 && (m.x - w.x) ** 2 + (m.y - 40 - w.y) ** 2 < 90 * 90) { if (Math.hypot(m.x - P.x, m.y - P.y) < 170) { P.face = m.x < P.x ? -1 : 1; heroAttack(); P.tgt = null; } else { P.tgt = {x:m.x, y:m.y}; P.pendMon = m; } P.pend = null; return; }
  P.pendMon = null;
  if (best) { P.tgt = {x:best.x, y:best.y}; P.pend = best.kind === 'tree' && !taskFor(best.i) && !G.trees[best.i] ? null : best; }
  else { P.tgt = {x:w.x, y:w.y}; P.pend = null; }
  floats.push({x:w.x, y:w.y, s:'·', t:.4});
}

// 터치: 조이스틱·F 버튼
if (isTouch) document.body.classList.add('touch');
const joyEl = $('#joy');
joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.on = false; joy.id = null; joyEl.firstElementChild.style.transform = ''; };
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);
function joyMove(e){
  const r = joyEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  joy.on = l > .12; joy.x = dx; joy.y = dy;
  joyEl.firstElementChild.style.transform = `translate(${dx * 95}px,${dy * 95}px)`;
}
$('#fBtn').addEventListener('pointerdown', e => { e.preventDefault(); pressF(); });
const fUp = () => { P.touchBlock = false; };
$('#atkBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (UI.free()) heroAttack(); });
$('#gongBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (UI.free()) heroGong(); });
$('#fBtn').addEventListener('pointerup', fUp); $('#fBtn').addEventListener('pointercancel', fUp); $('#fBtn').addEventListener('pointerleave', fUp);
$('#fsBtn').onclick = () => {
  const d = document;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) Promise.resolve(req.call(el)).then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => toast('이 브라우저는 전체화면을 막아요. 아이폰은 공유 → 홈 화면에 추가로 열면 꽉 차게 보여요.'));
  else toast('아이폰은 공유 → 홈 화면에 추가로 열면 주소창 없이 꽉 차게 보여요.');
};
const miniEl = $('#mini');
miniEl.addEventListener('pointerdown', e => { const p = stagePt(e);

  if (p.x < W / 2) MINI.touchL = true; else MINI.touchR = true;
  if (p.y < H * .35) MINI.touchU = true; else if (p.y > H * .8) MINI.touchD = true; });
const miniUp = () => { MINI.touchL = MINI.touchR = MINI.touchU = MINI.touchD = false; };
miniEl.addEventListener('pointerup', miniUp); miniEl.addEventListener('pointercancel', miniUp); miniEl.addEventListener('pointerleave', miniUp);
setInterval(() => { const f = $('#fLab'); if (f) f.textContent = inCombat() ? '🛡️ 막기' : targetLabel(curTarget) || '일하기'; }, 300);

// 무대 크기 맞추기
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  const st = $('#stage');
  st.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && G) saveLocal(); });
document.addEventListener('gesturestart', e => e.preventDefault());

// ----- 시작 -----
function boot(){
  fit(); bindUI();
  let loaded = false;
  const s = store.get(SAVE_KEY, null);
  if (s) { try { deserialize(s); loaded = true; } catch (e) {} }
  if (!loaded) newGame();
  afterLoad();
  if (!loaded) uiHeroPick(intro); else toast(`🍎 ${G.year}년차 ${G.week}주차에서 이어 해요.`);
  setInterval(saveLocal, 30000);
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    try {
      if (MINI.on) updateDrive(dt);
      else { const hs = FX.stop > 0; FX.stop = Math.max(0, FX.stop - dt); update(hs ? dt * .06 : dt); updateFx(dt); render(ctx, dt, T); updateHUD(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('20px Jua'), new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
else boot();
