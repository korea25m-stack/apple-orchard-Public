<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2a20">
<title>과수원키우기</title>
<meta name="description" content="사과나무를 심고 키워서 수확하는 과수원 게임">
<meta property="og:title" content="과수원키우기">
<meta property="og:description" content="사과나무를 심고 키워서 수확하는 과수원 게임">
<meta property="og:site_name" content="과수원키우기">
<meta property="og:type" content="website">
<meta name="twitter:title" content="과수원키우기">
<meta name="application-name" content="과수원키우기">
<meta name="apple-mobile-web-app-title" content="과수원키우기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 1920x1080 고정 무대를 창에 맞춰 축소. 그림은 캔버스, 글자는 위에 얹은 카드. */
:root{
  --ink:#2a1c17;          /* 셀화 외곽선·글자 */
  --paper:#fffaf1;        /* 카드 바탕 */
  --apple:#e8423a;        /* 대표색 */
  --leaf:#4fae5a;         /* 잎 */
  --sky:#7cc7f2;          /* 하늘 */
  --sun:#ffd25e;          /* 강조 노랑 */
  --plum:#8c5cf0;         /* 자동플레이 */
  --muted:#7b6a60;
  --line:#ead9c6;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#1d2a20;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#8fd16a}
#cv,#mini{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#mini{z-index:40}
.battleOn #joy,.battleOn #fBtn{z-index:50}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* 셀화 카드: 두꺼운 외곽선 + 딱 떨어지는 그림자 */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,28,23,.85)}
.hud{position:absolute;z-index:10}

#wx{left:18px;top:16px;width:330px;padding:14px 16px 12px;transform:scale(.8);transform-origin:0 0} /* 2026-10-13 왼쪽 위, 조금 작게 */
#wx .date{font-family:var(--display);font-size:24px;line-height:1.15}
#wx .sub{font-size:16px;color:var(--muted);margin-top:2px}
#wx .row{display:flex;align-items:center;gap:12px;margin-top:10px}
#wx .big{font-size:42px;line-height:1}
#wx .temp{font-family:var(--display);font-size:30px}
#wx .wind{display:flex;align-items:center;gap:6px;font-size:16px;margin-left:auto;text-align:right}
#wx .arrow{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:#e8f6ff;display:grid;place-items:center;font-size:20px;transition:transform .6s}
.risk{margin-top:9px}
.risk .lab{display:flex;justify-content:space-between;font-size:16px;font-family:var(--display)}
.bar{height:13px;border:2.5px solid var(--ink);border-radius:9px;background:#f1e6d8;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
#wx .shield{margin-top:9px;font-size:15px;background:#e5f7ea;border:2px solid #7cc58a;border-radius:10px;padding:4px 8px}

#top{right:290px;top:18px;display:flex;gap:12px;align-items:stretch} /* 오른쪽 끝은 작은 지도 자리 */
#top .pill{display:flex;align-items:center;gap:8px;padding:8px 18px;font-family:var(--display);font-size:26px}
#clock{display:flex;align-items:center;gap:6px;padding:6px 10px}
#clock .t{font-family:var(--display);font-size:26px;min-width:150px;text-align:center}
.sp{width:46px;height:42px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:18px}
.sp.on{background:var(--sun)}

#todo{right:20px;top:316px;width:252px;box-sizing:border-box;padding:10px 10px} /* 2026-10-13 작은 지도와 같은 폭 */
#todo h3{font-size:21px!important}
#todo li{font-size:15px!important;padding:6px 7px!important;gap:6px!important;word-break:keep-all;line-height:1.25}
#todo li .n{font-size:15px!important}
#todo li .ic{font-size:19px!important}
#todo h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;display:flex;justify-content:space-between;cursor:pointer}
#todo ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:440px;overflow:auto}
#todo li{display:flex;align-items:center;gap:8px;font-size:17px;padding:7px 9px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
#todo li .n{margin-left:auto;font-family:var(--display);font-size:17px;white-space:nowrap}
#todo li.hot{border-color:#ff8a7a;background:#fff0ec}
#todo li.done{opacity:.55}
#todo li .ic{font-size:22px}
#todo.fold ul{display:none}

#bar{left:50%;transform:translateX(-50%) scale(.9);transform-origin:50% 100%;bottom:14px;display:flex;gap:8px;padding:9px 12px}
.tb{width:104px;height:92px;border-radius:16px;border:2.5px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.tb b{font-size:36px;font-weight:400;line-height:1}
.tb:hover{background:#fff6d6}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tb.alert{background:#ffe1dc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#ffb8ad}}

@keyframes glow{50%{filter:brightness(1.18)}}
#helpBtn{left:20px;bottom:18px;padding:10px 16px;font-size:20px}
#help{left:20px;bottom:80px;padding:14px 18px;font-size:17px;line-height:1.7;width:330px}
#help b{font-family:var(--display);font-weight:400;display:inline-block;min-width:96px;margin-right:6px}
.kbt{width:100%;border-collapse:collapse;font-size:18px}.kbt td,.kbt th{padding:6px 8px;border-bottom:1.5px dashed #e3d8c4;text-align:left}.kbt .kbb{min-width:250px;font-size:17px;padding:6px 10px}

#toasts{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 20px;font-size:21px;font-family:var(--display);box-shadow:0 5px 0 var(--ink);animation:tin .25s;max-width:820px;text-align:center}
.toast.good{background:#e9fbe9}.toast.bad{background:#ffe7e2}.toast.gold{background:#fff3c4}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}

#modalWrap{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(30,20,15,.42)}
#modalWrap.on{display:flex}
.modal{width:980px;max-height:900px;display:flex;flex-direction:column;padding:0;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:3px solid var(--ink);background:#ffe9a8}
.modal .mh h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.modal .mh .x{margin-left:auto;width:52px;height:52px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-size:26px}
.modal .mb{padding:18px 22px;overflow:auto;font-size:19px;line-height:1.55}
.modal .mf{padding:14px 22px;border-top:2px dashed var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--apple);color:#fff}
.btn.go{background:#5cc46c;color:#fff}
.btn.y{background:var(--sun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--body);font-size:17px;line-height:1.4}
.opt .t{font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:8px}
.opt .p{font-family:var(--display);font-size:20px;color:#b2332b}
.rowpull{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.rp{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;font-size:16px}.rp>span{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.rp .dot{display:inline-block;flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}.btn.danger{background:#ff6b57;color:#fff}
.opt.sel{background:#fff3c4;box-shadow:0 0 0 4px var(--sun)}
.opt.lock{opacity:.5}
.opt.have{background:#e9fbe9}
.gstat{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--display);font-size:21px;background:#fff7dc;border:2.5px solid var(--ink);border-radius:16px;padding:10px 16px}
.xpb{display:inline-block;width:160px;height:16px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}.xpb i{display:block;height:100%;background:#ffb13b}
.ivh{font-family:var(--display);font-size:24px;margin:16px 2px 8px}.ivh small{font-size:15px;color:var(--muted)}
.ivg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ivc{position:relative;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default}
.ivc[data-eq]{cursor:pointer}.ivc.on{background:#fff3c4;box-shadow:0 0 0 3px #ffd25e}
.ivc i{font-style:normal;font-size:44px;line-height:1.1}.ivc b{font-family:var(--display);font-size:17px;font-weight:400}.ivc small{font-size:14px;color:var(--muted)}
.ivn{position:absolute;right:8px;top:6px;font-family:var(--display);font-size:20px;color:#d6372c}
.ivwrap{display:flex;gap:16px;margin-top:12px;align-items:flex-start}.ivside{flex:1;min-width:0}.ivg.g4{grid-template-columns:repeat(4,1fr)}
.doll{position:relative;width:330px;height:470px;flex:none;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;background:#fffaf1}
.doll canvas{display:block}.dstat{position:absolute;left:0;right:0;bottom:0;padding:10px 6px;text-align:center;font-family:var(--display);font-size:17px;background:#fff3c4;border-top:2.5px solid var(--ink)}
.dslot{position:absolute;width:68px;height:80px;border:2.5px dashed var(--ink);border-radius:14px;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.dslot small{font-size:11px;line-height:1.1;text-align:center}.dslot.want{border-color:#2f8a3e;background:#e8f8e0}.dslot.hov{box-shadow:0 0 0 4px #ffd25e;transform:scale(1.06)}
.ivc.drag{cursor:grab;touch-action:none}.dghost{position:fixed;z-index:9999;pointer-events:none;width:72px;height:72px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ivt{font-size:13px;background:#ffd25e;border:1.5px solid var(--ink);border-radius:8px;padding:1px 6px}.ivt.off{background:#eee}
.hpg{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hpc h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.hpr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hpk{border:2.5px solid var(--ink);border-radius:16px;background:#f3fbe8;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:16px;cursor:pointer}
.hpk canvas{width:110px;height:183px}.hpk.on{background:#fff3c4;box-shadow:0 0 0 4px #ffd25e;transform:translateY(-3px)}
.hpn{display:flex;align-items:center;gap:14px;margin-top:16px;font-family:var(--display);font-size:22px}
.hpn input{font:inherit;font-size:24px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;width:260px}.hpn small{font-family:var(--body);font-size:15px;color:var(--muted)}
.snd{display:flex;align-items:center;gap:14px;margin:10px 0;font-family:var(--display);font-size:22px}.snd b{width:150px;font-weight:400}.snd input{flex:1;accent-color:#e8423a}.snd span{width:40px;text-align:right}.snd .btn{width:96px}
.townLock{background:#fff1e6;border:2px solid #ff9a5a;border-radius:12px;padding:8px 14px;margin:0 0 10px;font-family:var(--display);font-size:19px;color:#b2482b}
.offerCmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.offerCmp>div{background:#fff6e6;border:2px solid #e8d4b0;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}.offerCmp small{font-size:15px;color:var(--muted)}.offerCmp b{font-family:var(--display);font-size:26px}.offerCmp span{font-size:16px}
.offerVerdict{font-family:var(--display);font-size:22px;margin:12px 0 4px;text-align:center}.offerVerdict.good{color:#2f8a3e}.offerVerdict.bad{color:#c4402f}
.gnote{font-size:16px;color:var(--muted);margin:10px 2px}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gslot{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:10px 12px}
.gh{font-family:var(--display);font-size:22px;margin-bottom:6px}.gh small{font-size:16px;color:var(--muted)}
.gi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 4px;border-top:1.5px dashed #e3d8c4;font-size:15px}
.gi .gimg{flex:none;background:#fffaf1;border:2px solid #e3d8c4;border-radius:12px}
.gimg.g10{border-color:#ffd23a!important;animation:g10 1.4s ease-in-out infinite alternate}@keyframes g10{from{box-shadow:0 0 4px 1px rgba(255,210,58,.6);filter:brightness(1)}to{box-shadow:0 0 14px 5px rgba(255,220,90,.95);filter:brightness(1.15)}}.gi .gtx{flex:1;min-width:0}
.gsb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.btn.sm{font-size:14px!important;padding:4px 9px!important;border-width:2px}.btn.warn{background:#ff6b57;color:#fff}
.ivc .gsb{justify-content:center}
.gi.on{background:#fff3c4;border-radius:10px}.gi.lock{opacity:.55}.gi .btn{font-size:16px;padding:6px 10px;white-space:nowrap}
.gs{color:#b2332b;font-family:var(--display)}.gd{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:9px 18px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:20px}
.tab.on{background:var(--sun)}
table.tbl{width:100%;border-collapse:collapse;font-size:19px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left}
.tbl th{font-family:var(--display);font-weight:400;color:var(--muted)}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);vertical-align:-3px;margin-right:6px}
.fact{background:#eef8ff;border:2.5px solid #7fb8e0;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:18px}
.big-emoji{font-size:84px;text-align:center;line-height:1.1}
textarea{width:100%;box-sizing:border-box;height:110px;font-size:15px;border:2.5px solid var(--ink);border-radius:12px;padding:8px;font-family:monospace}

/* 경매 */
.bidders{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.bidder{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:8px;text-align:center;font-size:16px;transition:transform .2s}
.bidder canvas{width:72px;height:72px;display:block;margin:0 auto}
.bidder .bp{font-family:var(--display);font-size:20px}
.bidder.win{background:#fff3c4;transform:scale(1.07);box-shadow:0 0 0 4px var(--sun)}
.bidder.big{background:#ffe0f0}
.ticker{font-family:var(--display);font-size:44px;text-align:center}
/* 2026-10-14 경매 쉽게: 출하 큰 버튼 4개 + 저절로 이어지는 경매 + 끝나면 번 돈 크게 */
.shQ{font-family:var(--display);font-size:28px;text-align:center;margin:2px 0 14px}
.shPick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.shCard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:3px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.shCard:hover{transform:translateY(-3px)}
.shCard i{font-style:normal;font-size:38px;line-height:1.1}
.shCard b{font-family:var(--display);font-weight:400;font-size:30px}
.shCard small{font-size:16px;opacity:.7}
.shCard span{font-family:var(--display);font-size:22px;margin-top:4px;background:#fff3c4;border-radius:10px;padding:2px 12px}
.shCard.on{background:#ffe9a8;box-shadow:0 0 0 5px var(--sun);transform:scale(1.04)}
.shSum{font-family:var(--display);font-size:30px;text-align:center;margin:18px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.shSum small{font-family:inherit;font-size:18px;opacity:.7}
.shChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 10px}
.shChip{background:#fff;border:2px solid #e3d6bd;border-radius:12px;padding:3px 10px;font-size:17px}
.shMore{margin-top:8px;font-size:17px}.shMore summary{cursor:pointer;opacity:.75;padding:4px 0}
.btn.shGo{font-size:26px;padding:12px 34px}
.aHead{display:flex;align-items:center;gap:14px}.aHead .dot{width:28px;height:28px}
.aHead b{font-family:var(--display);font-size:28px;font-weight:400}.aProg{margin-left:auto;font-family:var(--display);font-size:22px}
.aBar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin:8px 0;overflow:hidden}.aBar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.aTot{text-align:center;font-size:22px;font-family:var(--display)}
.aDone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.aDone>i{font-style:normal;font-size:64px}.aDone>b{font-family:var(--display);font-weight:400;font-size:32px}
.aMoney{font-family:var(--display);font-size:60px;color:#c47a00}
.aList{display:flex;flex-direction:column;gap:6px;min-width:520px;margin-top:6px}
.aList>div{display:flex;align-items:center;gap:8px;font-size:19px;border-bottom:1.5px dashed #e3d6bd;padding:4px 2px}.aList em{margin-left:auto;font-style:normal;font-family:var(--display)}

/* 대화 */
.talk{display:flex;gap:18px;align-items:flex-start}
.talk canvas{flex:none;border:3px solid var(--ink);border-radius:18px;background:#d8f0ff}
.talk .bubble{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:21px;line-height:1.55;min-height:120px}
.talk .who{font-family:var(--display);font-size:24px;margin-bottom:4px}
.quiz{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.quiz .btn{text-align:left}

/* 전투 */
.battle canvas{width:100%;border:3px solid var(--ink);border-radius:16px;display:block}
.hp{display:flex;gap:16px;margin:10px 0}
.hp>div{flex:1}
.hp .bar{height:18px}
.blog{min-height:56px;font-size:21px;font-family:var(--display);text-align:center;padding:6px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.acts .btn{font-size:19px;padding:10px 6px}

/* 터치 */

  n = Math.round(n);

  if (n >= 100000000) return s + (n / 100000000).toFixed(n % 100000000 ? 2 : 0).replace(/\.?0+$/,'') + '억원';

};

function jo(w, a, b){ const k = w.replace(/[^가-힣]+$/, ''), c = k.charCodeAt(k.length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b); }

function weekLabel(w){
  const doy = (w - 1) * 7 + 3;
  const md = [31,28,31,30,31,30,31,31,30,31,30,31];
  let m = 0, d = doy;
  while (d >= md[m]) { d -= md[m]; m++; if (m > 11) { m = 11; break; } }
  return {m: m + 1, wk: Math.floor(d / 7) + 1};
}
function seasonOf(w){
  if (w <= 9 || w >= 49) return 'winter';
  if (w <= 21) return 'spring';
  if (w <= 37) return 'summer';
  return 'autumn';
}

// ----- 날씨 -----
function genWeather(first){
  const w = G.week, x = G.wx;
  const clim = 11.5 - 14.5 * Math.cos(2 * Math.PI * (w - 3) / 52);
  const monsoon = w >= 26 && w <= 31;
  let pRain = monsoon ? .55 : (w >= 14 && w <= 42 ? .24 : .14);
  if (x.rain) pRain += .12;
  x.rain = Math.random() < pRain;
  x.temp = Math.round((clim + rnd(-3, 3)) * 10) / 10;
  x.hum = Math.round(x.rain ? rnd(84, 98) : rnd(42, 74) + (monsoon ? 10 : 0));
  x.dir = (x.dir + rint(-1, 1) + 8) % 8;
  x.wind = Math.round(clamp(x.wind + rnd(-2.2, 2.2), 0.5, 10) * 10) / 10;
  if (Math.random() < .25) x.wind = Math.round(rnd(1, 4) * 10) / 10;
  x.sky = x.rain ? (x.temp < 1 ? 'snow' : 'rain') : (Math.random() < .35 ? 'cloud' : 'sun');
  if (first) return;
  if (w >= 14 && w <= 42) {
    x.dis = x.dis * .68 + (x.rain ? 19 : 0) + (x.hum > 80 ? 4 : 0) + (x.temp >= 16 && x.temp <= 28 ? 3 : 0);
    x.pest = x.pest * .72 + (x.temp > 24 ? 10 : x.temp > 18 ? 6 : 2) + (!x.rain && x.hum < 62 ? 6 : 0) - (x.rain ? 8 : 0);
  } else { x.dis *= .6; x.pest *= .6; }
  x.dis = Math.round(clamp(x.dis, 0, 100)); x.pest = Math.round(clamp(x.pest, 0, 100));
}
const riskLevel = v => v >= RISK_HIGH ? '높음' : v >= 40 ? '보통' : '낮음';
const protectedFor = k => G.prot[k] >= absDay();

// ----- 나무 작업 -----
function taskFor(i){
  const t = G.trees[i], w = G.week;
  if (!t) return TASKS.plant.ok(w) ? 'plant' : null;
  if (t.fr && w >= VARS[t.v].hv[0] && w <= VARS[t.v].hv[1]) return 'harvest';
  if (t.fr && !t.th && TASKS.thin.ok(w)) return 'thin';
  if (t.age >= 1 && !t.bl && TASKS.blossom.ok(w)) return 'blossom';
  if (!t.pr && TASKS.prune.ok(w) && (t.age >= 1 || w >= 49)) return 'prune';
  return null;
}
function newTree(v){ return {v, age:0, y2:1, pr:false, bl:false, th:false, fr:0, bx:0, bon:0, dmg:0, s:rint(1, 9999)}; }

// 작업 실행. who: 'me' | 'worker' | 'auto'
function doTask(i, who){
  const k = taskFor(i); if (!k) return null;
  if (who === 'me' && typeof sfx === 'function') sfx({plant:'plant', harvest:'pick', prune:'snip', thin:'snip', blossom:'snip'}[k] || 'snip');
  const t = G.trees[i];
  if (k === 'plant') {
    const v = unlocked(G.selVar) ? G.selVar : 'fuji';
    if (G.money < SAPLING) { if (who !== 'worker') toast('돈이 모자라서 묘목을 못 사요.', 'bad'); return null; }
    G.money -= SAPLING;
    G.trees[i] = newTree(v);
    G.planted[v] = 1;
    unlock('plant1');
    if (Object.keys(G.planted).length >= 5) unlock('allvar');
    if (G.trees.every(x => x)) unlock('orchard');
    return {k};
  }
  if (k === 'prune') t.pr = true;
  if (k === 'blossom') t.bl = true;
  if (k === 'thin') t.th = true;
  if (k === 'harvest') {
    // 2026-10-15 미니게임 등급 배율(prQ·blQ·thQ, 인부·예전 저장은 1)를 반영해요
    let q = 38 + Math.round((t.pr ? 14 * (t.prQ || 1) : 0) + (t.bl ? 10 * (t.blQ || 1) : 0) + (t.th ? 14 * (t.thQ || 1) : 0)) + Math.min(3, G.nutri) * 4
          + t.bon - t.dmg + (t.age >= 3 ? 3 : 0) + (who === 'me' ? farmer().skill : Math.floor(farmer().skill / 2)) + rnd(-4, 4);
    q = Math.round(clamp(q, 5, 99));
    const g = gradeOf(q);
    let bx = t.bx; if (t.dmg > 20 && bx > 1) bx--;
    const bin = AUTO ? G.stock : who === 'me' ? (G.carry = G.carry || {}) : (G.raw = G.raw || {});
    // 2026-10-15 달 요청: 한 나무에서도 특·상·보통·하가 섞여 나와요(상자마다 품질 ±12) → 분류 벨트에 여러 등급이 섞여 올라와요
    for (let b = 0; b < bx; b++) { const key = t.v + '|' + rollGrade(q); bin[key] = (bin[key] || 0) + 1; }
    if (Math.random() < .3) G.blem = (G.blem || 0) + rint(1, 2); // 떨어지거나 부딪힌 흠과
    G.stats.boxes += bx; G.stats.yearBoxes += bx;
    if (q > G.stats.bestQ) G.stats.bestQ = q;
    unlock('harvest1');
    if (g.k === 'S') unlock('gradeS');
    if (G.stats.boxes >= 100) unlock('box100');
    if (G.stats.boxes >= 500) unlock('box500');
    // 열매솎기를 안 한 나무는 다음 해 해거리(열매가 확 줄어요)
    if (!t.th) t.alt = 1;
    resetCycle(t);
    return {k, g, bx, q, v:t.v};
  }
  return {k};
}
// 2026-10-16 달 요청: 상자 등급 비율. 가장 잘 키웠을 때(품질 95↑) 특 40%, 가장 못 키웠을 때(30↓) 특 10%, 그 사이는 고르게 이어져요
const GRADE_MIX = {best:{S:.40, A:.35, B:.20, C:.05}, worst:{S:.10, A:.25, B:.35, C:.30}};
function gradeMix(q){ const k = clamp((q - 30) / 65, 0, 1), o = {}; for (const g of 'SABC') o[g] = GRADE_MIX.worst[g] + (GRADE_MIX.best[g] - GRADE_MIX.worst[g]) * k; return o; }
function rollGrade(q){ const m = gradeMix(q); let r = Math.random(); for (const g of 'SAB') { if (r < m[g]) return g; r -= m[g]; } return 'C'; }

function pendingCount(k){
  let n = 0, tot = 0;
  for (let i = 0; i < G.trees.length; i++) {
    const t = G.trees[i], tk = taskFor(i);
    if (k === 'plant') { if (!t) { tot++; if (tk === 'plant') n++; } continue; }
    if (tk === k) n++;
    if (t && relevant(t, k)) tot++;
  }
  return {n, tot};
}
function relevant(t, k){
  const w = G.week;
  if (k === 'prune') return t.age >= 1 || w >= 49;
  if (k === 'blossom') return t.age >= 1;
  if (k === 'thin') return t.fr || t.th;
  if (k === 'harvest') return t.fr && w >= VARS[t.v].hv[0] && w <= VARS[t.v].hv[1];
  return false;
}
// 이번 주에 할 수 있는 작업 종류
function activeTasks(){
  const out = [];
  for (const k of ['harvest','thin','blossom','prune','plant']) {
    const c = pendingCount(k);
    if (k === 'harvest') { if (c.tot || c.n) out.push({k, ...c}); continue; }
    if (k === 'plant') { if (TASKS.plant.ok(G.week) && c.tot) out.push({k, ...c}); continue; }
    if (TASKS[k].ok(G.week) && c.tot) out.push({k, n:c.n, tot:c.tot});
  }
  return out;
}

// ----- 방제 -----
function sprayState(type){
  if (type === 'nutri') {
    const bearing = G.trees.some(t => t && t.age >= 1);
    if (!bearing) return {ok:false, why:'열매 맺는 나무가 아직 없어요.'};
    const mo = weekLabel(G.week).m; // 2026-10-13 5월·8월·10월에 한 번씩
    if (![5, 8, 10].includes(mo)) return {ok:false, why:'영양제는 5월·8월·10월에 한 번씩 줘요.'};
    if ((G.nutriM || []).includes(G.year * 100 + mo)) return {ok:false, why:`${mo}월 영양제는 벌써 줬어요.`};
    if (G.nutri >= 3) return {ok:false, why:'올해 영양제는 3번 다 줬어요.'};
    return {ok:true};
  }
  const v = G.wx[type];
  if (protectedFor(type)) return {ok:false, why:`아직 약 효과가 ${G.prot[type] - absDay() + 1}일 남았어요.`};
  if (v < RISK_HIGH) return {ok:false, why:`지금 ${type === 'dis' ? '병' : '해충'} 위험은 ${v}(${riskLevel(v)})예요. ${RISK_HIGH} 이상 "높음"일 때 해요.`};
  return {ok:true};
}
const SPRAY_DAYS = {S:17, A:14, B:10, C:7};
function applySpray(type, grade){
  const cost = sprayCost();
  G.money -= cost; G.stats.sprays++;
  if (type === 'nutri') { G.nutri++; (G.nutriM = G.nutriM || []).push(G.year * 100 + weekLabel(G.week).m); if (G.nutriM.length > 6) G.nutriM.shift(); return `영양제를 줬어요. 올해 ${G.nutri}/3번 (${won(cost)})`; }
  // 2026-10-15 달 요청: 방제 효과 S 17일·A 14일·B 10일·C 7일(이전 10·8·7·5). 자동 방제는 B. 강풍(드론 없음)은 -3일(이전 -2)
  let days = SPRAY_DAYS[grade] || SPRAY_DAYS.B, note = '';
  if (G.wx.wind >= 6 && !G.b.drone) { days -= 3; note = ' 바람이 세서 약이 좀 날아갔어요.'; }
  G.prot[type] = absDay() + days - 1;
  return `${type === 'dis' ? '살균제' : '살충제'}를 뿌렸어요. ${days}일 동안 지켜 줘요.${note} (${won(cost)})`;
}

// ----- 시간 흐름 -----
function advance(hours){
  G.hour += hours;
  workerTick(hours);
  while (G.hour >= 20) { G.hour -= 14; endDay(); }
}
let workerAcc = 0, workerLast = -1;
// 2026-10-13 인부는 '일한 시간'으로 계산해요: 하루 = 일하는 시간 14시간(6시~20시).
// 낮에 늦게 불러도, 할 일이 없어 쉬어도 그 시간은 안 빠져요(예전엔 오후에 부르면 반나절만 일하고 하루가 빠졌어요).
const WORKER_DAY_H = 14;
function workerHrs(){ if (G.workerHrs == null) G.workerHrs = (G.worker || 0) * WORKER_DAY_H; return G.workerHrs; }
function syncWorker(){ G.worker = Math.ceil(workerHrs() / WORKER_DAY_H - 1e-6); }
function workerTick(h){
  if (workerHrs() <= 0) { G.worker = 0; return; }
  const rate = 1.6 * (G.b.wondumak ? 1.25 : 1);
  if (nearestTask(workerLast >= 0 ? treePos(workerLast) : treePos(0), true) < 0) { workerAcc = 0; return; } // 할 일 없으면 쉬어요(시간 안 빠짐)
  const use = Math.min(h, G.workerHrs);
  G.workerHrs -= use; workerAcc += use * rate;
  while (workerAcc >= 1) {
    workerAcc -= 1;
    const i = nearestTask(workerLast >= 0 ? treePos(workerLast) : treePos(0), true);
    const r = i < 0 ? null : doTask(i, 'worker');
    if (r) { workerLast = i; G.workerWorked = 1; emit('workerDid', {i, r}); }
    else { G.workerHrs += workerAcc / rate; workerAcc = 0; break; } // 못 한 몫은 시간으로 돌려줘요
  }
  syncWorker();
  if (G.workerHrs <= 1e-6) { G.workerHrs = 0; G.worker = 0; workerAcc = 0; workerLast = -1; toast('인부 아저씨가 약속한 일을 다 하고 돌아갔어요.'); }
}
function nearestTask(p, forWorker){
  let best = -1, bd = 1e18;
  for (let i = 0; i < G.trees.length; i++) {
    const k = taskFor(i); if (!k) continue;
    if (k === 'plant' && (forWorker ? G.money < SAPLING + 500000 : G.money < SAPLING)) continue;
    const q = treePos(i), d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function endDay(){
  const w = G.week, x = G.wx;
  if (w >= 14 && w <= 42) {
    let hit = 0;
    if (x.dis >= RISK_HIGH && !protectedFor('dis')) hit += 1.6;
    if (x.pest >= RISK_HIGH && !protectedFor('pest')) hit += 1.6;
    if (hit) G.trees.forEach(t => { if (t && t.age >= 1) t.dmg += hit; });
  }
  G.workerWorked = 0;
  ageStock(); // 2026-10-15 창고 사과 신선도
  blemDaily(); // 2026-10-15 흠과 부탁
  G.day++;
  if (G.day >= 7) { G.day = 0; newWeek(); }
  genWeather();
  // 멧돼지·고라니 (4~11월)
  if (G.week >= 14 && G.week <= 46 && G.trees.some(t => t)) {
    if (!G.b.fence && Math.random() < .04) emit('raid', {kind: Math.random() < .5 ? 'boar' : 'deer'});
  }
  emit('day');
}

// 심은 다음 해(2년차)부터 조금씩 열리고 10년차까지 늘어요. 그 뒤로는 그대로 (다 자란 나무 1~3상자)
const treeYear = t => t.age + 1; // 심은 해 = 1년차
function yieldFactor(t){ return clamp(.2 + .8 * (treeYear(t) - 2) / 8, .2, 1); }
function treeBoxes(t){ const e = rnd(1, 3) * 2 * yieldFactor(t); // 2026-10-13 수확량 2배
  return Math.max(1, Math.floor(e) + (Math.random() < e % 1 ? 1 : 0)); }
function newWeek(){
  G.week++;
  if (G.week > 52) {
    G.week = 1; G.year++;
    G.trees.forEach(t => { if (t) t.age++; });
    G.nutri = 0; G.stats.yearBoxes = 0; G.stats.bestQ = 0;
    rollYearEvents();
    emit('newYear');
  }
  const w = G.week;
  // 열매 맺힘
  if (w === 18) {
    let n = 0, na = 0;
    G.trees.forEach(t => {
      if (t && t.age >= 1 && !t.fr) { t.fr = 1; t.bx = treeBoxes(t); t.bon += (2 + hiveLv()) * hives(); n++;
        if (t.alt) { t.bx = Math.max(1, Math.round(t.bx * .55)); na++; } }
      if (t) delete t.alt;
    });
    if (n) toast(`🍏 꽃이 지고 작은 사과가 열렸어요! (${n}그루)`, 'good');
    if (na) toast(`🍂 작년에 열매솎기를 못 한 ${na}그루는 해거리로 사과가 적게 열렸어요.`, 'bad');
  }
  // 수확 놓침
  G.trees.forEach(t => {
    if (t && t.fr && w === VARS[t.v].hv[1] + 1) { t.lost = 1; resetCycle(t); }
  });
  const lost = G.trees.filter(t => t && t.lost).length;
  if (lost) { G.trees.forEach(t => t && delete t.lost); toast(`😢 수확 시기를 놓쳐서 사과 ${lost}그루가 떨어졌어요.`, 'bad'); }
  // 재해
  if (G.ev.frost === w) {
    emit('wxfx', {k:'frost'});
    if (G.b.frostfan) emit('pop', {ic:'🌀', t:'늦서리!', m:'밤새 서리가 내렸지만 방상팬이 바람을 돌려서 꽃을 지켰어요.'});
    else { G.trees.forEach(t => { if (t && t.age >= 1) t.bon -= VARS[t.v].tough ? 4 : 8; }); emit('pop', {ic:'🥶', t:'늦서리!', m:'밤에 서리가 내려 꽃이 얼었어요. 올해 사과 품질이 조금 떨어져요. 방상팬이 있으면 막을 수 있어요.'}); }
  }
  if (G.ev.hail === w && G.trees.some(t => t && t.fr)) {
    emit('wxfx', {k:'hail'});
    if (G.b.hailnet) emit('pop', {ic:'🕸️', t:'우박!', m:'우박이 쏟아졌지만 우박망이 사과를 지켰어요.'});
    else {
      const rowsHit = new Set(); while (rowsHit.size < Math.ceil(G.rows / 2)) rowsHit.add(rint(0, G.rows - 1));
      G.trees.forEach((t, i) => { if (t && t.fr && rowsHit.has(Math.floor(i / PER_ROW))) t.bon -= VARS[t.v].tough ? 5 : 10; });
      emit('pop', {ic:'🧊', t:'우박!', m:`우박이 쏟아져서 ${rowsHit.size}줄 사과에 상처가 났어요. 우박망이 있으면 막을 수 있어요.`});
    }
  }
  if (G.ev.typhoon === w && G.trees.some(t => t && t.fr)) {

    let drop = 0; const p = G.b.hailnet ? .25 : .5;
    G.trees.forEach(t => { if (t && t.fr && Math.random() < p) { t.bx--; drop++; if (t.bx <= 0) resetCycle(t); } });
    emit('pop', {ic:'🌀', t:'태풍이 지나갔어요', m:`센 바람에 사과가 떨어져서 ${drop}상자쯤 줄었어요.${G.b.hailnet ? ' 우박망 덕분에 피해가 절반이었어요.' : ''}`});
  }
  // 주문

    if (o.due < w && o.year === G.year || o.year < G.year) { G.rep = Math.max(0, G.rep - 2); toast(`${o.name} 주문 날짜를 놓쳤어요. 평판 -2`, 'bad'); return false; }
    return true;
  });
  if (G.year >= 2 && w >= 30 && w <= 46 && G.orders.length + offerCount('order') < 2 && Math.random() < .4) makeOrder();
  // 품평회
  retailWeek();
  { const L = weekLabel(w); if ([5, 8, 10].includes(L.m) && L.wk === 1 && G.trees.some(t => t && t.age >= 1)) emit('pop', {ic:'🧪', t:`${L.m}월, 영양제 줄 때예요!`, m:'이번 달에 영양제를 한 번 줄 수 있어요. 방제 창에서 🧪 영양제를 고르세요. (5월·8월·10월에 한 번씩)'}); }
  if (hiveLv() >= 3 && hives() && w >= 18 && w <= 40) { const p = 20000 * hives(); G.money += p; addInc('apple', p); toast(`🍯 꿀벌통에서 꿀을 땄어요! +${won(p)}`, 'good'); }
  if (w === 50 && G.stats.bestQ > 0) emit('contest');
  emit('week');
}
function makeOrder(){
  const t = pick(ORDERS);
  const o = {id:G.oid++, name:t.name, ic:t.ic, g:t.g, n:rint(t.n[0], t.n[1]), price:Math.round(gByK(t.g).base * 10000 + t.bonus), rep:t.rep, due:Math.min(52, G.week + rint(3, 5)), year:G.year};
  offerOrder('order', o); // 2026-10-15 바로 받지 않고 수락·거절 창부터 띄워요
}
function canDeliver(o){ return stockAtLeast(o.g) >= o.n; }
function stockAtLeast(gk){
  const ok = GRADES.slice(0, GRADES.findIndex(g => g.k === gk) + 1).map(g => g.k);
  let n = 0; for (const key in G.stock) if (ok.includes(key.split('|')[1])) n += G.stock[key];
  return n;
}
function takeBoxes(gk, n){ // 낮은 등급부터 꺼냄
  const order = GRADES.slice(0, GRADES.findIndex(g => g.k === gk) + 1).map(g => g.k).reverse();
  for (const gg of order) for (const key in G.stock) {
    if (n <= 0) break;
    if (key.split('|')[1] !== gg) continue;
    const m = Math.min(n, G.stock[key]); G.stock[key] -= m; n -= m;
    if (!G.stock[key]) delete G.stock[key];
  }
}
function deliver(o){
  if (!canDeliver(o)) return false;
  takeBoxes(o.g, o.n);
  G.money += o.price * o.n; addInc('apple', o.price * o.n); G.rep += o.rep;
  G.orders = G.orders.filter(x => x !== o);
  toast(`${o.ic} ${o.name} 납품 완료! +${won(o.price * o.n)}, 평판 +${o.rep}`, 'gold');
  return true;
}
function totalStock(){ let n = 0; for (const k in G.stock) n += G.stock[k]; return n; }

// 경매 가격
function auctionPlan(key){
  const [v, gk] = key.split('|');
  let base = gByK(gk).base * VARS[v].mult * (G.b.cold ? 1.1 : 1) * shedMult();
  const bids = BIDDERS.map(n => ({n, p:Math.round(clamp(base * rnd(.84, 1.07), 3, PRICE_CAP) * 10) / 10}));
  const big = Math.random() < .1;
  if (big) bids[rint(0, 9)] = {n:'큰손 상인', p:PRICE_CAP, big:true};
  let win = 0; bids.forEach((b, i) => { if (b.p > bids[win].p) win = i; });
  return {bids, win, big, price:bids[win].p * 10000};
}
function sellLot(key, plan, cnt){
  const have = G.stock[key] || 0, n = Math.min(have, cnt == null ? have : cnt); if (!n) return 0;
  const total = Math.round(plan.price * n);
  G.money += total; addInc('apple', total); G.stats.sold += n; G.stock[key] = have - n; if (!G.stock[key]) delete G.stock[key];
  if (plan.big) unlock('bigbuyer');
  checkRich();
  return total;
}
function processLot(key){
  const gk = key.split('|')[1], n = G.stock[key] || 0;
  const unit = gk === 'C' ? 50000 : gk === 'B' ? 60000 : 0;
  if (!unit || !n || !G.b.factory) return 0;
  delete G.stock[key]; G.money += unit * n; addInc('apple', unit * n); checkRich();

}
function checkRich(){ if (G.money >= 100000000) unlock('rich'); }

function unlock(id){
  if (G.ach[id]) return;
  G.ach[id] = absDay();
  const a = ACH[id]; toast(`${a[0]} 업적: ${a[1]}!`, 'gold');
}

// 품평회
function runContest(){
  const mine = G.stats.bestQ;
  const rivals = Array.from({length:9}, () => rint(68, 96));
  const rank = 1 + rivals.filter(r => r > mine).length;
  const prize = [3000000, 1500000, 500000][rank - 1] || 0;
  const rep = [5, 3, 1][rank - 1] || 0;
  G.money += prize; G.rep += rep;
  if (rank === 1) unlock('contest');
  G.contest.push({year:G.year, rank, q:mine});

const landStep = () => Math.max(0, Math.min(ROW_STEP, MAX_ROWS - G.rows)); // 2026-10-13 2줄씩

// ===== 창고 사과 신선도 (2026-10-15 달 요청: 빨리 팔게) =====
// 부사는 수확 뒤 4개월(120일), 나머지 품종은 2개월(60일)까지 그대로예요.
// 그날, 그리고 그 뒤 한 달(30일)마다 확인해서 상자마다 40%(FRESH_P, 2026-10-15 달 요청 '50% 미만') 확률로 한 단계 떨어져요(특→상→보통→하, 하는 그대로).
// G.stock은 여러 곳(경매·납품·소매·가공)에서 줄어들어서, 상자 묶음(G.lots)은 날마다 G.stock에 맞춰요:
// 늘어난 상자 = 오늘 새로 들어온 묶음, 줄어든 상자 = 오래된 묶음부터 나간 걸로 봐요.
const FRESH_DAYS = {fuji:120}, FRESH_DEF = 60, FRESH_STEP = 30, FRESH_P = .4;
const freshLimit = v => FRESH_DAYS[v] || FRESH_DEF;
const GRADE_DOWN = {S:'A', A:'B', B:'C'};
function syncLots(){
  const now = absDay(); if (!G.lots) G.lots = [];
  const by = {}; for (const L of G.lots) (by[L.k] = by[L.k] || []).push(L);
  for (const k of new Set([...Object.keys(G.stock), ...Object.keys(by)])) {
    const have = G.stock[k] || 0, L = (by[k] || []).sort((a, b) => a.t - b.t);
    let sum = L.reduce((s, x) => s + x.n, 0);
    for (let i = 0; sum > have && i < L.length; i++) { const m = Math.min(L[i].n, sum - have); L[i].n -= m; sum -= m; }
    // 2026-10-15 다 익어서 딴 사과(G.lotAdj)는 그만큼 오래된 걸로 쳐요
    if (sum < have) { const v = k.split('|')[0], adj = (G.lotAdj || {})[v] || 0; if (adj) delete G.lotAdj[v]; G.lots.push({k, n:have - sum, t:now - adj, d:0}); }
  }
  G.lots = G.lots.filter(x => x.n > 0);
}
// 하루에 한 번: 맞추고, 확인할 날이 된 묶음은 상자마다 주사위를 굴려 떨어진 상자만 한 단계 내려요
function ageStock(){
  syncLots();
  const now = absDay(), moved = {};
  for (const L of [...G.lots]) {
    const [v] = L.k.split('|'), lim = freshLimit(v), age = now - L.t;
    const due = age >= lim ? Math.floor((age - lim) / FRESH_STEP) + 1 : 0;
    while (L.d < due) {
      L.d++;
      const g = L.k.split('|')[1], g2 = GRADE_DOWN[g]; if (!g2) continue; // 하는 그대로
      let m = 0; for (let i = 0; i < L.n; i++) if (Math.random() < FRESH_P) m++;
      if (!m) continue;
      const k2 = v + '|' + g2;
      G.stock[L.k] -= m; if (G.stock[L.k] <= 0) delete G.stock[L.k];
      G.stock[k2] = (G.stock[k2] || 0) + m;
      G.lots.push({k:k2, n:m, t:L.t, d:L.d}); L.n -= m;
      const key = `${VARS[v].name} ${gByK(g).name}→${gByK(g2).name}`; moved[key] = (moved[key] || 0) + m;
    }
  }
  G.lots = G.lots.filter(x => x.n > 0);
  const msg = Object.entries(moved).map(([k, n]) => `${k} ${n}상자`).join(', ');
  if (msg) { toast(`🍂 오래된 사과 일부가 등급이 떨어졌어요: ${msg}`, 'bad'); todoSig = ''; }
}
// 창고 창에 보여 줄 '다음 확인까지 남은 날' (그 칸에서 가장 빠른 묶음)
function freshLeft(k){
  const [v, g] = k.split('|'); if (!GRADE_DOWN[g]) return null;
  const now = absDay(); let best = null;
  for (const L of G.lots || []) if (L.k === k) {
    const lim = freshLimit(v);
    const left = (L.d === 0 ? L.t + lim : L.t + lim + L.d * FRESH_STEP) - now;
    if (best == null || left < best) best = left;
  }
  return best;
}

function line(c, pts, w, col){ c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }

function mix(a, b, t){
  const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const A = p(a), B = p(b);

function hl(c, x, y, rx, ry, a = .9){ c.beginPath(); c.ellipse(x, y, rx, ry, -.6, 0, 7); c.fillStyle = `rgba(255,255,255,${a})`; c.fill(); }

const PAL = {

// ----- 사과나무 그림 (캐시) -----
const treeCache = new Map();
function treeLook(t){
  const w = G.week, s = seasonOf(w);
  const lp = w <= 21 ? PAL.spring : PAL.summer;
  const L = {s, age: Math.min(2, t.age + (t.y2 ? 1 : 0)), bare:false, bloom:false, leafC:lp.leaf, leafS:lp.leafS, ap:0, apR:0, apCol:null, dmg: t.dmg > 18 ? 2 : t.dmg > 8 ? 1 : 0};
  if (w <= 11 || w >= 49) L.bare = true;
  else if (w <= 13) { L.leafC = '#a6e27a'; L.leafS = '#6fb44f'; L.bud = true; }
  if (t.age >= 1 && w >= 15 && w <= 17) L.bloom = true;
  if (w >= 45 && w <= 48) { L.leafC = '#e6b33e'; L.leafS = '#b0742c'; }
  if (t.fr) {
    const V = VARS[t.v];
    const p = clamp((w - 18) / Math.max(1, V.hv[0] - 18), 0, 1);
    L.ap = t.th ? 7 : 13;
    L.apR = (t.th ? 4.2 : 3.4) + p * (t.th ? 3 : 1.6);
    const ramp = (a, m, b, u) => u < .45 ? mix(a, m, u / .45) : mix(m, b, (u - .45) / .55);
    L.apCol = t.v === 'aori' ? mix('#b6df5c', V.col, p) : ramp('#a9d651', '#f2c447', V.col, p);
    L.apSh = t.v === 'aori' ? V.sh : ramp('#6c9f2c', '#c48a22', V.sh, p);
    L.st = V.st && p > .6;
  }
  return L;
}
function treeSprite(t, hi){
  const L = treeLook(t);
  const key = [hi ? 3 : 1, L.age, L.bare, L.bloom, L.bud, L.leafC, L.ap, L.apR.toFixed(1), L.apCol, L.st, L.dmg, t.s % 5].join('|');
  let cv = treeCache.get(key);
  if (cv) return cv;
  if (treeCache.size > 400) treeCache.clear();
  const k = hi ? 3 : 1;
  cv = mk(170 * k, 240 * k);
  const c = cv.getContext('2d');
  c.scale(k, k); c.translate(85, 222);
  drawTree(c, L, srand(t.s % 5 + 7));
  treeCache.set(key, cv);
  return cv;
}
function drawTree(c, L, R){
  const sc = L.age === 0 ? .55 : L.age === 1 ? .78 : 1;
  shadow(c, 0, 2, 40 * sc + 6, 12 * sc + 3, .25);
  // 지주
  const ph = L.age === 0 ? 120 : 190;
  c.beginPath(); rr(c, 11, -ph, 5, ph + 2, 2); c.fillStyle = '#c9c2b6'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
  // 줄기
  const th = 70 * sc;
  cel(c, cc => { cc.moveTo(-7 * sc, 2); cc.quadraticCurveTo(-4 * sc, -th * .5, -3, -th); cc.lineTo(3, -th); cc.quadraticCurveTo(5 * sc, -th * .5, 7 * sc, 2); cc.closePath(); }, '#9a6440', '#6d4128', 3, 0, 2.5);

    inkLine(c, [0, -th + 4, 0, -185 * sc], 5 * sc + 1, '#8a5a3a');
    for (let k = 0; k < 7; k++) {
      const y = -th - k * 17 * sc, len = (48 - k * 5.5) * sc, sd = k % 2 ? 1 : -1;
      inkLine(c, [0, y, sd * len * .6, y + 4, sd * len, y + 10], 3 * sc + .5, '#8a5a3a');

    }

  }
  // 잎 덩어리 (아래 넓고 위로 좁아지는 방추형)
  const base = L.age === 0
    ? [[0, -96, 15], [-12, -82, 12], [12, -84, 12], [0, -112, 10]]
    : [[-28, -66, 23], [0, -60, 27], [28, -66, 23], [-20, -92, 23], [18, -94, 23], [0, -104, 24], [-13, -126, 19], [13, -128, 18], [0, -146, 16], [0, -166, 11]];
  const circ = base.map(([x, y, r]) => [x * sc + (R() - .5) * 4, (L.age === 0 ? y : y * sc) + (R() - .5) * 4, r * sc * (L.bud ? .82 : 1)]);
  const lc = L.bloom ? '#b9e98e' : L.leafC, ls = L.bloom ? '#7cc061' : L.leafS;

  for (let k = 0; k < 14; k++) {
    const [x, y, r] = circ[Math.floor(R() * circ.length)];
    const ax = x + (R() - .5) * r, ay = y + (R() - .5) * r;
    c.beginPath(); c.arc(ax, ay, 5 * sc, Math.PI * .15, Math.PI * .85); c.stroke();
  }

  if (L.dmg) for (let k = 0; k < L.dmg * 7; k++) {

    c.beginPath(); c.arc(x + (R() - .5) * r, y + (R() - .5) * r, 3, 0, 7); c.fillStyle = '#8b6a2b'; c.fill();

    const R2 = srand(99);
    const spots = [];
    for (let k = 0; k < L.ap; k++) {
      const [x, y, r] = circ[k % (circ.length - 2)];
      spots.push([x + (R2() - .5) * r * 1.2, y + r * .2 + (R2() - .3) * r * .7]);
    }
    spots.sort((a, b) => a[1] - b[1]).forEach(([x, y]) => drawApple(c, x, y, L.apR * (L.age === 1 ? .9 : 1), L.apCol, L.apSh, L.st));

}
function drawApple(c, x, y, r, col, sh, stripe){

  line(c, [x, y - r * .7, x + r * .15, y - r * 1.15], 1.4, INK);
}

function blocked(x, y){
  if (x < WX0 + 40 || x > WX1 - 40 || y < WY0 + 120 || y > worldBot() - 40) return true;
  for (const r of solids()) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) return true;
  if (huntBlocked(x, y)) return true;
  if (inWater(x, y)) return true; // 2026-10-16 강물은 다리로만 건너요
  if (G.deco.pond && ((x - SPOT.pond.x) / 160) ** 2 + ((y - SPOT.pond.y) / 78) ** 2 < 1) return true;
  // 나무 줄기
  if (inOrchard(x, y)) {
    const r = Math.floor((y - OY) / ROW_H);
    if (r >= 0 && r < G.rows) {
      const ty = OY + r * ROW_H + STRIP / 2 + 6;
      if (Math.abs(y - ty) < 14) {
        const c2 = x >= ROAD_X1 ? HALF_ROW + Math.round((x - ROAD_X1 - TREE_DX / 2) / TREE_DX) : Math.round((x - OX - TREE_DX / 2) / TREE_DX);
        if (c2 >= 0 && c2 < PER_ROW && G.trees[r * PER_ROW + c2]) { if (Math.abs(x - colX(c2)) < 16) return true; }
      }
    }
  }
  return false;
}
function moveBy(o, dx, dy){
  // 이미 막힌 자리(예: 발밑에 나무를 심음)면 빠져나갈 수 있게 그냥 움직임
  if (blocked(o.x, o.y)) { o.x += dx; o.y += dy; return true; }
  if (!blocked(o.x + dx, o.y + dy)) { o.x += dx; o.y += dy; return true; }
  if (dx && !blocked(o.x + dx, o.y)) { o.x += dx; return true; }
  if (dy && !blocked(o.x, o.y + dy)) { o.y += dy; return true; }
  return false;
}

function syncCritters(){
  const want = [];
  if (G.deco.rabbit) want.push('rabbit', 'rabbit');
  if (G.deco.chicken) want.push('chicken', 'chick', 'chick', 'chick');
  if (G.deco.pond) want.push('duck', 'duck', 'duck');
  if (G.deco.cat) want.push('cat');
  if (G.deco.dog) want.push('dog');
  const sig = want.join();
  if (critters.sig === sig) return;
  critters.length = 0; critters.sig = sig;
  want.forEach((k, i) => {
    const a = k === 'rabbit' ? SPOT.rabbit : k === 'duck' ? SPOT.pond : k === 'cat' ? SPOT.cat : k === 'dog' ? SPOT.dog : SPOT.chicken;
    critters.push({k, ax:a.x, ay:a.y, x:a.x + rnd(-40, 40), y:a.y + rnd(-20, 20), tx:a.x, ty:a.y, t:rnd(0, 9), ph:i, flip:false});
  });
}
function critterDir(c, dx, dy, dt){ // 8방향: 0.2초 이어져야 바꿔서 덜덜 떨지 않게
  const n8 = (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8;
  if (c.d8 == null || n8 === c.d8) { c.d8 = n8; c.d8T = 0; } else if ((c.d8T = (c.d8T || 0) + dt) > .2) { c.d8 = n8; c.d8T = 0; }
}
function updateCritters(dt){
  for (const c of critters) {
    c.t += dt;
    if (c.k === 'duck') { const a = c.t * .25 + c.ph * 2.1; const nx = c.ax + Math.cos(a) * 100, ny = c.ay + Math.sin(a) * 40; c.flip = nx < c.x; critterDir(c, nx - c.x, ny - c.y, dt); c.x = nx; c.y = ny; continue; }
    if (c.k === 'cat') continue;
    const range = c.k === 'rabbit' ? 160 : c.k === 'dog' ? 120 : 70;
    if (Math.hypot(c.tx - c.x, c.ty - c.y) < 4 || Math.random() < dt * .1) { c.tx = c.ax + rnd(-range, range); c.ty = c.ay + rnd(-range * .4, range * .4); }
    const sp = c.k === 'rabbit' ? 60 : c.k === 'dog' ? 55 : 18;
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy) || 1;
    if (d > 3) { c.x += dx / d * sp * dt; c.y += dy / d * sp * dt; c.flip = dx < 0; critterDir(c, dx, dy, dt); }
  }
}

const PV_STARS = (() => { const R = srand(4242), o = []; for (let i = 0; i < 90; i++) o.push({a:R() * 6.283, e:.12 + R() * .9, r:.8 + R() * 1.8, tw:R() * 6}); return o; })();

function pvSkyCols(S){

function pvSky(ctx){

function paveRoads(c, list, win, x0, y0, w, h, plates){
  const segs = []; for (const [pts, wd] of list) for (let i = 0; i < pts.length - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1], hw = wd / 2;

  for (const p of plates || []) segs.push({...p, plain:1});
  const vis = s => !(x0 != null) || (s.x < x0 + w + 40 && s.x + s.w > x0 - 40 && s.y < y0 + h + 40 && s.y + s.h > y0 - 40);
  const S = segs.filter(vis);
  c.fillStyle = win ? '#c8d2da' : '#a99f8e'; for (const s of S) { c.beginPath(); rr(c, s.x - 7, s.y - 7, s.w + 14, s.h + 14, 10); c.fill(); }
  c.fillStyle = win ? '#f2f5f8' : '#e8e1d3'; for (const s of S) { c.beginPath(); rr(c, s.x, s.y, s.w, s.h, 6); c.fill(); }
  c.strokeStyle = win ? '#dfe6ec' : '#d3c8b4'; c.lineWidth = 2;
  for (const s of S) {
    if (s.plain) continue;
    c.save(); c.beginPath(); c.rect(s.x, s.y, s.w, s.h); c.clip(); c.beginPath();
    const bw = 46, rows = Math.max(1, Math.round((s.hor ? s.h : s.w) / 30)), rh = (s.hor ? s.h : s.w) / rows;
    for (let r = 1; r < rows; r++) { if (s.hor) { c.moveTo(s.x, s.y + r * rh); c.lineTo(s.x + s.w, s.y + r * rh); } else { c.moveTo(s.x + r * rh, s.y); c.lineTo(s.x + r * rh, s.y + s.h); } }
    for (let r = 0; r < rows; r++) { const off = r % 2 ? bw / 2 : 0;
      if (s.hor) for (let x = Math.floor((s.x - off) / bw) * bw + off; x < s.x + s.w; x += bw) { c.moveTo(x, s.y + r * rh); c.lineTo(x, s.y + (r + 1) * rh); }
      else for (let y = Math.floor((s.y - off) / bw) * bw + off; y < s.y + s.h; y += bw) { c.moveTo(s.x + r * rh, y); c.lineTo(s.x + (r + 1) * rh, y); } }
    c.stroke(); c.restore();
  }
}

function hasWork(){
  if (MONS.some(m => m.raid && !m.dead && m.st !== 'leave')) return true;
  for (let i = 0; i < G.trees.length; i++) { const k = taskFor(i); if (k && (k !== 'plant' || G.money >= SAPLING)) return true; }
  if (['dis', 'pest'].some(k => sprayState(k).ok)) return true;
  if (G.orders.some(o => canDeliver(o))) return true;
  if (G.errand && totalStock() >= G.errand.need) return true;
  return false;
}

function bossSkillUpdate(m, dt){
  const s = m.sk, D = m.den; s.t += dt;
  const end = rest => { m.st = 'chase'; m.sk = null; m.cc = 1.2; m.jz = 0; m.skCd = BOSS_CD[m.hp < m.max * .5 ? 1 : 0] * (m.cdK || 1); if (rest) { m.stun = rest; floats.push({x:m.x, y:m.y - 200, s:'💫 지쳤다! 지금 때려요!', t:1.6, c:'#2f6fb8', sz:28}); } };
  if (!inDenOf(D, P.x, P.y, 60)) { end(0); return; }
  if (s.id === 'claws') {
    // 0.45초마다 우주 발밑에 발톱 자국 4번
    if (s.n < 4 && s.t >= s.n * .45) { addZone(m, {shape:'circle', x:P.x, y:P.y, r:140, warn:.8, dmg:8, txt:'할퀴기'}); s.n++; }
    if (s.t > 4 * .45 + .9) end(.9);
  } else if (s.id === 'pounce' || s.id === 'leap') {
    const z = s.z, k = clamp((s.t - .85) / .3, 0, 1);
    if (k > 0 && !s.jump) { s.jump = {x:m.x, y:m.y}; }
    if (s.jump) { m.x = s.jump.x + (z.x - s.jump.x) * k; m.y = s.jump.y + (z.y - s.jump.y) * k; m.jz = Math.sin(k * Math.PI) * 120; }
    if (z.done) { m.jz = 0; end(2.2); }
  } else if (s.id === 'icefield') {
    if (!s.n && s.t > .75) { s.second(); s.n = 1; }
    if (s.t > 2.4) end(1.1);
  } else if (s.id === 'meteor' || s.id === 'rockfall') {
    // 운석 7개(서리용) · 바위 4개(트리케라톱스)가 우주 발밑에 차례로 떨어져요
    const met = s.id === 'meteor', n = met ? 7 : 4, gap = met ? .3 : .42;
    if (s.n < n && s.t >= s.n * gap) { const o = s.n && met ? 160 : 0, a = rnd(0, 6.283); addZone(m, {shape:'circle', ice:met ? 1 : 0, fall:met ? 'ice' : 'rock', x:P.x + Math.cos(a) * o, y:P.y + Math.sin(a) * o * .8, r:met ? 170 : 160, warn:met ? 1.1 : .9, dmg:met ? 11 : 10, txt:met ? '얼음 운석' : '바위'}); s.n++; }
    if (s.t > n * gap + 1.2) end(1);

    if (s.z.done) end({breath:1.4, tail:1, roarq:1.2, nova:2.6}[s.id]);
  } else if (s.id === 'dive') {
    const z = s.z, k = clamp((s.t - 1.3) / .45, 0, 1);
    if (!s.jump) s.jump = {x:m.x, y:m.y};
    if (k <= 0) m.jz = Math.min(1, s.t / .6) * 280;
    else { m.x = s.jump.x + (z.x - s.jump.x) * k; m.y = s.jump.y + (z.y - s.jump.y) * k; m.jz = 280 * (1 - k); }
    if (z.done) { m.jz = 0; FX.shake = Math.max(FX.shake, .9); end(2.4); }
  } else if (LANE_SK[s.id]) {
    const z = s.z;
    if (z.done && !s.run) s.run = {d:0};
    if (s.run) {
      const st = Math.min(z.len - s.run.d, 1500 * dt); s.run.d += st; m.x += z.ux * st; m.y += z.uy * st; m.flip = z.ux < 0;
      if (Math.random() < .5) burst(m.x, m.y - 10, 2, z.ice ? ['#e8f6ff', '#fffaf1'] : ['#5a4a42', '#a89888'], 200, .4);
      if (Math.hypot(P.x - m.x, (P.y - m.y) * 1.2) < 150) bossHit(m, z.dmg, z.txt);
      if (s.run.d >= z.len - 1) { FX.shake = Math.max(FX.shake, .5); sfx('crash'); end(2); }
    }
  }
}

function bossInterrupt(m){

// ===== 2026-10-16 달 요청: 호랑이 보스를 포스 넘치고 무섭게 =====
// 귀여운 호랑이 대신: 짙은 주황 털 + 끝이 뾰족한 검은 줄무늬 + 하얀 볼 갈기 + 노란 눈의 세로 동공 + 드러낸 송곳니 + 굵은 발톱
// 보스 그림(옆모습)과 호랑이 탈것 8방향(05m_mount.js)이 이 부품들을 같이 써요
const TG = {B:'#e8761c', S:'#a8460e', W:'#fff3dc', Ws:'#d8c8ae', K:'#17100c', E:'#ffc81e', M:'#5a0e14'};
// 끝이 뾰족한 줄무늬: (x, y)에서 각도 a로 길이 L, 굵기 w
function tgStripe(c, x, y, a, L, w){
  const ux = Math.cos(a), uy = Math.sin(a), nx = -uy, ny = ux;
  c.beginPath(); c.moveTo(x + nx * w / 2, y + ny * w / 2);
  c.quadraticCurveTo(x + ux * L * .5 + nx * w * .45, y + uy * L * .5 + ny * w * .45, x + ux * L, y + uy * L);
  c.quadraticCurveTo(x + ux * L * .5 - nx * w * .45, y + uy * L * .5 - ny * w * .45, x - nx * w / 2, y - ny * w / 2);
  c.closePath(); c.fillStyle = TG.K; c.fill();
}
// 굵은 다리 + 큰 발 + 하얀 발톱. o = 걸음 흔들림, dark = 먼 다리
function tgLeg(c, x, top, h, w, o, dark){
  const col = dark ? TG.S : TG.B;
  // 위는 굵은 허벅지·어깨, 아래로 가늘어졌다가 큰 발
  cel(c, cc => { cc.moveTo(x - w * .7, top); cc.quadraticCurveTo(x, top - 6, x + w * .7, top); cc.quadraticCurveTo(x + w * .55, top + h * .45, x + w * .32, -22 + o * .6); cc.lineTo(x + w * .42, -8 + o); cc.lineTo(x - w * .42, -8 + o); cc.lineTo(x - w * .36, -22 + o * .6); cc.quadraticCurveTo(x - w * .75, top + h * .4, x - w * .7, top); cc.closePath(); }, col, TG.S, 1, 0, 2.6);
  tgStripe(c, x - w * .62, top + h * .3, .1, w * .7, 4.5); tgStripe(c, x + w * .5, top + h * .5, Math.PI - .1, w * .55, 4);
  cel(c, cc => ell(cc, x + 3, -5 + o * .4, w * .62, 7), dark ? TG.S : TG.W, TG.Ws, 1, 1, 2.4);

const SPITZ = {name:'달', hearts:[], pet:0, x:0, y:0, hx:0, hy:0, tx:0, ty:0, d8:2, t:0, st:'wander', st2:0, cool:0, walk:false, wait:1};

function iceNestEntities(ctx, D, add, vis, T){
  const W = D.rx + 40, B = 128;
  // 얼음 성벽(위쪽 벽은 문 자리를 비워요)

    const x = side < 2 ? D.x + k : D.x + (side === 2 ? -W : W), y = side < 2 ? D.y + (side === 0 ? -W : W) : D.y + k;

    if (vis(x, y, 200)) add(y + 30, x, () => drawIceBlock(ctx, x, y + 30, B + 4, h, (k / B) & 1 ? 1 : -1));
  }

  for (const sx of [-1, 1]) { const x = D.x + sx * (D.gw + 40), y = D.y - W + 40; if (vis(x, y, 300)) add(y + 2, x, () => drawIceCrystal(ctx, x, y, 190, -sx * .08, T + sx)); }
  // 가운데 거대한 얼음 둥지: 바깥으로 뻗은 얼음 가시 고리
  const nx = D.x, ny = D.y - 120;
  for (let k = 0; k < 26; k++) {
    const a = k / 26 * 6.283, x = nx + Math.cos(a) * 400, y = ny + Math.sin(a) * 250, h = 110 + (k * 37 % 5) * 22;
    if (vis(x, y, 250)) add(y, x, () => drawIceCrystal(ctx, x, y, h, Math.cos(a) * .35, T + k));
  }
  // 성벽 안 빛나는 얼음 결정(횃불 대신)
  for (const [px, py] of [[-.72, -.6], [.72, -.6], [-.8, .2], [.8, .2], [-.6, .78], [.6, .78]]) { const x = D.x + px * D.rx, y = D.y + py * D.ry; if (vis(x, y, 200)) add(y, x, () => drawIceCrystal(ctx, x, y, 90, 0, T + px * 3)); }

  if (vis(gx, gy)) add(gy, gx, () => drawSign(ctx, gx, gy, D.sign));
}

    }
    c.stroke();
    for (const d of f.p) if (d.leaf) { c.save(); c.translate(d.x, d.y); c.rotate(d.r); c.fillStyle = `rgba(90,150,60,${.9 * e})`; c.beginPath(); c.ellipse(0, 0, 10, 5, 0, 0, 7); c.fill(); c.restore(); }
    // 번개
    f.nextBolt -= dt;
    if (f.nextBolt <= 0 && f.t < f.dur - 1.5) { f.bolt = .35; f.bx = rnd(W * .15, W * .85); f.seed = Math.random() * 1000; f.nextBolt = rnd(1.4, 2.4); sfx('thunder'); FX.shake = Math.max(FX.shake, .7); }
    if (f.bolt > 0) {
      f.bolt -= dt; const a = Math.max(0, f.bolt / .35);
      c.fillStyle = `rgba(255,255,240,${.55 * a})`; c.fillRect(0, 0, W, H);
      c.strokeStyle = `rgba(255,255,210,${a})`; c.lineWidth = 6; c.shadowColor = '#fff6a0'; c.shadowBlur = 30; c.beginPath();
      let x = f.bx, y = 0, s = f.seed; c.moveTo(x, y);
      while (y < H * .7) { s = (s * 9301 + 49297) % 233280; x += (s / 233280 - .5) * 120; y += 50 + (s % 40); c.lineTo(x, y); }
      c.stroke(); c.shadowBlur = 0;
    }
  } else if (f.k === 'hail') {
    c.fillStyle = `rgba(60,70,90,${.38 * e})`; c.fillRect(0, 0, W, H);
    while (f.p.length < 170) f.p.push({x:rnd(0, W), y:rnd(-H, 0), v:rnd(900, 1300), vx:rnd(-60, 60), r:rnd(4, 9), b:0, gy:rnd(H * .45, H - 20)});
    for (const d of f.p) {
      d.v += 1800 * dt * (d.b ? 1 : 0); d.y += d.v * dt; d.x += d.vx * dt;
      if (!d.b && d.y > d.gy) { d.b = 1; d.v = -rnd(250, 420); d.vx = rnd(-160, 160); }
      else if (d.b && d.y > d.gy + 8) { d.y = rnd(-200, -10); d.x = rnd(0, W); d.v = rnd(900, 1300); d.vx = rnd(-60, 60); d.b = 0; d.gy = rnd(H * .45, H - 20); }
      c.beginPath(); c.arc(d.x, d.y, d.r, 0, 7); c.fillStyle = `rgba(245,250,255,${.95 * e})`; c.fill();
      c.lineWidth = 2; c.strokeStyle = `rgba(150,180,215,${.9 * e})`; c.stroke();
      c.beginPath(); c.arc(d.x - d.r * .35, d.y - d.r * .35, d.r * .3, 0, 7); c.fillStyle = `rgba(255,255,255,${e})`; c.fill();
    }
    if (Math.random() < dt * 6) FX.shake = Math.max(FX.shake, .25);
  } else {
    // 늦서리: 가장자리부터 얼어붙는 서리
    const g = c.createRadialGradient(W / 2, H / 2, H * (.62 - .25 * e), W / 2, H / 2, H * 1.05);
    g.addColorStop(0, 'rgba(180,220,255,0)'); g.addColorStop(1, `rgba(200,235,255,${.85 * e})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = `rgba(120,170,230,${.16 * e})`; c.fillRect(0, 0, W, H);
    if (!f.p.length) for (let i = 0; i < 46; i++) { const side = i % 4, u = Math.random(); f.p.push({x:side === 0 ? u * W : side === 1 ? W : side === 2 ? u * W : 0, y:side === 0 ? 0 : side === 1 ? u * H : side === 2 ? H : u * H, s:rnd(30, 80), r:rnd(0, 3)}); }
    c.strokeStyle = `rgba(255,255,255,${.9 * e})`; c.lineCap = 'round';
    for (const d of f.p) {
      const s = d.s * Math.min(1, f.t / 1.5); c.save(); c.translate(d.x, d.y); c.rotate(d.r + f.t * .1); c.lineWidth = 3;
      for (let k = 0; k < 6; k++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(0, 0); c.lineTo(s, 0); c.moveTo(s * .55, 0); c.lineTo(s * .75, s * .18); c.moveTo(s * .55, 0); c.lineTo(s * .75, -s * .18); c.stroke(); }
      c.restore();
    }
    for (let i = 0; i < 30; i++) { const x = (i * 263 + f.t * 40) % W, y = (i * 151 + f.t * 25) % H; c.fillStyle = `rgba(255,255,255,${(.4 + .4 * Math.sin(f.t * 5 + i)) * e})`; c.fillRect(x, y, 3, 3); }
  }
  // 큰 경보 글씨
  const ta = Math.min(1, f.t / .3) * Math.max(0, Math.min(1, (3 - f.t) / .6));
  if (ta > 0) {
    const sc = 1 + Math.max(0, .3 - f.t) * 2;
    c.save(); c.translate(W / 2 + (f.k === 'typhoon' ? Math.sin(f.t * 30) * 4 : 0), H * .4); c.scale(sc, sc); c.globalAlpha = ta;
    c.font = '96px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = f.k === 'frost' ? '#1d4f8a' : '#2a1a10'; c.strokeText(WX_TITLE[f.k], 0, 0);
    c.fillStyle = f.k === 'typhoon' ? '#ffd23a' : f.k === 'hail' ? '#e9f6ff' : '#bfe6ff'; c.fillText(WX_TITLE[f.k], 0, 0);
    c.restore(); c.globalAlpha = 1;
  }
}

function goTo(what){
  if (what === 'raid') { const m = MONS.find(m => m.raid && !m.dead); if (m) { P.tgt = {x:m.x, y:m.y}; P.pendMon = m; } return; }
  if (what === 'shop') { const n = NPCS.find(n => n.buyer); if (n) { P.tgt = {x:n.x + 55, y:n.y + 20}; P.pend = {kind:'npc', n:n.i, x:n.x + 55, y:n.y + 20}; } return; }
  if (what.startsWith && what.startsWith('npc:')) { const n = NPCS[+what.slice(4)]; if (n) { P.tgt = {x:n.x + 55, y:n.y + 20}; P.pend = {kind:'npc', n:n.i, x:n.x + 55, y:n.y + 20}; } return; }
  if (what === 'shed') { P.tgt = {x:SPOT.shed.x, y:SPOT.shed.y + 40}; P.pend = {kind:'shed'}; return; }
  if (what === 'chief' || what === 'grandma' || what === 'hunter') { P.tgt = {x:SPOT[what].x + 50, y:SPOT[what].y + 30}; return; }
  const i = nearestOf(what);
  if (i >= 0) { const p = treePos(i); P.tgt = {x:p.x, y:p.y + 50}; }
}
function nearestOf(k){
  let b = -1, bd = 1e18;
  for (let i = 0; i < G.trees.length; i++) { if (taskFor(i) !== k) continue; const p = treePos(i), d = (p.x - P.x) ** 2 + (p.y - P.y) ** 2; if (d < bd) { bd = d; b = i; } }
  return b;
}

function autoSpray(k){
  if (G.money < sprayCost()) return;
  UI.busy = true;
  const cx = OX + ORCH_W / 2, cy = OY + G.rows * ROW_H / 2;
  ssAnim = {x:SPOT.shed.x, y:SPOT.shed.y + 30, sx:SPOT.shed.x, sy:SPOT.shed.y + 30, cx, cy, rx:ORCH_W / 2 + 140, ry:G.rows * ROW_H / 2 + 110, h:0, t:0, rings:[], ringT:0, k};
  sfx('spray');
}
function updateSS(dt){
  if (!ssAnim) return;
  const s = ssAnim; s.t += dt / 5;
  const ease = u => u * u * (3 - 2 * u);
  if (s.t < .16) { const u = ease(s.t / .16); s.x = s.sx + (s.cx - s.sx) * u; s.y = s.sy + (s.cy - s.sy) * u; s.h = 40 + u * 160; }
  else if (s.t < .86) {
    s.x = s.cx + Math.sin(s.t * 20) * 6; s.y = s.cy; s.h = 200 + Math.sin(s.t * 14) * 8;
    // 약 안개: 드론 아래에서 사방으로 퍼져요
    for (let q = 0; q < 6; q++) { const a = rnd(0, 6.283), sp = rnd(.45, 1); mist.push({x:s.x + rnd(-20, 20), y:s.y + rnd(-10, 10), r:rnd(18, 34), a:.42, vx:Math.cos(a) * s.rx * 1.25 * sp, vy:Math.sin(a) * s.ry * 1.25 * sp}); }
    s.ringT -= dt; if (s.ringT <= 0) { s.ringT = .45; s.rings.push(0); sfx('spray'); }
  } else { const u = ease((s.t - .86) / .14); s.x = s.cx + (s.sx - s.cx) * u; s.y = s.cy + (s.sy - s.cy) * u; s.h = 200 - u * 160; }
  for (let i = 0; i < s.rings.length; i++) s.rings[i] += dt / 1.6;
  s.rings = s.rings.filter(r => r < 1);
  if (mist.length > 700) mist.splice(0, mist.length - 700);
  cam.x += (s.x - cam.x) * .08; cam.y += (s.y - 120 - cam.y) * .08;
  if (s.t >= 1) {
    const msg = applySpray(s.k, 'B');
    ssAnim = null; UI.busy = false; toast('💧 ' + msg, 'good');
    UI.next();
  }
}

      $('#aTot').textContent = won(total);

function buyBuild(k){
  const b = BUILD[k], n = G.b[k] || 0;
  if (n >= (b.max || 1) || G.money < b.price) return false;
  G.money -= b.price; G.b[k] = n + 1; tiles.clear();
  toast(`${b.ic} ${jo(b.name, '을', '를')} 지었어요!`, 'gold'); return true;
}
function buyDeco(k){
  const d = DECO[k]; if (G.deco[k] || G.money < d.price) return false;
  G.money -= d.price; G.deco[k] = 1; gsig = '';
  toast(`${d.ic} ${d.name}이(가) 생겼어요!`, 'good'); return true;
}

function talk(who, html, foot){
  const npc = typeof who !== 'string';
  const name = npc ? who.name : {grandma:'김순자 할머니', chief:'고만수 이장님', hunter:HUNTER_NAME, haru:HN(), worker:'인부 아저씨'}[who];
  return UI.open({ic:'💬', title:name, w:900, render(o){
    o.body.innerHTML = `<div class="talk"><canvas width="200" height="200" id="ptr"></canvas><div class="bubble"><div class="who">${name}${npc ? ` <small style="opacity:.6">· ${who.role}</small>` : ''}</div>${html}</div></div><div id="talkX"></div>`;
    drawPortrait($('#ptr'), npc ? who.look : who);
    o.footEl.innerHTML = foot || `<button class="btn pri" id="tOk">알겠어요</button>`;
    const ok = $('#tOk'); if (ok) ok.onclick = () => UI.close();
  }});
}
function weekId(){ return absDay() - G.day; }
// 사과 퀴즈: 순자 할머니(G.quizDay)·이장님(G.quizDayC) 각각 한 주에 한 문제
const QZ = {grandma:{k:'quizDay', name:'김순자 할머니', ask:n => `${jo(n, '아', '야')}, 할미가 사과 문제 하나 낼게. 맞히면 용돈 줄게!`, ok:n => `딩동댕! 역시 우리 ${jo(n, '이야', '야')}. 용돈 10만원 받으렴.`, no:'아깝다! 정답은'},
  chief:{k:'quizDayC', name:'고만수 이장님', ask:n => `${n}, 이장이 사과 문제 하나 내 보겠네. 맞히면 마을에서 상금을 주지!`, ok:n => `허허, 정답이네! 역시 ${jo(n, '이', '가')} 사과 박사구먼. 상금 10만원 받게.`, no:'아쉽구먼! 정답은'}};
// 2026-10-13 퀴즈는 문제를 낸 순간부터 2~3주 뒤에 다시 나와요(창을 닫아 버려도 다시 안 나옴)
const quizReady = who => absDay() >= ((G.quizNext || {})[who] || 0);
function quizUsed(who){ if (!G.quizNext) G.quizNext = {}; G.quizNext[who] = absDay() + rint(14, 21); G[QZ[who].k] = weekId(); }
const quizWait = who => Math.max(1, Math.ceil((((G.quizNext || {})[who] || 0) - absDay()) / 7));
function pickQuiz(){
  if (!G.quizSeen) G.quizSeen = [];
  let pool = QUIZ.map((q, i) => i).filter(i => !G.quizSeen.includes(i));
  if (!pool.length) { G.quizSeen = []; pool = QUIZ.map((q, i) => i); }
  const i = pick(pool); G.quizSeen.push(i);
  const q = QUIZ[i], ord = [0, 1, 2].sort(() => Math.random() - .5);
  return {q:q.q, e:q.e, a:ord.map(k => q.a[k]), c:ord.indexOf(q.c)};
}
function askQuiz(who){
  const Z = QZ[who], q = pickQuiz(); quizUsed(who);
  const o = talk(who, `${Z.ask(HN())}<br><b style="font-family:var(--display);font-weight:400;font-size:24px">Q. ${esc(q.q)}</b>`, '');
  $('#talkX').innerHTML = `<div class="quiz">${q.a.map((a, i) => `<button class="btn" data-a="${i}">${'①②③'[i]} ${esc(a)}</button>`).join('')}</div>`;
  const answer = i => {
    const right = i === q.c;
    if (right) { G.money += 100000; G.rep += 2; /* 2026-10-16 달 요청: 퀴즈 보상 2배 */ G.stats.quiz++; if (G.stats.quiz >= 5) unlock('quiz5'); updateHUD(true); }
    o.body.querySelector('.bubble').innerHTML = `<div class="who">${Z.name}</div>${right ? `${Z.ok(HN())} (평판 +2)` : `${Z.no} <b>${esc(q.a[q.c])}</b>${who === 'chief' ? '일세.' : '이란다.'}`}${q.e ? `<div class="fact" style="margin-top:10px">💡 ${esc(q.e)}</div>` : ''}`;
    $('#talkX').innerHTML = '';
    o.footEl.innerHTML = `<button class="btn pri" id="tOk">고마워요</button>`; $('#tOk').onclick = () => UI.close();
    if (AUTO) o.timer = setTimeout(() => UI.modal === o && UI.close(), POPMS / 2);
  };
  $('#talkX').querySelectorAll('[data-a]').forEach(b => b.onclick = () => answer(+b.dataset.a));

// 강변 마을 → 우리 과수원 → 사과골 마을 → (고갯길) → 강변 마을 … 한 방향으로 계속 돌아요. 정류장 표지판은 없고 세 곳에서 30초씩 서요.
// 가는 길에 짐칸에 태워 줘요(설 때 F로 타고, 설 때 F로 내려요)
const BUS_V = 680, BUS_DWELL = 30;
const BUS_LINE = (() => {
  const rev = a => a.slice().reverse(), sm = a => chaikin(chaikin(a));
  const R = MAP_ROADS, J = (...chunks) => { const o = []; for (const c of chunks) for (const p of c) { const l = o[o.length - 1]; if (!l || Math.hypot(l[0] - p[0], l[1] - p[1]) > 1) o.push(p); } return o; };

    [V2W, plaza2, V2E, V2NE],                         // 사과골 마을 길
    sm(rev(R[4])),                                    // 고갯길 → 강변 마을
    [V1E, [V1.cx, V1.cy]]

})();
const BUS_CUM = (() => { const c = [0]; for (let i = 1; i < BUS_LINE.length; i++) c.push(c[i - 1] + Math.hypot(BUS_LINE[i][0] - BUS_LINE[i - 1][0], BUS_LINE[i][1] - BUS_LINE[i - 1][1])); return c; })();

const BUS_STOPS = [{name:'강변 마을', s:0}, {name:'우리 과수원', s:nearestS(-700, 1250)}, {name:'사과골 마을', s:nearestS(VNEW.x, VNEW.y)}];

function updateBus(dt){
  for (const b of BUSES) {

      const V = truckV(), v = clamp(Math.min(left, gone) * 1.3 + 90, 90, V), step = v * dt; // 2026-10-16 호랑이보다 10% 빠르게 // 서기 전후엔 천천히

// ===== 농사 미니게임 (2026-10-15 달 요청: 농사 재미 아이디어 1·2·3·5번) =====
// 꽃솎기 = 왕꽃 찾기, 열매솎기 = 한 뼘 간격, 가지치기 = 자를 가지 찾기.
// 우주가 줄의 나무 한 그루에서 F를 누르면 미니게임이 열리고, 등급이 그 줄에서 아직 안 한 나무 전체에 적용돼요.
// 인부가 한 나무는 예전 그대로(배율 1). 수확 품질의 작업 점수(가지치기 14·꽃솎기 10·열매솎기 14)에 배율을 곱해요.
// 2026-10-16 달 요청: 수확 전 요오드 익음 검사는 뺐어요(수확은 바로 따요).
const FG_MULT = {S:1.3, A:1.1, B:.85, C:.55};
const FG_GRADE = s => s >= 90 ? 'S' : s >= 75 ? 'A' : s >= 50 ? 'B' : 'C';
const FG_GTXT = {S:'아주 잘했어요!', A:'잘했어요!', B:'괜찮아요', C:'아쉬워요'};
const FG_GCOL = {S:'#ff6b57', A:'#ffb13b', B:'#7cc58a', C:'#9b8e86'};
const FG_QKEY = {prune:'prQ', blossom:'blQ', thin:'thQ'};
const FG_W = 860, FG_H = 430;
let fgLast = null; // 테스트용: 마지막 미니게임 상태

function fgRowTrees(row, k){
  const a = [];
  for (let j = 0; j < PER_ROW; j++) { const i = row * PER_ROW + j; if (i < G.trees.length && taskFor(i) === k) a.push(i); }
  return a;
}

// 07_main act()에서 불러요. true면 미니게임·검사 창을 열었으니 바로 작업하지 않아요
function fgHook(k, i){
  if (AUTO) return false;
  if (FG_DEF[k]) { farmGame(k, i); return true; }
  return false;
}

function fgApply(k, row, grade, S){
  const list = fgRowTrees(row, k), qk = FG_QKEY[k];
  for (const i of list) {
    if (!doTask(i, 'me')) continue;
    const t = G.trees[i]; t[qk] = FG_MULT[grade];
    // 열매솎기를 대충 하면(C) 절반 확률로 다음 해 해거리
    if (k === 'thin' && grade === 'C' && Math.random() < .5) t.alt = 1;
  }
  let spread = 0;
  if (k === 'prune' && S.cankerMissed) {
    for (let j = 0; j < PER_ROW && spread < 2; j++) { const t = G.trees[row * PER_ROW + j]; if (t && Math.random() < .5) { t.dmg += 6; spread++; } }
  }
  gainXp(Math.max(2, Math.round(list.length * 1.5)) + {S:6, A:3, B:1, C:0}[grade]);
  const p = treePos(S.i);
  floats.push({x:p.x, y:p.y - 160, s:`${TASKS[k].ic} ${grade} · ${list.length}그루`, t:1.6, c:FG_GCOL[grade]});
  G.facts[k] = 1; // 상식은 결과 창에 보여 줬어요
  return {n:list.length, spread};
}

function farmGame(k, i){
  const D = FG_DEF[k], row = Math.floor(i / PER_ROW), n = fgRowTrees(row, k).length;
  const S = fgLast = {k, i, row, t:D.time, T:D.time, done:false, msg:''};
  D.init(S);
  if (typeof sfx === 'function') sfx('click');
  const o = UI.open({ic:TASKS[k].ic, title:`${D.title} · ${row + 1}번째 줄 ${n}그루`, w:940, noX:true, render(o){
    o.body.innerHTML = `<p style="font-size:21px;margin:0 6px 8px;text-align:center">${D.tip}</p>
      <div style="height:12px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:0 6px 8px;background:#fff"><i id="fgBar" style="display:block;height:100%;background:#7cc58a;width:100%"></i></div>
      <canvas id="fgCv" width="${FG_W}" height="${FG_H}" style="display:block;margin:0 auto;width:${FG_W}px;max-width:100%;border:2.5px solid var(--ink);border-radius:14px;touch-action:none;cursor:pointer"></canvas>
      <p id="fgMsg" style="font-size:20px;min-height:30px;margin:8px 6px 0;text-align:center"></p>`;
    o.footEl.innerHTML = `<button class="btn" id="fgQuit">그만두기</button> <button class="btn go" id="fgDone">다 했어요</button>`;
  }});
  o.onKey = code => !S.done && (code === 'KeyF' || code === 'Space');
  const cv = $('#fgCv'), c = cv.getContext('2d'), bar = $('#fgBar'), msg = $('#fgMsg');
  $('#fgQuit').onclick = () => UI.close();
  $('#fgDone').onclick = () => finish();
  cv.onpointerdown = e => {
    if (S.done) return;
    const r = cv.getBoundingClientRect();
    const p = {x:(e.clientX - r.left) * FG_W / r.width, y:(e.clientY - r.top) * FG_H / r.height};
    D.click(S, p);
    if (S.msg) { msg.innerHTML = S.msg; S.msg = ''; }
    if (D.allDone && D.allDone(S)) setTimeout(finish, 350);
  };
  function finish(){
    if (S.done) return; S.done = true;
    const r = D.score(S), sc = Math.round(clamp(r.score, 0, 100)), g = FG_GRADE(sc), ap = fgApply(k, row, g, S);
    if (typeof sfx === 'function') sfx(g === 'S' || g === 'A' ? 'good' : 'bad');
    o.body.innerHTML = `<div style="display:flex;gap:18px;align-items:center;justify-content:center;margin:4px 0 10px">
        <div style="font-size:84px;font-weight:900;color:${FG_GCOL[g]};-webkit-text-stroke:2px var(--ink)">${g}</div>
        <div style="font-size:24px"><b>${FG_GTXT[g]}</b> (${sc}점)<br>${row + 1}번째 줄 ${ap.n}그루에 적용했어요.</div></div>
      <ul style="font-size:20px;line-height:1.55;margin:0 18px 10px">${r.lines.map(x => `<li>${x}</li>`).join('')}${ap.spread ? `<li style="color:#c0392b">화상병 가지를 놓쳐서 옆 나무 ${ap.spread}그루가 병에 걸렸어요.</li>` : ''}</ul>
      <div style="font-size:19px;background:#fff7d6;border:2px solid var(--ink);border-radius:12px;padding:10px 14px;margin:0 10px">💡 ${D.fact}</div>`;
    o.footEl.innerHTML = `<button class="btn pri" id="popOk">좋아요</button>`;
    $('#popOk').onclick = () => UI.close();
  }
  let last = performance.now();
  (function frame(now){
    if (UI.modal !== o) return;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!S.done) {
      S.t -= dt; if (S.t <= 0) { S.t = 0; finish(); }
      bar.style.width = (100 * S.t / S.T) + '%'; bar.style.background = S.t < 6 ? '#ff6b57' : '#7cc58a';
      c.clearRect(0, 0, FG_W, FG_H); D.draw(c, S, now / 1000);
    }
    requestAnimationFrame(frame);
  })(last);
}

// ----- 그리기 도우미 -----
function fgFlower(c, x, y, r, open, col){
  c.lineWidth = 2; c.strokeStyle = INK;
  if (!open) { // 아직 덜 핀 분홍 꽃봉오리
    c.beginPath(); c.ellipse(x, y, r * .62, r * .78, 0, 0, Math.PI * 2); c.fillStyle = '#f7a8bf'; c.fill(); c.stroke();
    c.beginPath(); c.moveTo(x, y - r * .7); c.lineTo(x, y + r * .6); c.strokeStyle = '#d97a98'; c.stroke(); return;
  }
  for (let k = 0; k < 5; k++) {
    const a = k * Math.PI * 2 / 5 - Math.PI / 2;
    c.beginPath(); c.arc(x + Math.cos(a) * r * .55, y + Math.sin(a) * r * .55, r * .5, 0, Math.PI * 2);
    c.fillStyle = col || '#fffafb'; c.fill(); c.strokeStyle = INK; c.stroke();
  }
  c.beginPath(); c.arc(x, y, r * .3, 0, Math.PI * 2); c.fillStyle = '#ffcf3a'; c.fill(); c.stroke();
}
function fgText(c, s, x, y, col, sz){ c.font = `bold ${sz || 18}px sans-serif`; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = '#fff'; c.strokeText(s, x, y); c.fillStyle = col || INK; c.fillText(s, x, y); }
function segDist(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy || 1;
  const u = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / L, 0, 1);
  return Math.hypot(p.x - a.x - u * dx, p.y - a.y - u * dy);
}

const FG_DEF = {

  // ===== 1위 열매솎기: 한 뼘 간격 =====

    fact:'사과는 가지 한 뼘(약 15cm)에 열매 하나만 남겨요. 너무 많이 달면 사과가 작아지고, 다음 해 꽃이 적게 피는 해거리가 생겨요.',

      if (notBest) lines.push(`더 큰 열매 대신 작은 걸 남긴 곳이 ${notBest}곳 있어요.`);

        c.strokeStyle = '#5f9a20'; c.lineWidth = 3; c.beginPath(); c.moveTo(cl.x, 220); c.lineTo(f.x, f.y - f.r); c.stroke();

// 서버(Firebase Realtime Database + 익명 로그인)를 달이 연결하기 전에는 '내 기록'만 보여요.
// 연결하려면 RANK_CFG에 db 주소와 apiKey만 넣으면 돼요. 이름 말고 다른 개인정보는 보내지 않아요.
const RANK_CFG = {db:'https://orchard-rank-default-rtdb.asia-southeast1.firebasedatabase.app', apiKey:'AIzaSyD0EKMi-3zuDYAkgPNlsXuwZ9jycxPLjaY'};
const rankOnline = () => !!(RANK_CFG.db && RANK_CFG.apiKey);

const RANK_MAX = {lv:99, rep:999, money:1e11, avg:1440, year:200};
const RANK_BAD = ['시발', '씨발', 'ㅅㅂ', 'ㅆㅂ', '병신', 'ㅂㅅ', '개새', '새끼', '좆', '존나', '지랄', '미친', '닥쳐', '꺼져', '니미', '느금', '엠창', 'fuck', 'shit', 'bitch', 'sex', '섹스', 'porn', 'damn'];

// 연평균 수확량 = 지금까지 딴 상자 ÷ 지나간 해 수(올해 포함)
function rankStats(){
  const lv = (G.fm && G.fm.lv) || 1, year = G.year || 1;
  const avg = Math.round((G.stats.boxes || 0) / Math.max(1, year) * 10) / 10;
  const r = {name:HN(), lv:Math.min(lv, RANK_MAX.lv), rep:Math.min(G.rep || 0, RANK_MAX.rep), money:clamp(Math.round(G.money || 0), 0, RANK_MAX.money), avg:Math.min(avg, RANK_MAX.avg), year:Math.min(year, RANK_MAX.year)};
  r.score = rankScore(r);
  return r;
}
// 점수 = 연평균 수확 상자 × 10 + 평판 × 20 + 레벨 × 30 + 돈 10만원마다 1점
function rankScore(r){ return Math.floor(r.avg * 10 + r.rep * 20 + r.lv * 30 + r.money / 100000); }
function rankNameOk(n){
  n = String(n || '').trim();
  if (n.length < 1 || n.length > 10) return '이름은 1~10글자로 해 주세요.';
  if (!/^[가-힣a-zA-Z0-9 _.\-]+$/.test(n)) return '이름은 한글·영어·숫자와 - _ . 만 쓸 수 있어요.'; // 2026-10-17 달 요청: 'kr-TEST'처럼 - 도 돼요
  const low = n.toLowerCase().replace(/\s/g, '');
  if (RANK_BAD.some(w => low.includes(w))) return '랭킹에는 고운 이름만 올릴 수 있어요.';
  return '';
}

// ----- 서버 연결 (익명 로그인 토큰은 이 브라우저에만 저장) -----
let rankTok = null;
async function rankAuth(){
  if (rankTok && rankTok.exp > Date.now() + 60000) return rankTok;
  const k = RANK_CFG.apiKey, saved = JSON.parse(store.get('haru-rank-auth', 'null') || 'null');
  let res;
  if (saved && saved.refresh) {
    res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + k, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(saved.refresh)});
    if (res.ok) { const j = await res.json(); rankTok = {id:j.id_token, uid:j.user_id, refresh:j.refresh_token, exp:Date.now() + (+j.expires_in) * 1000}; }
  }
  if (!rankTok) {
    res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + k, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true})});
    if (!res.ok) throw new Error('login ' + res.status);
    const j = await res.json(); rankTok = {id:j.idToken, uid:j.localId, refresh:j.refreshToken, exp:Date.now() + (+j.expiresIn) * 1000};
  }
  store.set('haru-rank-auth', JSON.stringify({refresh:rankTok.refresh}));
  return rankTok;
}
const rankUrl = p => RANK_CFG.db.replace(/\/$/, '') + p;
async function rankSubmit(){
  const r = rankStats(), bad = rankNameOk(r.name);
  if (bad) throw new Error(bad);
  const a = await rankAuth();
  const res = await fetch(rankUrl('/rank/' + a.uid + '.json?auth=' + a.id), {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...r, t:{'.sv':'timestamp'}})});
  if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? '조금 뒤에 다시 올려 주세요(1분에 한 번).' : `올리지 못했어요 (오류 ${res.status}).`);
  G.rankSent = Date.now(); return a.uid;
}
async function rankFetch(){
  const res = await fetch(rankUrl('/rank.json?orderBy="score"&limitToLast=100'));
  if (!res.ok) throw new Error('list ' + res.status);
  const j = await res.json() || {};
  return Object.entries(j).map(([id, v]) => ({id, ...v})).filter(v => v && v.score === rankScore(v) && !rankNameOk(v.name)).sort((a, b) => b.score - a.score);
}

// ----- 인벤토리 (I 키) : 전리품·장비 한눈에 -----
// 2026-10-13 가방: 왼쪽에 주인공이 보이고, 오른쪽 장비를 끌어다 칸(또는 주인공)에 놓으면 껴요. 눌러도 껴요
const SLOT_POS = {hat:{x:250, y:40}, weapon:{x:12, y:170}, armor:{x:250, y:170}, boots:{x:250, y:300}};
function drawDoll(cv){
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  const g = c.createRadialGradient(160, 330, 20, 160, 300, 220); g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#fffaf1');
  c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
  c.save(); c.translate(160, 392); c.scale(2.85, 2.85);
  drawPerson(c, 0, 0, 'haru', 0, 0, 0);
  c.save(); c.translate(-22, -44); drawWeapon(c, ensureGear().weapon, -.35); c.restore();
  c.restore();
}
function equipGear(s, id){ if (!(id in G.gear.own) || G.gear[s] === id) return false; G.gear[s] = id; sfx('good'); toast(`🎒 ${jo(gearItem(s, id).name, '을', '를')} 꼈어요!`, 'good'); updateHUD(true); return true; }
function uiInv(){
  ensureGear();
  UI.open({ic:'🎒', title:HN() + '의 가방', w:1240, inv:1, render(o){
    const g = G.gear, f = farmer(), have = LOOT_KEYS.filter(k => G.bag[k] > 0);
    const total = have.reduce((a, k) => a + lootPrice(k) * G.bag[k], 0);
    const loot = have.length ? have.map(k => { const L = LOOT[k]; return `<div class="ivc" title="${esc(L.desc)}"><i>${L.ic}</i><b>${L.name}</b><span class="ivn">×${G.bag[k]}</span><small>오늘 ${won(lootPrice(k))}</small></div>`; }).join('')
      : '<div class="gnote">아직 전리품이 없어요. 사냥터에서 산짐승을 쫓거나 반짝이는 자리를 캐 보세요! 🌲</div>';
    const gear = SLOTS.flatMap(s => GEAR[s].items.filter(it => it.id in g.own).map(it => {
      const lv = g.own[it.id] || 0, on = g[s] === it.id;
      return `<div class="ivc drag ${on ? 'on' : ''}" data-eq="${s}|${it.id}">${gearImg(it.id, 56)}<b>${it.name}${lv ? ` +${lv}` : ''}</b><small>${GEAR[s].ic} ${GEAR[s].unit} ${itemStat(s, it.id, lv)}</small>${on ? '<span class="ivt">끼는 중</span>' : '<span class="ivt off">끌어다 끼기</span>'}${gearSellBtns(s, it)}</div>`;
    })).join('');
    const slots = SLOTS.map(s => { const id = g[s], lv = g.own[id] || 0, P2 = SLOT_POS[s];
      return `<div class="dslot" data-slot="${s}" style="left:${P2.x}px;top:${P2.y}px" title="${GEAR[s].name}">${gearImg(id, 52)}<small>${GEAR[s].name}${lv ? ` +${lv}` : ''}</small></div>`; }).join('');
    o.body.innerHTML = `<div class="gstat"><b>🧑‍🌾 ${HN()} Lv.${f.lv}</b><span>💰 ${won(G.money)}</span><span>💎 강화석 ${g.stones || 0}개</span><span>🧺 전리품 ${bagCount()}개 · 팔면 약 ${won(total)}</span></div>
      <div class="ivwrap"><div class="doll" id="doll"><canvas id="dollCv" width="330" height="420"></canvas>${slots}
        <div class="dstat">⚔️ 공격 <b>${f.atk}</b> · 🛡️ 방어 <b>${f.def}</b> · 👢 +${f.spd}% · ❤️ ${f.hp}</div></div>
      <div class="ivside"><h3 class="ivh" style="margin-top:4px">🛠️ 장비 <small>끌어서 왼쪽 칸에 놓거나 눌러서 껴요</small></h3><div class="ivg g4">${gear}</div>
      <h3 class="ivh">🧺 전리품</h3><div class="ivg g4">${loot}</div></div></div>`;
    drawDoll($('#dollCv'));
    bindSellBtns(o.body, o);
    // 끌어다 놓기 (마우스·손가락 모두)
    o.body.querySelectorAll('.ivc[data-eq]').forEach(card => card.onpointerdown = e => {
      if (e.target.closest('button')) return;
      const [s, id] = card.dataset.eq.split('|'), x0 = e.clientX, y0 = e.clientY;
      let ghost = null;
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) {
          ghost = document.createElement('div'); ghost.className = 'dghost'; ghost.innerHTML = gearImg(id, 64); document.body.appendChild(ghost);
          o.body.querySelectorAll(`.dslot[data-slot="${s}"]`).forEach(d => d.classList.add('want'));
        }
        if (ghost) { ghost.style.left = ev.clientX - 36 + 'px'; ghost.style.top = ev.clientY - 36 + 'px'; const t = document.elementFromPoint(ev.clientX, ev.clientY); o.body.querySelectorAll('.dslot').forEach(d => d.classList.toggle('hov', !!t && (t.closest('.dslot') === d || (t.closest('#doll') && d.dataset.slot === s)))); }
      };
      const up = ev => {
        removeEventListener('pointermove', move); removeEventListener('pointerup', up);
        if (ghost) { ghost.remove(); const t = document.elementFromPoint(ev.clientX, ev.clientY), sl = t && t.closest('.dslot');
          if ((sl && sl.dataset.slot === s) || (!sl && t && t.closest('#doll'))) equipGear(s, id);
          else if (sl) toast(`${GEAR[s].name} 칸이 아니에요`, 'bad'); }
        else equipGear(s, id);
        o.render(o);
      };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
    o.footEl.innerHTML = `<span style="align-self:center;margin-right:auto">I 키로 열고 닫아요 · 전리품은 금비상회에서 팔아요</span><button class="btn" id="ivGear">🔨 장비 사기·강화</button><button class="btn pri" id="ivOk">닫기</button>`;
    $('#ivGear').onclick = () => { UI.close(); setTimeout(uiGear, 160); };
    $('#ivOk').onclick = () => UI.close();
  }});
}

const SND = {ctx:null, master:null, bgmG:null, sfxG:null, on:{bgm:true, sfx:true}, vol:{bgm:.18, sfx:.6}, step:0, nextT:0, timer:null, mode:'home'};

function sndInit(){

  const c = SND.ctx = new AC();
