<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d2a20">
<title>과수원키우기</title>
<meta name="description" content="사과나무를 심고 키워서 수확하는 과수원 게임">
<meta property="og:title" content="과수원키우기">
<meta property="og:description" content="사과나무를 심고 키워서 수확하는 과수원 게임">
<meta property="og:site_name" content="과수원키우기">
<meta property="og:type" content="website">
<meta name="twitter:title" content="과수원키우기">
<meta name="application-name" content="과수원키우기">
<meta name="apple-mobile-web-app-title" content="과수원키우기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 1920x1080 고정 무대를 창에 맞춰 축소. 그림은 캔버스, 글자는 위에 얹은 카드. */
:root{
  --ink:#2a1c17;          /* 셀화 외곽선·글자 */
  --paper:#fffaf1;        /* 카드 바탕 */
  --apple:#e8423a;        /* 대표색 */
  --leaf:#4fae5a;         /* 잎 */
  --sky:#7cc7f2;          /* 하늘 */
  --sun:#ffd25e;          /* 강조 노랑 */
  --plum:#8c5cf0;         /* 자동플레이 */
  --muted:#7b6a60;
  --line:#ead9c6;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:#1d2a20;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#8fd16a}
#cv,#mini{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#mini{z-index:40}
.battleOn #joy,.battleOn #fBtn{z-index:50}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* 셀화 카드: 두꺼운 외곽선 + 딱 떨어지는 그림자 */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 rgba(42,28,23,.85)}
.hud{position:absolute;z-index:10}

#wx{left:18px;top:16px;width:330px;padding:14px 16px 12px;transform:scale(.8);transform-origin:0 0} /* 2026-10-13 왼쪽 위, 조금 작게 */
#wx .date{font-family:var(--display);font-size:24px;line-height:1.15}
#wx .sub{font-size:16px;color:var(--muted);margin-top:2px}
#wx .row{display:flex;align-items:center;gap:12px;margin-top:10px}
#wx .big{font-size:42px;line-height:1}
#wx .temp{font-family:var(--display);font-size:30px}
#wx .wind{display:flex;align-items:center;gap:6px;font-size:16px;margin-left:auto;text-align:right}
#wx .arrow{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:#e8f6ff;display:grid;place-items:center;font-size:20px;transition:transform .6s}
.risk{margin-top:9px}
.risk .lab{display:flex;justify-content:space-between;font-size:16px;font-family:var(--display)}
.bar{height:13px;border:2.5px solid var(--ink);border-radius:9px;background:#f1e6d8;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
#wx .shield{margin-top:9px;font-size:15px;background:#e5f7ea;border:2px solid #7cc58a;border-radius:10px;padding:4px 8px}

#top{right:290px;top:18px;display:flex;gap:12px;align-items:stretch} /* 오른쪽 끝은 작은 지도 자리 */
#top .pill{display:flex;align-items:center;gap:8px;padding:8px 18px;font-family:var(--display);font-size:26px}
#clock{display:flex;align-items:center;gap:6px;padding:6px 10px}
#clock .t{font-family:var(--display);font-size:26px;min-width:150px;text-align:center}
.sp{width:46px;height:42px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:18px}
.sp.on{background:var(--sun)}

#todo{right:20px;top:316px;width:252px;box-sizing:border-box;padding:10px 10px} /* 2026-10-13 작은 지도와 같은 폭 */
#todo h3{font-size:21px!important}
#todo li{font-size:15px!important;padding:6px 7px!important;gap:6px!important;word-break:keep-all;line-height:1.25}
#todo li .n{font-size:15px!important}
#todo li .ic{font-size:19px!important}
#todo h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;display:flex;justify-content:space-between;cursor:pointer}
#todo ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;max-height:440px;overflow:auto}
#todo li{display:flex;align-items:center;gap:8px;font-size:17px;padding:7px 9px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
#todo li .n{margin-left:auto;font-family:var(--display);font-size:17px;white-space:nowrap}
#todo li.hot{border-color:#ff8a7a;background:#fff0ec}
#todo li.done{opacity:.55}
#todo li .ic{font-size:22px}
#todo.fold ul{display:none}

#bar{left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;padding:9px 12px}
.tb{width:104px;height:92px;border-radius:16px;border:2.5px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.tb b{font-size:36px;font-weight:400;line-height:1}
.tb:hover{background:#fff6d6}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tb.alert{background:#ffe1dc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#ffb8ad}}

@keyframes glow{50%{filter:brightness(1.18)}}
#helpBtn{left:20px;bottom:18px;padding:10px 16px;font-size:20px}
#help{left:20px;bottom:80px;padding:14px 18px;font-size:17px;line-height:1.7;width:330px}
#help b{font-family:var(--display);font-weight:400;display:inline-block;min-width:96px;margin-right:6px}
.kbt{width:100%;border-collapse:collapse;font-size:18px}.kbt td,.kbt th{padding:6px 8px;border-bottom:1.5px dashed #e3d8c4;text-align:left}.kbt .kbb{min-width:250px;font-size:17px;padding:6px 10px}

#toasts{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 20px;font-size:21px;font-family:var(--display);box-shadow:0 5px 0 var(--ink);animation:tin .25s;max-width:820px;text-align:center}
.toast.good{background:#e9fbe9}.toast.bad{background:#ffe7e2}.toast.gold{background:#fff3c4}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}

#modalWrap{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(30,20,15,.42)}
#modalWrap.on{display:flex}
.modal{width:980px;max-height:900px;display:flex;flex-direction:column;padding:0;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:3px solid var(--ink);background:#ffe9a8}
.modal .mh h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.modal .mh .x{margin-left:auto;width:52px;height:52px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-size:26px}
.modal .mb{padding:18px 22px;overflow:auto;font-size:19px;line-height:1.55}
.modal .mf{padding:14px 22px;border-top:2px dashed var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:14px;border:2.5px solid var(--ink);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--apple);color:#fff}
.btn.go{background:#5cc46c;color:#fff}
.btn.y{background:var(--sun)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.opt{border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;text-align:left;font-family:var(--body);font-size:17px;line-height:1.4}
.opt .t{font-family:var(--display);font-size:24px;display:flex;align-items:center;gap:8px}
.opt .p{font-family:var(--display);font-size:20px;color:#b2332b}
.opt.sel{background:#fff3c4;box-shadow:0 0 0 4px var(--sun)}
.opt.lock{opacity:.5}
.opt.have{background:#e9fbe9}
.gstat{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--display);font-size:21px;background:#fff7dc;border:2.5px solid var(--ink);border-radius:16px;padding:10px 16px}
.xpb{display:inline-block;width:160px;height:16px;border:2.5px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}.xpb i{display:block;height:100%;background:#ffb13b}
.ivh{font-family:var(--display);font-size:24px;margin:16px 2px 8px}.ivh small{font-size:15px;color:var(--muted)}
.ivg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.ivc{position:relative;border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default}
.ivc[data-eq]{cursor:pointer}.ivc.on{background:#fff3c4;box-shadow:0 0 0 3px #ffd25e}
.ivc i{font-style:normal;font-size:44px;line-height:1.1}.ivc b{font-family:var(--display);font-size:17px;font-weight:400}.ivc small{font-size:14px;color:var(--muted)}
.ivn{position:absolute;right:8px;top:6px;font-family:var(--display);font-size:20px;color:#d6372c}
.ivwrap{display:flex;gap:16px;margin-top:12px;align-items:flex-start}.ivside{flex:1;min-width:0}.ivg.g4{grid-template-columns:repeat(4,1fr)}
.doll{position:relative;width:330px;height:470px;flex:none;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;background:#fffaf1}
.doll canvas{display:block}.dstat{position:absolute;left:0;right:0;bottom:0;padding:10px 6px;text-align:center;font-family:var(--display);font-size:17px;background:#fff3c4;border-top:2.5px solid var(--ink)}
.dslot{position:absolute;width:68px;height:80px;border:2.5px dashed var(--ink);border-radius:14px;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.dslot small{font-size:11px;line-height:1.1;text-align:center}.dslot.want{border-color:#2f8a3e;background:#e8f8e0}.dslot.hov{box-shadow:0 0 0 4px #ffd25e;transform:scale(1.06)}
.ivc.drag{cursor:grab;touch-action:none}.dghost{position:fixed;z-index:9999;pointer-events:none;width:72px;height:72px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ivt{font-size:13px;background:#ffd25e;border:1.5px solid var(--ink);border-radius:8px;padding:1px 6px}.ivt.off{background:#eee}
.hpg{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hpc h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.hpr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.hpk{border:2.5px solid var(--ink);border-radius:16px;background:#f3fbe8;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:16px;cursor:pointer}
.hpk canvas{width:110px;height:183px}.hpk.on{background:#fff3c4;box-shadow:0 0 0 4px #ffd25e;transform:translateY(-3px)}
.hpn{display:flex;align-items:center;gap:14px;margin-top:16px;font-family:var(--display);font-size:22px}
.hpn input{font:inherit;font-size:24px;padding:8px 14px;border:2.5px solid var(--ink);border-radius:12px;width:260px}.hpn small{font-family:var(--body);font-size:15px;color:var(--muted)}
.snd{display:flex;align-items:center;gap:14px;margin:10px 0;font-family:var(--display);font-size:22px}.snd b{width:150px;font-weight:400}.snd input{flex:1;accent-color:#e8423a}.snd span{width:40px;text-align:right}.snd .btn{width:96px}
.gnote{font-size:16px;color:var(--muted);margin:10px 2px}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gslot{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:10px 12px}
.gh{font-family:var(--display);font-size:22px;margin-bottom:6px}.gh small{font-size:16px;color:var(--muted)}
.gi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 4px;border-top:1.5px dashed #e3d8c4;font-size:15px}
.gi .gimg{flex:none;background:#fffaf1;border:2px solid #e3d8c4;border-radius:12px}.gi .gtx{flex:1;min-width:0}
.gsb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.btn.sm{font-size:14px!important;padding:4px 9px!important;border-width:2px}.btn.warn{background:#ff6b57;color:#fff}
.ivc .gsb{justify-content:center}
.gi.on{background:#fff3c4;border-radius:10px}.gi.lock{opacity:.55}.gi .btn{font-size:16px;padding:6px 10px;white-space:nowrap}
.gs{color:#b2332b;font-family:var(--display)}.gd{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:9px 18px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-size:20px}
.tab.on{background:var(--sun)}
table.tbl{width:100%;border-collapse:collapse;font-size:19px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left}
.tbl th{font-family:var(--display);font-weight:400;color:var(--muted)}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);vertical-align:-3px;margin-right:6px}
.fact{background:#eef8ff;border:2.5px solid #7fb8e0;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:18px}
.big-emoji{font-size:84px;text-align:center;line-height:1.1}
textarea{width:100%;box-sizing:border-box;height:110px;font-size:15px;border:2.5px solid var(--ink);border-radius:12px;padding:8px;font-family:monospace}

/* 경매 */
.bidders{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
.bidder{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:8px;text-align:center;font-size:16px;transition:transform .2s}
.bidder canvas{width:72px;height:72px;display:block;margin:0 auto}
.bidder .bp{font-family:var(--display);font-size:20px}
.bidder.win{background:#fff3c4;transform:scale(1.07);box-shadow:0 0 0 4px var(--sun)}
.bidder.big{background:#ffe0f0}
.ticker{font-family:var(--display);font-size:44px;text-align:center}

/* 대화 */
.talk{display:flex;gap:18px;align-items:flex-start}
.talk canvas{flex:none;border:3px solid var(--ink);border-radius:18px;background:#d8f0ff}
.talk .bubble{flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:21px;line-height:1.55;min-height:120px}
.talk .who{font-family:var(--display);font-size:24px;margin-bottom:4px}
.quiz{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.quiz .btn{text-align:left}

/* 전투 */
.battle canvas{width:100%;border:3px solid var(--ink);border-radius:16px;display:block}
.hp{display:flex;gap:16px;margin:10px 0}
.hp>div{flex:1}
.hp .bar{height:18px}
.blog{min-height:56px;font-size:21px;font-family:var(--display);text-align:center;padding:6px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.acts .btn{font-size:19px;padding:10px 6px}

/* 터치 */
#touchUI{display:none}
.touch #touchUI{display:block}
#joy{position:absolute;left:70px;bottom:150px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(42,28,23,.5);z-index:20}
#joy i{position:absolute;left:95px;top:95px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.85);border:4px solid var(--ink)}
#fBtn{position:absolute;right:70px;bottom:170px;width:220px;height:220px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);z-index:20;font-family:var(--display);font-size:80px;box-shadow:0 8px 0 var(--ink)}
#fBtn small{display:block;font-size:26px;margin-top:-6px}
#atkBtn,#gongBtn{position:absolute;width:150px;height:150px;border-radius:50%;background:#ff8a6a;border:4px solid var(--ink);z-index:20;font-size:58px;box-shadow:0 6px 0 var(--ink);line-height:1}
#atkBtn{right:310px;bottom:150px} #gongBtn{right:300px;bottom:330px;width:120px;height:120px;font-size:44px;background:#ffd25e}
#atkBtn small,#gongBtn small{display:block;font-size:22px;font-family:var(--display)}
#sleepFx{position:absolute;inset:0;z-index:300;background:#140f22;color:#fff6d8;font-family:var(--display);font-size:72px;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s}
#sleepFx.on{opacity:1;pointer-events:auto}
#fsBtn{position:absolute;left:20px;top:240px;z-index:20;width:70px;height:62px;font-size:30px}
.touch .touch #helpBtn,.touch #help{display:none}
.touch .tb{width:128px;height:110px;font-size:21px}
.touch .tb b{font-size:44px}
#rotate{display:none;position:fixed;inset:0;z-index:999;background:#ffe9a8;color:var(--ink);font-family:var(--display);font-size:28px;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px}
#rotate b{font-size:80px;font-weight:400}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>

  <div id="wx" class="hud card" aria-live="polite"></div>

  <div id="top" class="hud">
    <div class="pill card" title="가진 돈">💰 <span id="money">0</span></div>
    <div class="pill card" title="마을 평판">⭐ <span id="rep">0</span></div>
    <div id="clock" class="card">
      <span class="t" id="clockT">06:00</span>
      <button class="sp" id="sndBtn" data-ui="sound" title="소리">🔊</button>
    </div>
  </div>

  <div id="todo" class="hud card"><h3 id="todoH"><span>📋 이번 주 할 일</span><span id="todoArrow">▾</span></h3><ul id="todoL"></ul></div>

  <button id="helpBtn" class="hud card">⌨️ 조작법</button>
  <div id="help" class="hud card" hidden>
    <div><b>WASD·방향키</b>걷기</div>
    <div><b>마우스 클릭</b>그 자리로 걷기</div>
    <div><b>마우스 드래그</b>화면 둘러보기</div>
    <div><b>F</b>일하기·말 걸기 (싸울 땐 누르고 있으면 막기, 최대 2초·쉬는 시간 5초)</div>
    <div><b>Space</b>휘두르기 공격 (한 마리, 도구 +5부터 여러 마리)</div>
    <div><b>I</b>가방 (전리품·장비)</div>
    <div><b>Q</b>꽹과리 (산짐승 깜짝)</div>
    <div><b>농막</b>자고 일어나면 다음 할 일까지</div>
  </div>

  <div id="bar" class="hud card">
    <button class="tb" data-ui="plant"><b>🌱</b>묘목</button>
    <button class="tb" data-ui="spray" id="sprayBtn"><b>💧</b>방제</button>

const won = n => {
  n = Math.round(n);
  const s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n >= 100000000) return s + (n / 100000000).toFixed(n % 100000000 ? 2 : 0).replace(/\.?0+$/,'') + '억원';
  if (n >= 10000) return s + Math.round(n / 10000).toLocaleString('ko-KR') + '만원';
  return s + n.toLocaleString('ko-KR') + '원';
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function jo(w, a, b){ const k = w.replace(/[^가-힣]+$/, ''), c = k.charCodeAt(k.length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b); }

function weekLabel(w){
  const doy = (w - 1) * 7 + 3;
  const md = [31,28,31,30,31,30,31,31,30,31,30,31];
  let m = 0, d = doy;
  while (d >= md[m]) { d -= md[m]; m++; if (m > 11) { m = 11; break; } }
  return {m: m + 1, wk: Math.floor(d / 7) + 1};
}
function seasonOf(w){
  if (w <= 9 || w >= 49) return 'winter';
  if (w <= 21) return 'spring';
  if (w <= 37) return 'summer';
  return 'autumn';
}

// ----- 날씨 -----
function genWeather(first){
  const w = G.week, x = G.wx;
  const clim = 11.5 - 14.5 * Math.cos(2 * Math.PI * (w - 3) / 52);
  const monsoon = w >= 26 && w <= 31;
  let pRain = monsoon ? .55 : (w >= 14 && w <= 42 ? .24 : .14);
  if (x.rain) pRain += .12;
  x.rain = Math.random() < pRain;
  x.temp = Math.round((clim + rnd(-3, 3)) * 10) / 10;
  x.hum = Math.round(x.rain ? rnd(84, 98) : rnd(42, 74) + (monsoon ? 10 : 0));
  x.dir = (x.dir + rint(-1, 1) + 8) % 8;
  x.wind = Math.round(clamp(x.wind + rnd(-2.2, 2.2), 0.5, 10) * 10) / 10;
  if (Math.random() < .25) x.wind = Math.round(rnd(1, 4) * 10) / 10;
  x.sky = x.rain ? (x.temp < 1 ? 'snow' : 'rain') : (Math.random() < .35 ? 'cloud' : 'sun');
  if (first) return;
  if (w >= 14 && w <= 42) {
    x.dis = x.dis * .68 + (x.rain ? 19 : 0) + (x.hum > 80 ? 4 : 0) + (x.temp >= 16 && x.temp <= 28 ? 3 : 0);
    x.pest = x.pest * .72 + (x.temp > 24 ? 10 : x.temp > 18 ? 6 : 2) + (!x.rain && x.hum < 62 ? 6 : 0) - (x.rain ? 8 : 0);
  } else { x.dis *= .6; x.pest *= .6; }
  x.dis = Math.round(clamp(x.dis, 0, 100)); x.pest = Math.round(clamp(x.pest, 0, 100));
}
const riskLevel = v => v >= RISK_HIGH ? '높음' : v >= 40 ? '보통' : '낮음';

// ----- 나무 작업 -----
function taskFor(i){
  const t = G.trees[i], w = G.week;
  if (!t) return TASKS.plant.ok(w) ? 'plant' : null;
  if (t.fr && w >= VARS[t.v].hv[0] && w <= VARS[t.v].hv[1]) return 'harvest';
  if (t.fr && !t.th && TASKS.thin.ok(w)) return 'thin';
  if (t.age >= 1 && !t.bl && TASKS.blossom.ok(w)) return 'blossom';
  if (!t.pr && TASKS.prune.ok(w) && (t.age >= 1 || w >= 49)) return 'prune';
  return null;
}
function newTree(v){ return {v, age:0, y2:1, pr:false, bl:false, th:false, fr:0, bx:0, bon:0, dmg:0, s:rint(1, 9999)}; }

// 작업 실행. who: 'me' | 'worker' | 'auto'
function doTask(i, who){
  const k = taskFor(i); if (!k) return null;
  if (who === 'me' && typeof sfx === 'function') sfx({plant:'plant', harvest:'pick', prune:'snip', thin:'snip', blossom:'snip'}[k] || 'snip');
  const t = G.trees[i];
  if (k === 'plant') {
    const v = unlocked(G.selVar) ? G.selVar : 'fuji';
    if (G.money < SAPLING) { if (who !== 'worker') toast('돈이 모자라서 묘목을 못 사요.', 'bad'); return null; }
    G.money -= SAPLING;
    G.trees[i] = newTree(v);
    G.planted[v] = 1;
    unlock('plant1');
    if (Object.keys(G.planted).length >= 5) unlock('allvar');
    if (G.trees.every(x => x)) unlock('orchard');
    return {k};
  }
  if (k === 'prune') t.pr = true;
  if (k === 'blossom') t.bl = true;
  if (k === 'thin') t.th = true;
  if (k === 'harvest') {
    let q = 38 + (t.pr ? 14 : 0) + (t.bl ? 10 : 0) + (t.th ? 14 : 0) + Math.min(3, G.nutri) * 4
          + t.bon - t.dmg + (t.age >= 3 ? 3 : 0) + (who === 'me' ? farmer().skill : Math.floor(farmer().skill / 2)) + rnd(-4, 4);
    q = Math.round(clamp(q, 5, 99));
    const g = gradeOf(q);
    let bx = t.bx; if (t.dmg > 20 && bx > 1) bx--;
    const key = t.v + '|' + g.k;
    G.stock[key] = (G.stock[key] || 0) + bx;
    G.stats.boxes += bx; G.stats.yearBoxes += bx;
    if (q > G.stats.bestQ) G.stats.bestQ = q;
    unlock('harvest1');
    if (g.k === 'S') unlock('gradeS');
    if (G.stats.boxes >= 100) unlock('box100');
    if (G.stats.boxes >= 500) unlock('box500');
    resetCycle(t);
    return {k, g, bx, q, v:t.v};
  }
  return {k};
}
function resetCycle(t){ t.fr = 0; t.bx = 0; t.pr = false; t.bl = false; t.th = false; t.bon = 0; t.dmg = 0; }

function pendingCount(k){
  let n = 0, tot = 0;
  for (let i = 0; i < G.trees.length; i++) {
    const t = G.trees[i], tk = taskFor(i);
    if (k === 'plant') { if (!t) { tot++; if (tk === 'plant') n++; } continue; }
    if (tk === k) n++;
    if (t && relevant(t, k)) tot++;
  }
  return {n, tot};
}
function relevant(t, k){
  const w = G.week;
  if (k === 'prune') return t.age >= 1 || w >= 49;
  if (k === 'blossom') return t.age >= 1;
  if (k === 'thin') return t.fr || t.th;
  if (k === 'harvest') return t.fr && w >= VARS[t.v].hv[0] && w <= VARS[t.v].hv[1];
  return false;
}
// 이번 주에 할 수 있는 작업 종류
function activeTasks(){
  const out = [];
  for (const k of ['harvest','thin','blossom','prune','plant']) {
    const c = pendingCount(k);
    if (k === 'harvest') { if (c.tot || c.n) out.push({k, ...c}); continue; }
    if (k === 'plant') { if (TASKS.plant.ok(G.week) && c.tot) out.push({k, ...c}); continue; }
    if (TASKS[k].ok(G.week) && c.tot) out.push({k, n:c.n, tot:c.tot});
  }
  return out;
}

// ----- 방제 -----
function sprayState(type){
  if (type === 'nutri') {
    const bearing = G.trees.some(t => t && t.age >= 1);
    if (!bearing) return {ok:false, why:'열매 맺는 나무가 아직 없어요.'};
    const mo = weekLabel(G.week).m; // 2026-10-13 5월·8월·10월에 한 번씩
    if (![5, 8, 10].includes(mo)) return {ok:false, why:'영양제는 5월·8월·10월에 한 번씩 줘요.'};
    if ((G.nutriM || []).includes(G.year * 100 + mo)) return {ok:false, why:`${mo}월 영양제는 벌써 줬어요.`};
    if (G.nutri >= 3) return {ok:false, why:'올해 영양제는 3번 다 줬어요.'};
    return {ok:true};
  }
  const v = G.wx[type];
  if (protectedFor(type)) return {ok:false, why:`아직 약 효과가 ${G.prot[type] - absDay() + 1}일 남았어요.`};
  if (v < RISK_HIGH) return {ok:false, why:`지금 ${type === 'dis' ? '병' : '해충'} 위험은 ${v}(${riskLevel(v)})예요. ${RISK_HIGH} 이상 "높음"일 때 해요.`};
  return {ok:true};
}
function applySpray(type, grade){
  const cost = sprayCost();
  G.money -= cost; G.stats.sprays++;
  if (type === 'nutri') { G.nutri++; (G.nutriM = G.nutriM || []).push(G.year * 100 + weekLabel(G.week).m); if (G.nutriM.length > 6) G.nutriM.shift(); return `영양제를 줬어요. 올해 ${G.nutri}/3번 (${won(cost)})`; }
  let days = {S:10, A:8, B:7, C:5}[grade] || 7, note = '';
  if (G.wx.wind >= 6 && !G.b.drone) { days -= 2; note = ' 바람이 세서 약이 좀 날아갔어요.'; }
  G.prot[type] = absDay() + days - 1;
  return `${type === 'dis' ? '살균제' : '살충제'}를 뿌렸어요. ${days}일 동안 지켜 줘요.${note} (${won(cost)})`;
}

// ----- 시간 흐름 -----
function advance(hours){
  G.hour += hours;
  workerTick(hours);
  while (G.hour >= 20) { G.hour -= 14; endDay(); }
}
let workerAcc = 0, workerLast = -1;
function workerTick(h){
  if (G.worker <= 0) return;
  workerAcc += h * 1.6 * (G.b.wondumak ? 1.25 : 1);
  while (workerAcc >= 1) {
    workerAcc -= 1;
    const i = nearestTask(workerLast >= 0 ? treePos(workerLast) : treePos(0), true);
    if (i < 0) { workerAcc = 0; return; }
    const r = doTask(i, 'worker');
    if (r) { workerLast = i; emit('workerDid', {i, r}); } else { workerAcc = 0; return; }
  }
}
function nearestTask(p, forWorker){
  let best = -1, bd = 1e18;
  for (let i = 0; i < G.trees.length; i++) {
    const k = taskFor(i); if (!k) continue;
    if (k === 'plant' && (forWorker ? G.money < SAPLING + 500000 : G.money < SAPLING)) continue;
    const q = treePos(i), d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function endDay(){
  const w = G.week, x = G.wx;
  if (w >= 14 && w <= 42) {
    let hit = 0;
    if (x.dis >= RISK_HIGH && !protectedFor('dis')) hit += 1.6;
    if (x.pest >= RISK_HIGH && !protectedFor('pest')) hit += 1.6;
    if (hit) G.trees.forEach(t => { if (t && t.age >= 1) t.dmg += hit; });
  }
  if (G.worker > 0) { G.worker--; if (!G.worker) { toast('인부 아저씨가 오늘 일을 마치고 돌아갔어요.'); workerLast = -1; } }
  G.day++;
  if (G.day >= 7) { G.day = 0; newWeek(); }
  genWeather();
  // 멧돼지·고라니 (4~11월)
  if (G.week >= 14 && G.week <= 46 && G.trees.some(t => t)) {
    if (Math.random() < .04 * (G.b.fence ? 1 / 3 : 1)) emit('raid', {kind: Math.random() < .5 ? 'boar' : 'deer'});
  }
  emit('day');
}

// 심은 다음 해(2년차)부터 조금씩 열리고 10년차까지 늘어요. 그 뒤로는 그대로 (다 자란 나무 1~3상자)
const treeYear = t => t.age + 1; // 심은 해 = 1년차
function yieldFactor(t){ return clamp(.2 + .8 * (treeYear(t) - 2) / 8, .2, 1); }
function treeBoxes(t){ const e = rnd(1, 3) * 2 * yieldFactor(t); // 2026-10-13 수확량 2배
  return Math.max(1, Math.floor(e) + (Math.random() < e % 1 ? 1 : 0)); }
function newWeek(){
  G.week++;
  if (G.week > 52) {
    G.week = 1; G.year++;
    G.trees.forEach(t => { if (t) t.age++; });
    G.nutri = 0; G.stats.yearBoxes = 0; G.stats.bestQ = 0;
    rollYearEvents();
    emit('newYear');
  }
  const w = G.week;
  // 열매 맺힘
  if (w === 18) {
    let n = 0;
    G.trees.forEach(t => {
      if (t && t.age >= 1 && !t.fr) { t.fr = 1; t.bx = treeBoxes(t); t.bon += (2 + hiveLv()) * hives(); n++; }
    });
    if (n) toast(`🍏 꽃이 지고 작은 사과가 열렸어요! (${n}그루)`, 'good');
  }
  // 수확 놓침
  G.trees.forEach(t => {
    if (t && t.fr && w === VARS[t.v].hv[1] + 1) { t.lost = 1; resetCycle(t); }
  });
  const lost = G.trees.filter(t => t && t.lost).length;
  if (lost) { G.trees.forEach(t => t && delete t.lost); toast(`😢 수확 시기를 놓쳐서 사과 ${lost}그루가 떨어졌어요.`, 'bad'); }
  // 재해
  if (G.ev.frost === w) {
    emit('wxfx', {k:'frost'});
    if (G.b.frostfan) emit('pop', {ic:'🌀', t:'늦서리!', m:'밤새 서리가 내렸지만 방상팬이 바람을 돌려서 꽃을 지켰어요.'});
    else { G.trees.forEach(t => { if (t && t.age >= 1) t.bon -= 8; }); emit('pop', {ic:'🥶', t:'늦서리!', m:'밤에 서리가 내려 꽃이 얼었어요. 올해 사과 품질이 조금 떨어져요. 방상팬이 있으면 막을 수 있어요.'}); }
  }
  if (G.ev.hail === w && G.trees.some(t => t && t.fr)) {
    emit('wxfx', {k:'hail'});
    if (G.b.hailnet) emit('pop', {ic:'🕸️', t:'우박!', m:'우박이 쏟아졌지만 우박망이 사과를 지켰어요.'});
    else {
      const rowsHit = new Set(); while (rowsHit.size < Math.ceil(G.rows / 2)) rowsHit.add(rint(0, G.rows - 1));
      G.trees.forEach((t, i) => { if (t && t.fr && rowsHit.has(Math.floor(i / PER_ROW))) t.bon -= 10; });
      emit('pop', {ic:'🧊', t:'우박!', m:`우박이 쏟아져서 ${rowsHit.size}줄 사과에 상처가 났어요. 우박망이 있으면 막을 수 있어요.`});
    }
  }
  if (G.ev.typhoon === w && G.trees.some(t => t && t.fr)) {
    emit('wxfx', {k:'typhoon'});
    let drop = 0; const p = G.b.hailnet ? .25 : .5;
    G.trees.forEach(t => { if (t && t.fr && Math.random() < p) { t.bx--; drop++; if (t.bx <= 0) resetCycle(t); } });
    emit('pop', {ic:'🌀', t:'태풍이 지나갔어요', m:`센 바람에 사과가 떨어져서 ${drop}상자쯤 줄었어요.${G.b.hailnet ? ' 우박망 덕분에 피해가 절반이었어요.' : ''}`});
  }
  // 주문
  G.orders = G.orders.filter(o => {
    if (o.due < w && o.year === G.year || o.year < G.year) { G.rep = Math.max(0, G.rep - 2); toast(`${o.name} 주문 날짜를 놓쳤어요. 평판 -2`, 'bad'); return false; }
    return true;
  });
  if (G.year >= 2 && w >= 30 && w <= 46 && G.orders.length < 2 && Math.random() < .4) makeOrder();
  // 품평회
  retailWeek();
  { const L = weekLabel(w); if ([5, 8, 10].includes(L.m) && L.wk === 1 && G.trees.some(t => t && t.age >= 1)) emit('pop', {ic:'🧪', t:`${L.m}월, 영양제 줄 때예요!`, m:'이번 달에 영양제를 한 번 줄 수 있어요. 방제 창에서 🧪 영양제를 고르세요. (5월·8월·10월에 한 번씩)'}); }
  if (hiveLv() >= 3 && hives() && w >= 18 && w <= 40) { const p = 20000 * hives(); G.money += p; addInc('apple', p); toast(`🍯 꿀벌통에서 꿀을 땄어요! +${won(p)}`, 'good'); }
  if (w === 50 && G.stats.bestQ > 0) emit('contest');
  emit('week');
}
function makeOrder(){
  const t = pick(ORDERS);
  const o = {id:G.oid++, name:t.name, ic:t.ic, g:t.g, n:rint(t.n[0], t.n[1]), price:Math.round(gByK(t.g).base * 10000 + t.bonus), rep:t.rep, due:Math.min(52, G.week + rint(3, 5)), year:G.year};
  G.orders.push(o);
  emit('pop', {ic:t.ic, t:'새 주문이 들어왔어요', m:`${o.name}: ${gByK(o.g).name} 등급 이상 ${o.n}상자, 상자당 ${won(o.price)}. ${o.due}주까지 창고에서 납품해 주세요.`});
}
function canDeliver(o){ return stockAtLeast(o.g) >= o.n; }
function stockAtLeast(gk){
  const ok = GRADES.slice(0, GRADES.findIndex(g => g.k === gk) + 1).map(g => g.k);
  let n = 0; for (const key in G.stock) if (ok.includes(key.split('|')[1])) n += G.stock[key];
  return n;
}
function takeBoxes(gk, n){ // 낮은 등급부터 꺼냄
  const order = GRADES.slice(0, GRADES.findIndex(g => g.k === gk) + 1).map(g => g.k).reverse();
  for (const gg of order) for (const key in G.stock) {
    if (n <= 0) break;
    if (key.split('|')[1] !== gg) continue;
    const m = Math.min(n, G.stock[key]); G.stock[key] -= m; n -= m;
    if (!G.stock[key]) delete G.stock[key];
  }
}
function deliver(o){
  if (!canDeliver(o)) return false;
  takeBoxes(o.g, o.n);
  G.money += o.price * o.n; addInc('apple', o.price * o.n); G.rep += o.rep;
  G.orders = G.orders.filter(x => x !== o);
  toast(`${o.ic} ${o.name} 납품 완료! +${won(o.price * o.n)}, 평판 +${o.rep}`, 'gold');
  return true;
}
function totalStock(){ let n = 0; for (const k in G.stock) n += G.stock[k]; return n; }

// 경매 가격
function auctionPlan(key){
  const [v, gk] = key.split('|');
  let base = gByK(gk).base * VARS[v].mult * (G.b.cold ? 1.1 : 1) * shedMult();
  const bids = BIDDERS.map(n => ({n, p:Math.round(clamp(base * rnd(.84, 1.07), 3, 10) * 10) / 10}));
  const big = Math.random() < .1;
  if (big) bids[rint(0, 9)] = {n:'큰손 상인', p:10, big:true};
  let win = 0; bids.forEach((b, i) => { if (b.p > bids[win].p) win = i; });
  return {bids, win, big, price:bids[win].p * 10000};
}
function sellLot(key, plan, cnt){
  const have = G.stock[key] || 0, n = Math.min(have, cnt == null ? have : cnt); if (!n) return 0;
  const total = Math.round(plan.price * n);
  G.money += total; addInc('apple', total); G.stats.sold += n; G.stock[key] = have - n; if (!G.stock[key]) delete G.stock[key];
  if (plan.big) unlock('bigbuyer');
  checkRich();
  return total;
}
function processLot(key){
  const gk = key.split('|')[1], n = G.stock[key] || 0;
  const unit = gk === 'C' ? 50000 : gk === 'B' ? 60000 : 0;
  if (!unit || !n || !G.b.factory) return 0;
  delete G.stock[key]; G.money += unit * n; addInc('apple', unit * n); checkRich();
  return unit * n;
}
function checkRich(){ if (G.money >= 100000000) unlock('rich'); }

function unlock(id){
  if (G.ach[id]) return;
  G.ach[id] = absDay();
  const a = ACH[id]; toast(`${a[0]} 업적: ${a[1]}!`, 'gold');
}

// 품평회
function runContest(){
  const mine = G.stats.bestQ;
  const rivals = Array.from({length:9}, () => rint(68, 96));
  const rank = 1 + rivals.filter(r => r > mine).length;
  const prize = [3000000, 1500000, 500000][rank - 1] || 0;
  const rep = [5, 3, 1][rank - 1] || 0;
  G.money += prize; G.rep += rep;
  if (rank === 1) unlock('contest');
  G.contest.push({year:G.year, rank, q:mine});
  return {mine, rank, prize, rep, rivals:rivals.sort((a, b) => b - a)};
}

const landStep = () => Math.max(0, Math.min(ROW_STEP, MAX_ROWS - G.rows)); // 2026-10-13 2줄씩
function expandLand(){
  const n = landStep(); if (!n || G.money < ROW_PRICE * n) return false;
  G.money -= ROW_PRICE * n; G.rows += n;
  for (let i = 0; i < PER_ROW * n; i++) G.trees.push(null);
  unlock('land');
  return true;
}

function serialize(){ return JSON.stringify(G); }
function deserialize(s){
  const g = JSON.parse(s);
  if (!g || g.v !== 2 || !Array.isArray(g.trees)) throw new Error('세이브 형식이 달라요');
  G = g; return g;
}
const SAVE_KEY = 'haru-orchard-v2';
function encodeSave(){ return 'APPLE2:' + btoa(unescape(encodeURIComponent(serialize()))); }
function decodeSave(code){
  code = code.trim();
  if (!code.startsWith('APPLE2:')) throw new Error('APPLE2: 로 시작하는 코드가 아니에요');
  return deserialize(decodeURIComponent(escape(atob(code.slice(7)))));
}

// ===== 셀화 그리기 도구 =====
const INK = '#2a1c17';
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// 모양 하나를 두 톤(바탕 + 아래오른쪽 그림자)으로 칠하고 외곽선
function cel(c, path, base, shade, sx = 4, sy = 4, lw = 3){
  c.save();
  c.beginPath(); path(c); c.fillStyle = shade; c.fill();
  c.clip();
  c.translate(-sx, -sy); c.beginPath(); path(c); c.fillStyle = base; c.fill();
  c.restore();
  if (lw) { c.beginPath(); path(c); c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
}
// 원 여러 개를 합친 덩어리 (바깥 외곽선만)
function celBlob(c, circles, base, shade, sx = 6, sy = 7, lw = 3){
  const path = cc => circles.forEach(([x, y, r]) => { cc.moveTo(x + r, y); cc.arc(x, y, r, 0, 7); });
  c.beginPath(); path(c); c.lineWidth = lw * 2; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke();
  cel(c, path, base, shade, sx, sy, 0);
}
function ell(c, x, y, rx, ry){ c.ellipse(x, y, rx, ry, 0, 0, 7); }
function rr(c, x, y, w, h, r){ c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function shadow(c, x, y, rx, ry, a = .22){ c.beginPath(); ell(c, x, y, rx, ry); c.fillStyle = `rgba(30,50,20,${a})`; c.fill(); }
function line(c, pts, w, col){ c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); }
function inkLine(c, pts, w, col){ line(c, pts, w + 3, INK); line(c, pts, w, col); }
function mix(a, b, t){
  const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function hl(c, x, y, rx, ry, a = .9){ c.beginPath(); c.ellipse(x, y, rx, ry, -.6, 0, 7); c.fillStyle = `rgba(255,255,255,${a})`; c.fill(); }

// ----- 계절 색 -----
const PAL = {
  spring:{g:'#9edb6a', g2:'#86c955', g3:'#b5e57f', leaf:'#7fd35a', leafS:'#4c9e3c', alley:'#c4e58a', track:'#a9cf70'},
  summer:{g:'#7fcb57', g2:'#69b646', g3:'#97d86c', leaf:'#4fb84a', leafS:'#2c7f37', alley:'#b2db78', track:'#96c463'},
  autumn:{g:'#b9cf63', g2:'#a2b94f', g3:'#cfdf7c', leaf:'#e0b43c', leafS:'#a8722a', alley:'#d8d68a', track:'#bdb86b'},
  winter:{g:'#eef4f7', g2:'#d5e3ec', g3:'#ffffff', leaf:'#7fae6a', leafS:'#4c7a45', alley:'#f6f9fb', track:'#d9e5ee'}
};

// ----- 사과나무 그림 (캐시) -----
const treeCache = new Map();
function treeLook(t){
  const w = G.week, s = seasonOf(w);
  const lp = w <= 21 ? PAL.spring : PAL.summer;
  const L = {s, age: Math.min(2, t.age + (t.y2 ? 1 : 0)), bare:false, bloom:false, leafC:lp.leaf, leafS:lp.leafS, ap:0, apR:0, apCol:null, dmg: t.dmg > 18 ? 2 : t.dmg > 8 ? 1 : 0};
  if (w <= 11 || w >= 49) L.bare = true;
  else if (w <= 13) { L.leafC = '#a6e27a'; L.leafS = '#6fb44f'; L.bud = true; }
  if (t.age >= 1 && w >= 15 && w <= 17) L.bloom = true;
  if (w >= 45 && w <= 48) { L.leafC = '#e6b33e'; L.leafS = '#b0742c'; }
  if (t.fr) {
    const V = VARS[t.v];
    const p = clamp((w - 18) / Math.max(1, V.hv[0] - 18), 0, 1);
    L.ap = t.th ? 7 : 13;
    L.apR = (t.th ? 4.2 : 3.4) + p * (t.th ? 3 : 1.6);
    const ramp = (a, m, b, u) => u < .45 ? mix(a, m, u / .45) : mix(m, b, (u - .45) / .55);
    L.apCol = t.v === 'aori' ? mix('#b6df5c', V.col, p) : ramp('#a9d651', '#f2c447', V.col, p);
    L.apSh = t.v === 'aori' ? V.sh : ramp('#6c9f2c', '#c48a22', V.sh, p);
    L.st = V.st && p > .6;
  }
  return L;
}
function treeSprite(t, hi){
  const L = treeLook(t);
  const key = [hi ? 3 : 1, L.age, L.bare, L.bloom, L.bud, L.leafC, L.ap, L.apR.toFixed(1), L.apCol, L.st, L.dmg, t.s % 5].join('|');
  let cv = treeCache.get(key);
  if (cv) return cv;
  if (treeCache.size > 400) treeCache.clear();
  const k = hi ? 3 : 1;
  cv = mk(170 * k, 240 * k);
  const c = cv.getContext('2d');
  c.scale(k, k); c.translate(85, 222);
  drawTree(c, L, srand(t.s % 5 + 7));
  treeCache.set(key, cv);
  return cv;
}
function drawTree(c, L, R){
  const sc = L.age === 0 ? .55 : L.age === 1 ? .78 : 1;
  shadow(c, 0, 2, 40 * sc + 6, 12 * sc + 3, .25);
  // 지주
  const ph = L.age === 0 ? 120 : 190;
  c.beginPath(); rr(c, 11, -ph, 5, ph + 2, 2); c.fillStyle = '#c9c2b6'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
  // 줄기
  const th = 70 * sc;
  cel(c, cc => { cc.moveTo(-7 * sc, 2); cc.quadraticCurveTo(-4 * sc, -th * .5, -3, -th); cc.lineTo(3, -th); cc.quadraticCurveTo(5 * sc, -th * .5, 7 * sc, 2); cc.closePath(); }, '#9a6440', '#6d4128', 3, 0, 2.5);
  if (L.age === 0 && L.bare) { inkLine(c, [0, -th, 0, -th - 40], 3, '#8a5a3a'); return; }
  if (L.bare) {
    // 겨울: 세장방추형 가지
    inkLine(c, [0, -th + 4, 0, -185 * sc], 5 * sc + 1, '#8a5a3a');
    for (let k = 0; k < 7; k++) {
      const y = -th - k * 17 * sc, len = (48 - k * 5.5) * sc, sd = k % 2 ? 1 : -1;
      inkLine(c, [0, y, sd * len * .6, y + 4, sd * len, y + 10], 3 * sc + .5, '#8a5a3a');

    c.beginPath(); c.arc(32 * s, -36 * s, 2.8, 0, 7); c.fillStyle = INK; c.fill();
    c.beginPath(); c.arc(31.3 * s, -37 * s, 1, 0, 7); c.fillStyle = '#fff'; c.fill();
    c.beginPath(); c.moveTo(40 * s, -24 * s); c.quadraticCurveTo(46 * s, -18 * s, 44 * s, -14 * s); c.lineWidth = 3; c.strokeStyle = '#fff8e8'; c.stroke();
    if (V && V.tier >= 2) line(c, [27 * s, -42 * s, 35 * s, -39 * s], 2.4, INK); // 화난 눈썹
    if (V && V.antler) for (const ax of [22, 28]) { line(c, [ax * s, -50 * s, (ax - 4) * s, -66 * s, (ax - 10) * s, -72 * s], 3, '#8a6a3a'); line(c, [(ax - 4) * s, -62 * s, (ax + 3) * s, -70 * s], 2.6, '#8a6a3a'); }

    c.restore(); return;
  }

    cel(c, cc => ell(cc, 0, -12, 13, 10), '#ffffff', '#dcd6e6', 3, 3, 2.4);

    [6, 12].forEach(ex => cel(c, cc => ell(cc, ex, -33, 3, 9), '#ffffff', '#ffc4d4', 1, 1, 2));

    c.beginPath(); c.arc(-13, -12, 4, 0, 7); c.fillStyle = '#fff'; c.fill(); c.lineWidth = 2; c.strokeStyle = INK; c.stroke();
  } else if (kind === 'chicken' || kind === 'chick') {
    const ck = kind === 'chick', s = ck ? .55 : 1, peck = Math.max(0, Math.sin(t * 4)) * (ck ? 3 : 6);

function blocked(x, y){
  if (x < WX0 + 40 || x > WX1 - 40 || y < WY0 + 120 || y > worldBot() - 40) return true;
  for (const r of solids()) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) return true;
  if (G.deco.pond && ((x - SPOT.pond.x) / 160) ** 2 + ((y - SPOT.pond.y) / 78) ** 2 < 1) return true;
  // 나무 줄기
  if (inOrchard(x, y)) {
    const r = Math.floor((y - OY) / ROW_H);
    if (r >= 0 && r < G.rows) {
      const ty = OY + r * ROW_H + STRIP / 2 + 6;
      if (Math.abs(y - ty) < 14) {
        const c2 = Math.round((x - OX - TREE_DX / 2) / TREE_DX);
        if (c2 >= 0 && c2 < PER_ROW && G.trees[r * PER_ROW + c2]) { const tx = OX + TREE_DX / 2 + c2 * TREE_DX; if (Math.abs(x - tx) < 16) return true; }
      }
    }
  }
  return false;
}
function moveBy(o, dx, dy){
  // 이미 막힌 자리(예: 발밑에 나무를 심음)면 빠져나갈 수 있게 그냥 움직임
  if (blocked(o.x, o.y)) { o.x += dx; o.y += dy; return true; }
  if (!blocked(o.x + dx, o.y + dy)) { o.x += dx; o.y += dy; return true; }
  if (dx && !blocked(o.x + dx, o.y)) { o.x += dx; return true; }
  if (dy && !blocked(o.x, o.y + dy)) { o.y += dy; return true; }
  return false;
}

function findTarget(){
  let best = null, bd = 95 * 95;
  const cands = [];
  for (let i = 0; i < G.trees.length; i++) { const p = treePos(i); cands.push({kind:'tree', i, x:p.x, y:p.y + 10}); }
  cands.push({kind:'grandma', x:SPOT.grandma.x, y:SPOT.grandma.y}, {kind:'chief', x:SPOT.chief.x, y:SPOT.chief.y},
             {kind:'shed', x:SPOT.shed.x, y:SPOT.shed.y + 10}, {kind:'hanok', x:SPOT.hanok.x, y:SPOT.hanok.y + 10}, {kind:'nongmak', x:SPOT.nongmak.x, y:SPOT.nongmak.y + 10});
  huntTargets(cands);
  for (const n of NPCS) cands.push({kind:'npc', n:n.i, x:n.x, y:n.y});
  for (const c of cands) {
    const d = (c.x - P.x) ** 2 + ((c.y - P.y) * 1.3) ** 2;
    const lim = c.kind === 'hanok' || c.kind === 'nongmak' || c.kind === 'rest' ? 150 * 150 : c.kind === 'tree' ? 70 * 70 : bd;

// ----- 동물·나비 -----
function syncCritters(){
  const want = [];
  if (G.deco.rabbit) want.push('rabbit', 'rabbit');
  if (G.deco.chicken) want.push('chicken', 'chick', 'chick', 'chick');
  if (G.deco.pond) want.push('duck', 'duck', 'duck');
  if (G.deco.cat) want.push('cat');
  if (G.deco.dog) want.push('dog');
  const sig = want.join();
  if (critters.sig === sig) return;
  critters.length = 0; critters.sig = sig;
  want.forEach((k, i) => {
    const a = k === 'rabbit' ? SPOT.rabbit : k === 'duck' ? SPOT.pond : k === 'cat' ? SPOT.cat : k === 'dog' ? SPOT.dog : SPOT.chicken;
    critters.push({k, ax:a.x, ay:a.y, x:a.x + rnd(-40, 40), y:a.y + rnd(-20, 20), tx:a.x, ty:a.y, t:rnd(0, 9), ph:i, flip:false});
  });
}
function updateCritters(dt){
  for (const c of critters) {
    c.t += dt;
    if (c.k === 'duck') { const a = c.t * .25 + c.ph * 2.1; const nx = c.ax + Math.cos(a) * 100, ny = c.ay + Math.sin(a) * 40; c.flip = nx < c.x; c.x = nx; c.y = ny; continue; }
    if (c.k === 'cat') continue;
    const range = c.k === 'rabbit' ? 160 : c.k === 'dog' ? 120 : 70;
    if (Math.hypot(c.tx - c.x, c.ty - c.y) < 4 || Math.random() < dt * .1) { c.tx = c.ax + rnd(-range, range); c.ty = c.ay + rnd(-range * .4, range * .4); }
    const sp = c.k === 'rabbit' ? 60 : c.k === 'dog' ? 55 : 18;
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy) || 1;
    if (d > 3) { c.x += dx / d * sp * dt; c.y += dy / d * sp * dt; c.flip = dx < 0; }
  }
}

function render(ctx, dt, T){

  ctx.setTransform(z, 0, 0, z, -vx * z + shx, -vy * z + shy);
  ctx.imageSmoothingEnabled = true;
  for (let ty = Math.floor(vy / TILE); ty <= Math.floor((vy + vh) / TILE); ty++)
    for (let tx = Math.floor(vx / TILE); tx <= Math.floor((vx + vw) / TILE); tx++)

  const vis = (x, y, m = 260) => x > vx - m && x < vx + vw + m && y > vy - m && y < vy + vh + m + 200;

  // 땅 위 표시: 빈 자리, 살 수 있는 땅, 철선

  }

    const t = G.trees[i]; if (!t) continue;

    add(p.y, () => ctx.drawImage(sp, p.x - 85, p.y - 222));
  }
  // 줄 끝 큰 기둥
  for (let r = 0; r < G.rows; r++) {
    const y = OY + r * ROW_H + STRIP / 2 + 6;
    for (const x of [OX - 16, OX + ORCH_W + 16]) if (vis(x, y)) add(y, () => cel(ctx, cc => rr(cc, x - 6, y - 160, 12, 162, 3), '#d4cec4', '#a8a092', 3, 0, 2.4));
  }

      ctx.beginPath(); rr(ctx, bx - tw / 2, by - 22, tw, 40, 14); ctx.fillStyle = '#fffaf1'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); rr(ctx, bx - tw / 2 + 6, by - 16, 28, 28, 7); ctx.fillStyle = '#ffd25e'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.fillText('F', bx - tw / 2 + 20, by + 6);

function drawFlowerBed(c, x, y){

  c.beginPath(); ell(c, 0, 0, 80, 26); c.fillStyle = '#8a5a3a'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = INK; c.stroke();

    const col = ['#ff6b8a', '#ffd23a', '#ffffff', '#b98cff'][k % 4];
    cel(c, cc => { for (let p = 0; p < 5; p++) { const a = p * 1.256; cc.moveTo(fx + Math.cos(a) * 5 + 4, fy - 12 + Math.sin(a) * 5); cc.arc(fx + Math.cos(a) * 5, fy - 12 + Math.sin(a) * 5, 4, 0, 7); } }, col, mix(col, '#000', .2), 1, 1, 1.4);

// 하늘·날씨·시간대 효과 (화면 좌표)
const drops = Array.from({length:180}, () => ({x:rnd(0, W), y:rnd(0, H), s:rnd(.6, 1.2)}));
const clouds = Array.from({length:5}, (_, i) => ({x:rnd(0, 3000), y:rnd(400, 3200), r:rnd(220, 380)}));
const petals = Array.from({length:40}, () => ({x:rnd(0, W), y:rnd(0, H), t:rnd(0, 9)}));
function drawSkyFx(ctx, dt, T){
  const x = G.wx, w = G.week, S = seasonOf(w);
  // 구름 그림자 (월드 좌표를 화면으로)
  for (const c of clouds) {
    c.x += dt * 22; if (c.x > WORLD_W + 500) c.x = -500;
    const sx = (c.x - cam.x) * cam.z + W / 2, sy = (c.y - cam.y) * cam.z + H / 2;
    if (sx < -600 || sx > W + 600 || sy < -600 || sy > H + 600) continue;
    ctx.beginPath(); ctx.ellipse(sx, sy, c.r * cam.z, c.r * .45 * cam.z, 0, 0, 7); ctx.fillStyle = 'rgba(40,60,90,.07)'; ctx.fill();
  }
  // 꽃잎·낙엽
  if ((w >= 15 && w <= 18) || (w >= 44 && w <= 48)) {
    const spring = w <= 18;
    for (const p of petals) {
      p.t += dt; p.y += dt * 40; p.x += Math.sin(p.t * 1.6) * dt * 40 + dt * 18;
      if (p.y > H + 10) { p.y = -10; p.x = rnd(0, W); }
      if (p.x > W + 10) p.x = -10;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.t);
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0, 0, 7); ctx.fillStyle = spring ? '#ffd8e6' : '#f0a43a'; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = spring ? '#e89ab4' : '#b46a22'; ctx.stroke();
      ctx.restore();
    }
  }
  if (x.sky === 'rain' || x.sky === 'snow') {
    ctx.fillStyle = 'rgba(60,80,110,.16)'; ctx.fillRect(0, 0, W, H);
    const snow = x.sky === 'snow';
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const d of drops) {
      if (snow) { d.y += dt * 90 * d.s; d.x += Math.sin(T + d.s * 9) * dt * 20; ctx.beginPath(); ctx.arc(d.x, d.y, 3.2 * d.s, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
      else { d.y += dt * 900 * d.s; d.x -= dt * 120; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + 6, d.y - 22 * d.s); ctx.stroke(); }
      if (d.y > H) { d.y = -20; d.x = rnd(0, W + 200); }
      if (d.x < -20) d.x = W + 10;
    }
  } else if (x.sky === 'cloud') { ctx.fillStyle = 'rgba(80,100,130,.07)'; ctx.fillRect(0, 0, W, H); }
  // 아침·저녁 빛: 화면을 어둡게 했다가 다음 날 확 밝아지면 눈이 피로하므로
  // 아침 6시와 저녁 8시가 같은 은은한 노을빛이 되도록 이어지게 함 (깜빡임 없음)
  const h = G.hour;
  let a = 0;
  if (h < 8) a = (8 - h) / 2 * .1;
  else if (h > 17) a = Math.min(1, (h - 17) / 3) * .1;
  if (a > 0) { ctx.fillStyle = `rgba(255,160,90,${a})`; ctx.fillRect(0, 0, W, H); }
}

function updateVillagers(dt){
  if (!UI.free()) return;
  for (const n of NPCS) {
    const pd = Math.hypot(P.x - n.x, P.y - n.y);
    if (n.still || pd < 90) {
      n.walk = 0;
      if (pd < 260) n.dir = Math.abs(P.x - n.x) > Math.abs(P.y - n.y) * 1.2 ? (P.x < n.x ? 2 : 3) : (P.y < n.y ? 1 : 0);
      continue;
    }
    if (n.wait > 0) { n.wait -= dt; n.walk = 0; continue; }
    const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
    if (d < 5) { n.wait = rnd(1.2, 4.5); n.tx = n.hx + rnd(-n.r[0], n.r[0]); n.ty = n.hy + rnd(-n.r[1], n.r[1]); continue; }
    const s = Math.min(d, n.sp * dt);
    if (!moveBy(n, dx / d * s, dy / d * s)) { n.tx = n.hx; n.ty = n.hy; n.wait = .8; continue; }
    n.walk += dt * n.sp / 22;
    n.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0);
  }
}

function huntDrop(tier){ ensureGear(); G.gear.stones = (G.gear.stones || 0) + 1; return `💎 강화석 1개를 얻었어요!`; }
function raidRowPenalty(m){

function updateMon(m, dt){
  m.t += dt;
  if (m.dead) { m.deadT += dt; return; }
  if (m.hitT > 0) m.hitT -= dt;
  if (m.flash > 0) m.flash -= dt;
  if (m.kb) { m.x += m.kb.x * dt; m.y += m.kb.y * dt; m.kb.t -= dt; if (m.kb.t <= 0) m.kb = null; }
  if (m.stun > 0) { m.stun -= dt; return; }
  const pd = Math.hypot(P.x - m.x, P.y - m.y), boar = !!CHARGER[m.kind], tig = m.kind === 'tiger', sp = m.V.spd;
  if (m.warnT > 0) m.warnT -= dt;
  m.cc -= dt * (P.hp < P.max * .3 ? .5 : 1); // 우주가 힘들면 덜 덤벼요
  const ox = m.x, oy = m.y;
  const moveTo = (tx, ty, s) => { const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy) || 1; const st = Math.min(d, s * dt); m.x += dx / d * st; m.y += dy / d * st; if (Math.abs(dx) > 4) m.flip = dx < 0; return d; };
  const canSee = tig ? inDen(P.x, P.y, 60) : (m.raid || inHunt(P.x, P.y));
  // 2026-10-13 ★1·★2(tier 0·1)는 비선공: 먼저 때려야(m.eng) 덤벼요
  if ((m.st === 'wander' || m.st === 'raid' || m.st === 'eat') && canSee && (m.raid || tig || m.tier >= 2 || m.eng) && (tig || pd < (m.raid ? 430 : 360))) { m.st = 'chase'; m.eng = true; m.eat = 0; }
  if (m.st === 'wander') {
    if (m.wait > 0) m.wait -= dt;
    else if (moveTo(m.tx, m.ty, 60 * sp) < 6) { m.wait = rnd(1, 4); m.tx = m.hx + rnd(-260, 260); m.ty = m.hy + rnd(-160, 160); }
    if (m.hp < m.max) m.hp = Math.min(m.max, m.hp + dt * (tig ? m.max * .04 : 4)); // 호랑이는 굴로 돌아가면 빨리 회복
  } else if (m.st === 'raid') {
    const p = treePos(m.tgt);
    if (moveTo(p.x + (m.from.x < p.x ? -64 : 64), p.y + 46, 170 * sp) < 8) { m.st = 'eat'; m.eat = 0; m.flip = m.x > p.x; }
  } else if (m.st === 'eat') {
    m.eat += dt;
    if (m.eat > 2.5) {
      m.bites++; m.eat = 0; floats.push({x:m.x, y:m.y - 120, s:`🍎 아삭! (${m.bites}/3)`, t:1.2, c:'#d6372c'});
      if (m.bites >= 3) { m.st = 'leave'; raidRowPenalty(m); }
    }
  } else if (m.st === 'leave') {
    moveTo(m.from.x < OX ? HOME.x0 - 600 : HOME.x1 + 600, m.from.y, 260 * sp);
    if (Math.hypot(m.x - m.from.x, m.y - m.from.y) > 1300) { m.dead = true; m.deadT = 2; }
  } else if (m.st === 'chase') {
    const far = tig ? !inDen(P.x, P.y, 60) : m.raid ? pd > 900 : (pd > 750 || Math.hypot(m.x - m.hx, m.y - m.hy) > 1500 || !inHunt(P.x, P.y));
    if (far) { m.eng = false; m.st = m.raid ? (m.bites >= 3 ? 'leave' : 'raid') : 'wander'; m.tx = m.hx; m.ty = m.hy; }
    else if (boar && pd < 330 && pd > (tig ? 170 : 0) && m.cc <= 0) { m.st = 'wind'; m.tm = tig ? .7 : .6; m.flip = P.x < m.x; if (tig) sfx('roar'); }
    else if ((!boar || tig) && pd < (tig ? 170 : 125) && m.cc <= 0) { m.st = 'kick'; m.tm = tig ? .45 : .35; m.flip = P.x < m.x; }
    else if (pd > (tig ? 140 : 105)) moveTo(P.x, P.y, (CHASE_SP[m.kind] || 170) * sp);
    else m.flip = P.x < m.x;
  } else if (m.st === 'wind') {
    m.tm -= dt; if (m.tm <= 0) { m.st = 'charge'; m.tm = .55; const d = pd || 1; m.cv = {x:(P.x - m.x) / d * 620 * sp, y:(P.y - m.y) / d * 620 * sp}; }
  } else if (m.st === 'charge') {
    m.tm -= dt; m.x += m.cv.x * dt; m.y += m.cv.y * dt; if (Math.abs(m.cv.x) > 10) m.flip = m.cv.x < 0;

  } else if (m.st === 'kick') {

  } else if (m.st === 'hop') {

  // 이제 호랑이는 굴 밖 DEN_LEASH까지 쫓아오고, 다른 짐승은 굴 가장자리 안쪽까지 들어와요(둘이 겹쳐서 빈틈 없음).

  if (!m.raid && (!inHunt(m.x, m.y) || restAt(m.x, m.y, 120) || (tig ? !inDen(m.x, m.y, 60) : inDen(m.x, m.y, -120)))) { if (tig && !inDen(m.x, m.y, 60)) { const d = Math.hypot(DEN.x - m.x, DEN.y - m.y) || 1; m.x = ox + (DEN.x - ox) / d * 6; m.y = oy + (DEN.y - oy) / d * 6; m.st = 'wander'; m.tx = m.hx; m.ty = m.hy; m.eng = false; } else { m.x = ox; m.y = oy; if (m.st === 'wander') { m.tx = m.hx; m.ty = m.hy; } } }
  m.x = clamp(m.x, WX0 + 60, WX1 - 60); m.y = clamp(m.y, WY0 + 160, WY1 - 30);
}

}

function hasWork(){
  if (MONS.some(m => m.raid && !m.dead && m.st !== 'leave')) return true;
  for (let i = 0; i < G.trees.length; i++) { const k = taskFor(i); if (k && (k !== 'plant' || G.money >= SAPLING)) return true; }
  if (['dis', 'pest'].some(k => sprayState(k).ok)) return true;
  if (G.orders.some(o => canDeliver(o))) return true;
  if (G.errand && totalStock() >= G.errand.need) return true;
  return false;
}

// ----- 호랑이 굴 그림: 어두운 돌바닥 + 바위 벽 + 횃불 + 동굴 입구 -----
function drawDenGround(c, x0, y0, w, h){
  if (DEN.x + DEN.rx + 200 < x0 || DEN.x - DEN.rx - 200 > x0 + w || DEN.y + DEN.ry + 200 < y0 || DEN.y - DEN.ry - 200 > y0 + h) return;
  c.save();
  c.beginPath(); ell(c, DEN.x, DEN.y, DEN.rx + 120, DEN.ry + 100); c.fillStyle = '#2f3a2a'; c.fill();
  c.beginPath(); ell(c, DEN.x, DEN.y, DEN.rx, DEN.ry); c.fillStyle = '#4a423a'; c.fill();
  c.beginPath(); ell(c, DEN.x, DEN.y + 30, DEN.rx * .7, DEN.ry * .62); c.fillStyle = '#5a5046'; c.fill();
  const R = srand(9191);
  for (let k = 0; k < 90; k++) { const a = R() * 6.283, d = Math.sqrt(R()) * .95; const x = DEN.x + Math.cos(a) * DEN.rx * d, y = DEN.y + Math.sin(a) * DEN.ry * d;
    c.beginPath(); ell(c, x, y, 14 + R() * 30, 6 + R() * 10); c.fillStyle = R() < .5 ? '#3c352e' : '#665b50'; c.fill(); }
  c.strokeStyle = '#2a2420'; c.lineWidth = 3; c.lineCap = 'round';
  for (let k = 0; k < 26; k++) { let x = DEN.x + (R() - .5) * DEN.rx * 1.6, y = DEN.y + (R() - .5) * DEN.ry * 1.6; if (!inDen(x, y, -40)) continue;
    c.beginPath(); c.moveTo(x, y); for (let j = 0; j < 4; j++) { x += (R() - .5) * 70; y += (R() - .5) * 40; c.lineTo(x, y); } c.stroke(); }
  // 큰 발자국
  c.fillStyle = 'rgba(30,24,20,.55)';
  for (let k = 0; k < 7; k++) { const x = DEN.x + 120 + k * 70, y = DEN.y + 160 + (k % 2) * 40 + k * 28; c.beginPath(); ell(c, x, y, 16, 12); c.fill(); for (let j = -1; j <= 2; j++) { c.beginPath(); ell(c, x - 14 + j * 9, y - 16, 5, 6); c.fill(); } }
  c.restore();
}
function denEntities(ctx, add, vis, T){

  const cx = DEN.x, cy = DEN.y - DEN.ry + 40;
  if (vis(cx, cy, 400)) add(cy, () => drawCave(ctx, cx, cy));
  // 바위 벽 (숲길 쪽은 비워 둬요)
  const R = srand(5150);
  for (let k = 0; k < 46; k++) {
    const a = k / 46 * 6.283; let da = Math.abs(a - DEN_GATE); da = Math.min(da, 6.283 - da);

      d.y += d.v * dt; d.x += d.v * .55 * dt * (d.leaf ? 1.4 : 1); d.r += dt * 8;
      if (d.y > H + 60 || d.x > W + 220) { d.y = rnd(-120, -20); d.x = rnd(-400, W); }
      if (!d.leaf) { c.moveTo(d.x, d.y); c.lineTo(d.x - d.l * .55, d.y - d.l); }
    }
    c.stroke();
    for (const d of f.p) if (d.leaf) { c.save(); c.translate(d.x, d.y); c.rotate(d.r); c.fillStyle = `rgba(90,150,60,${.9 * e})`; c.beginPath(); c.ellipse(0, 0, 10, 5, 0, 0, 7); c.fill(); c.restore(); }
    // 번개
    f.nextBolt -= dt;
    if (f.nextBolt <= 0 && f.t < f.dur - 1.5) { f.bolt = .35; f.bx = rnd(W * .15, W * .85); f.seed = Math.random() * 1000; f.nextBolt = rnd(1.4, 2.4); sfx('thunder'); FX.shake = Math.max(FX.shake, .7); }
    if (f.bolt > 0) {
      f.bolt -= dt; const a = Math.max(0, f.bolt / .35);
      c.fillStyle = `rgba(255,255,240,${.55 * a})`; c.fillRect(0, 0, W, H);
      c.strokeStyle = `rgba(255,255,210,${a})`; c.lineWidth = 6; c.shadowColor = '#fff6a0'; c.shadowBlur = 30; c.beginPath();
      let x = f.bx, y = 0, s = f.seed; c.moveTo(x, y);
      while (y < H * .7) { s = (s * 9301 + 49297) % 233280; x += (s / 233280 - .5) * 120; y += 50 + (s % 40); c.lineTo(x, y); }
      c.stroke(); c.shadowBlur = 0;
    }
  } else if (f.k === 'hail') {
    c.fillStyle = `rgba(60,70,90,${.38 * e})`; c.fillRect(0, 0, W, H);
    while (f.p.length < 170) f.p.push({x:rnd(0, W), y:rnd(-H, 0), v:rnd(900, 1300), vx:rnd(-60, 60), r:rnd(4, 9), b:0, gy:rnd(H * .45, H - 20)});
    for (const d of f.p) {
      d.v += 1800 * dt * (d.b ? 1 : 0); d.y += d.v * dt; d.x += d.vx * dt;
      if (!d.b && d.y > d.gy) { d.b = 1; d.v = -rnd(250, 420); d.vx = rnd(-160, 160); }
      else if (d.b && d.y > d.gy + 8) { d.y = rnd(-200, -10); d.x = rnd(0, W); d.v = rnd(900, 1300); d.vx = rnd(-60, 60); d.b = 0; d.gy = rnd(H * .45, H - 20); }
      c.beginPath(); c.arc(d.x, d.y, d.r, 0, 7); c.fillStyle = `rgba(245,250,255,${.95 * e})`; c.fill();
      c.lineWidth = 2; c.strokeStyle = `rgba(150,180,215,${.9 * e})`; c.stroke();
      c.beginPath(); c.arc(d.x - d.r * .35, d.y - d.r * .35, d.r * .3, 0, 7); c.fillStyle = `rgba(255,255,255,${e})`; c.fill();
    }
    if (Math.random() < dt * 6) FX.shake = Math.max(FX.shake, .25);
  } else {
    // 늦서리: 가장자리부터 얼어붙는 서리
    const g = c.createRadialGradient(W / 2, H / 2, H * (.62 - .25 * e), W / 2, H / 2, H * 1.05);
    g.addColorStop(0, 'rgba(180,220,255,0)'); g.addColorStop(1, `rgba(200,235,255,${.85 * e})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = `rgba(120,170,230,${.16 * e})`; c.fillRect(0, 0, W, H);
    if (!f.p.length) for (let i = 0; i < 46; i++) { const side = i % 4, u = Math.random(); f.p.push({x:side === 0 ? u * W : side === 1 ? W : side === 2 ? u * W : 0, y:side === 0 ? 0 : side === 1 ? u * H : side === 2 ? H : u * H, s:rnd(30, 80), r:rnd(0, 3)}); }
    c.strokeStyle = `rgba(255,255,255,${.9 * e})`; c.lineCap = 'round';
    for (const d of f.p) {
      const s = d.s * Math.min(1, f.t / 1.5); c.save(); c.translate(d.x, d.y); c.rotate(d.r + f.t * .1); c.lineWidth = 3;
      for (let k = 0; k < 6; k++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(0, 0); c.lineTo(s, 0); c.moveTo(s * .55, 0); c.lineTo(s * .75, s * .18); c.moveTo(s * .55, 0); c.lineTo(s * .75, -s * .18); c.stroke(); }
      c.restore();
    }
    for (let i = 0; i < 30; i++) { const x = (i * 263 + f.t * 40) % W, y = (i * 151 + f.t * 25) % H; c.fillStyle = `rgba(255,255,255,${(.4 + .4 * Math.sin(f.t * 5 + i)) * e})`; c.fillRect(x, y, 3, 3); }
  }
  // 큰 경보 글씨
  const ta = Math.min(1, f.t / .3) * Math.max(0, Math.min(1, (3 - f.t) / .6));
  if (ta > 0) {
    const sc = 1 + Math.max(0, .3 - f.t) * 2;
    c.save(); c.translate(W / 2 + (f.k === 'typhoon' ? Math.sin(f.t * 30) * 4 : 0), H * .4); c.scale(sc, sc); c.globalAlpha = ta;
    c.font = '96px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 14; c.strokeStyle = f.k === 'frost' ? '#1d4f8a' : '#2a1a10'; c.strokeText(WX_TITLE[f.k], 0, 0);
    c.fillStyle = f.k === 'typhoon' ? '#ffd23a' : f.k === 'hail' ? '#e9f6ff' : '#bfe6ff'; c.fillText(WX_TITLE[f.k], 0, 0);
    c.restore(); c.globalAlpha = 1;
  }
}

const UI = {
  modal:null, queue:[], busy:false,
  free(){ return !this.modal && !MINI.on && !this.busy; },
  open(o){
    const wrap = $('#modalWrap');
    wrap.innerHTML = `<div class="modal card" role="dialog" aria-modal="true" style="${o.w ? 'width:' + o.w + 'px' : ''}">
      <div class="mh" style="${o.hc ? 'background:' + o.hc : ''}"><span style="font-size:40px">${o.ic || ''}</span><h2>${esc(o.title)}</h2>${o.noX ? '' : '<button class="x" aria-label="닫기">✕</button>'}</div>
      <div class="mb"></div>${o.foot === false ? '' : '<div class="mf"></div>'}</div>`;
    wrap.classList.add('on');
    this.modal = o;
    const el = wrap.firstElementChild;
    o.el = el; o.body = el.querySelector('.mb'); o.footEl = el.querySelector('.mf');
    const x = el.querySelector('.x'); if (x) x.onclick = () => this.close();
    if (o.render) o.render(o);

  close(){

    if (o.onClose) o.onClose();
    setTimeout(() => this.next(), 120);
  },
  push(fn){ this.queue.push(fn); this.next(); },
  next(){ if (this.free() && this.queue.length) this.queue.shift()(); }
};

function showToast(msg, kind){

}

function seasonKo(){ return {spring:'봄', summer:'여름', autumn:'가을', winter:'겨울'}[seasonOf(G.week)]; }
let todoSig = '';
function renderTodo(needSpray){
  const items = [];
  for (const a of activeTasks()) {
    const T = TASKS[a.k];
    if (a.k === 'harvest') {
      const byV = {};
      G.trees.forEach((t, i) => { if (taskFor(i) === 'harvest') byV[t.v] = (byV[t.v] || 0) + 1; });
      for (const v in byV) items.push({ic:'🍎', t:`${VARS[v].name} 따기 (${VARS[v].hv[1]}주까지)`, n:`${byV[v]}그루`, hot:VARS[v].hv[1] - G.week <= 0, go:'harvest'});
      continue;
    }
    items.push({ic:T.ic, t:T.name, n:a.n ? `${a.n}그루 남음` : '끝!', done:!a.n, go:a.k});
  }
  if (needSpray) items.push({ic:'💧', t:`방제하기 (${G.wx.dis >= RISK_HIGH && !protectedFor('dis') ? '병' : '해충'} 위험 높음)`, n:won(sprayCost()), hot:true, ui:'spray'});
  if (sprayState('nutri').ok) items.push({ic:'🧪', t:`영양제 주기 (${G.nutri}/3)`, n:won(sprayCost()), ui:'spray'});
  const st = totalStock();
  if (st) items.push({ic:'📦', t:'창고 사과 경매로 팔기', n:`${st}상자`, ui:'store'});
  for (const o of G.orders) items.push({ic:o.ic, t:`${o.name} ${gByK(o.g).name}↑ ${o.n}상자`, n:`${o.due}주까지`, hot:canDeliver(o), ui:'store'});
  for (const o of (G.retail || [])) items.push({ic:'🛍️', t:`소매 ${o.name} ${o.n}상자 포장`, n:`${o.due}주까지`, hot:stockAtLeast(o.g) >= o.n, ui:'retail'});
  if (G.errand) items.push({ic:'👴', t:`이장님 부탁: 사과 ${G.errand.need}상자`, n:totalStock() >= G.errand.need ? '갖다 드리기' : '사과 필요', go:'chief'});
  if (quizReady('grandma')) items.push({ic:'👵', t:'순자 할머니 사과 퀴즈', n:'지금 가능', go:'grandma'});
  if (quizReady('chief')) items.push({ic:'👴', t:'이장님 사과 퀴즈', n:'지금 가능', go:'chief'});
  const upcoming = VAR_KEYS.filter(v => G.trees.some(t => t && t.v === v && t.fr) && G.week < VARS[v].hv[0]);
  for (const v of upcoming) items.push({ic:'⏳', t:`${VARS[v].name} 수확은 ${VARS[v].hv[0]}주부터`, n:`${VARS[v].hv[0] - G.week}주 뒤`, done:true});
  huntTodo(items);
  if (G.worker > 0) items.push({ic:'👷', t:'인부 아저씨 일하는 중', n:`${G.worker}일`, done:true});
  if (!items.filter(i => !i.done).length) items.push({ic:'☕', t:'급한 일은 없어요. 농막에서 자면 다음 할 일까지 시간이 가요.', n:'', done:true});
  const sig = JSON.stringify(items);
  if (sig === todoSig) return; todoSig = sig;
  const ul = $('#todoL'); ul.innerHTML = '';
  items.forEach(it => {
    const li = document.createElement('li'); li.className = (it.hot ? 'hot ' : '') + (it.done ? 'done' : '');
    li.innerHTML = `<span class="ic">${it.ic}</span><span>${esc(it.t)}</span><span class="n">${esc(it.n)}</span>`;
    li.onclick = () => { if (it.ui) openUI(it.ui); else if (it.go) goTo(it.go); };
    ul.appendChild(li);
  });
}
function goTo(what){
  if (what === 'raid') { const m = MONS.find(m => m.raid && !m.dead); if (m) { P.tgt = {x:m.x, y:m.y}; P.pendMon = m; } return; }
  if (what === 'shop') { const n = NPCS.find(n => n.buyer); if (n) { P.tgt = {x:n.x + 55, y:n.y + 20}; P.pend = {kind:'npc', n:n.i, x:n.x + 55, y:n.y + 20}; } return; }
  if (what === 'chief' || what === 'grandma') { P.tgt = {x:SPOT[what].x + 50, y:SPOT[what].y + 30}; return; }
  const i = nearestOf(what);
  if (i >= 0) { const p = treePos(i); P.tgt = {x:p.x, y:p.y + 50}; }
}
function nearestOf(k){
  let b = -1, bd = 1e18;
  for (let i = 0; i < G.trees.length; i++) { if (taskFor(i) !== k) continue; const p = treePos(i), d = (p.x - P.x) ** 2 + (p.y - P.y) ** 2; if (d < bd) { bd = d; b = i; } }
  return b;
}

function autoSpray(k){
  if (G.money < sprayCost()) return;
  UI.busy = true;
  const cx = OX + ORCH_W / 2, cy = OY + G.rows * ROW_H / 2;
  ssAnim = {x:SPOT.shed.x, y:SPOT.shed.y + 30, sx:SPOT.shed.x, sy:SPOT.shed.y + 30, cx, cy, rx:ORCH_W / 2 + 140, ry:G.rows * ROW_H / 2 + 110, h:0, t:0, rings:[], ringT:0, k};
  sfx('spray');
}
function updateSS(dt){
  if (!ssAnim) return;
  const s = ssAnim; s.t += dt / 5;
  const ease = u => u * u * (3 - 2 * u);
  if (s.t < .16) { const u = ease(s.t / .16); s.x = s.sx + (s.cx - s.sx) * u; s.y = s.sy + (s.cy - s.sy) * u; s.h = 40 + u * 160; }
  else if (s.t < .86) {
    s.x = s.cx + Math.sin(s.t * 20) * 6; s.y = s.cy; s.h = 200 + Math.sin(s.t * 14) * 8;
    // 약 안개: 드론 아래에서 사방으로 퍼져요
    for (let q = 0; q < 6; q++) { const a = rnd(0, 6.283), sp = rnd(.45, 1); mist.push({x:s.x + rnd(-20, 20), y:s.y + rnd(-10, 10), r:rnd(18, 34), a:.42, vx:Math.cos(a) * s.rx * 1.25 * sp, vy:Math.sin(a) * s.ry * 1.25 * sp}); }
    s.ringT -= dt; if (s.ringT <= 0) { s.ringT = .45; s.rings.push(0); sfx('spray'); }
  } else { const u = ease((s.t - .86) / .14); s.x = s.cx + (s.sx - s.cx) * u; s.y = s.cy + (s.sy - s.cy) * u; s.h = 200 - u * 160; }
  for (let i = 0; i < s.rings.length; i++) s.rings[i] += dt / 1.6;
  s.rings = s.rings.filter(r => r < 1);
  if (mist.length > 700) mist.splice(0, mist.length - 700);
  cam.x += (s.x - cam.x) * .08; cam.y += (s.y - 120 - cam.y) * .08;
  if (s.t >= 1) {
    const msg = applySpray(s.k, 'B');
    ssAnim = null; UI.busy = false; toast('💧 ' + msg, 'good');
    UI.next();
  }
}

function talk(who, html, foot){

    const ok = $('#tOk'); if (ok) ok.onclick = () => UI.close();
  }});

function weekId(){ return absDay() - G.day; }
// 사과 퀴즈: 순자 할머니(G.quizDay)·이장님(G.quizDayC) 각각 한 주에 한 문제
const QZ = {grandma:{k:'quizDay', name:'김순자 할머니', ask:n => `${jo(n, '아', '야')}, 할미가 사과 문제 하나 낼게. 맞히면 용돈 줄게!`, ok:n => `딩동댕! 역시 우리 ${jo(n, '이야', '야')}. 용돈 5만원 받으렴.`, no:'아깝다! 정답은'},
  chief:{k:'quizDayC', name:'고만수 이장님', ask:n => `${n}, 이장이 사과 문제 하나 내 보겠네. 맞히면 마을에서 상금을 주지!`, ok:n => `허허, 정답이네! 역시 ${jo(n, '이', '가')} 사과 박사구먼. 상금 5만원 받게.`, no:'아쉽구먼! 정답은'}};
// 2026-10-13 퀴즈는 문제를 낸 순간부터 2~3주 뒤에 다시 나와요(창을 닫아 버려도 다시 안 나옴)
const quizReady = who => absDay() >= ((G.quizNext || {})[who] || 0);
function quizUsed(who){ if (!G.quizNext) G.quizNext = {}; G.quizNext[who] = absDay() + rint(14, 21); G[QZ[who].k] = weekId(); }
const quizWait = who => Math.max(1, Math.ceil((((G.quizNext || {})[who] || 0) - absDay()) / 7));
function pickQuiz(){
  if (!G.quizSeen) G.quizSeen = [];
  let pool = QUIZ.map((q, i) => i).filter(i => !G.quizSeen.includes(i));
  if (!pool.length) { G.quizSeen = []; pool = QUIZ.map((q, i) => i); }
  const i = pick(pool); G.quizSeen.push(i);
  const q = QUIZ[i], ord = [0, 1, 2].sort(() => Math.random() - .5);
  return {q:q.q, e:q.e, a:ord.map(k => q.a[k]), c:ord.indexOf(q.c)};
}
function askQuiz(who){
  const Z = QZ[who], q = pickQuiz(); quizUsed(who);
  const o = talk(who, `${Z.ask(HN())}<br><b style="font-family:var(--display);font-weight:400;font-size:24px">Q. ${esc(q.q)}</b>`, '');
  $('#talkX').innerHTML = `<div class="quiz">${q.a.map((a, i) => `<button class="btn" data-a="${i}">${'①②③'[i]} ${esc(a)}</button>`).join('')}</div>`;
  const answer = i => {
    const right = i === q.c;
    if (right) { G.money += 50000; G.rep += 1; G.stats.quiz++; if (G.stats.quiz >= 5) unlock('quiz5'); updateHUD(true); }
    o.body.querySelector('.bubble').innerHTML = `<div class="who">${Z.name}</div>${right ? `${Z.ok(HN())} (평판 +1)` : `${Z.no} <b>${esc(q.a[q.c])}</b>${who === 'chief' ? '일세.' : '이란다.'}`}${q.e ? `<div class="fact" style="margin-top:10px">💡 ${esc(q.e)}</div>` : ''}`;
    $('#talkX').innerHTML = '';
    o.footEl.innerHTML = `<button class="btn pri" id="tOk">고마워요</button>`; $('#tOk').onclick = () => UI.close();
    if (AUTO) o.timer = setTimeout(() => UI.modal === o && UI.close(), POPMS / 2);
  };
  $('#talkX').querySelectorAll('[data-a]').forEach(b => b.onclick = () => answer(+b.dataset.a));
  if (AUTO) o.timer = setTimeout(() => answer(Math.random() < .75 ? q.c : (q.c + 1) % 3), 1500);
}

// ===== 소매 판매 + 포장 (2026-10-13) =====
// 손님이 직접 사 가는 주문. 경매 상한(상자당 10만원)의 최대 2배까지 받아요.
// 포장은 주문 하나당 한 번: 상자 펴기 → 사과 담기 → 완충제 넣기 하면 그 주문 전체가 포장돼요.
const RETAIL_C = [
  {name:'서울 단골 손님', ic:'📮'}, {name:'캠핑장 사장님', ic:'🏕️'}, {name:'옆 마을 빵집', ic:'🥐'}, {name:'유치원 간식', ic:'🧸'},
  {name:'등산객 가족', ic:'🥾'}, {name:'카페 사장님', ic:'☕'}, {name:'할머니 손주 선물', ic:'🎀'}, {name:'동네 반찬가게', ic:'🍱'}
];
const RETAIL_MAX = 200000, RETAIL_P = .35;
function retailUnit(gk){ const hi = clamp(gByK(gk).base * 1.07 * (G.b.cold ? 1.1 : 1) * shedMult(), 3, 10); return Math.min(RETAIL_MAX, Math.round(hi * 2 * 10) * 1000); }
function retailWeek(){
  if (!G.retail) G.retail = [];
  G.retail = G.retail.filter(o => { if (o.year < G.year || o.due < G.week) { toast(`${o.name} 소매 주문 날짜가 지났어요`, 'bad'); return false; } return true; });
  if (totalStock() < 2 || G.retail.length >= (shedLv() >= 3 ? 3 : 2) || Math.random() > RETAIL_P + (shedLv() >= 2 ? .1 : 0)) return;
  const gs = GRADES.map(g => g.k).filter(k => stockAtLeast(k) >= 2);
  if (!gs.length) return;
  const t = pick(RETAIL_C), g = pick(gs);
  const o = {id:G.oid++, name:t.name, ic:t.ic, g, n:Math.min(rint(2, 6), stockAtLeast(g) + rint(0, 2)), unit:retailUnit(g), due:Math.min(52, G.week + 2), year:G.year};
  G.retail.push(o);
  emit('pop', {ic:'🛍️', t:'소매 주문이 들어왔어요', m:`${t.ic} ${o.name}: ${gByK(g).name} 등급 이상 ${o.n}상자, 상자당 <b>${won(o.unit)}</b>(경매보다 비싸요!). 창고 → 🛍️ 소매에서 포장해서 보내 주세요. ${o.due}주까지.`});

  return Math.round((it.price * .5 + up * .3) / 10000) * 10000;
}
function dropGear(slot, id, sell){
  const g = ensureGear(), it = gearItem(slot, id);
  if (!(id in g.own) || g[slot] === id) return false; // 끼고 있는 건 못 팔아요
  const pay = sell ? gearSellPrice(slot, id) : 0;
  delete g.own[id]; G.money += pay;
  toast(sell ? `💰 ${jo(it.name, '을', '를')} ${won(pay)}에 팔았어요.` : `🗑️ ${jo(it.name, '을', '를')} 버렸어요.`, sell ? 'gold' : '');
  updateHUD(true); return true;
}
// 팔기·버리기 버튼: 한 번 누르면 '정말?'로 바뀌고, 3초 안에 한 번 더 누르면 해요
function gearSellBtns(slot, it){
  const g = ensureGear(); if (g[slot] === it.id) return '';
  const p = gearSellPrice(slot, it.id);
  return `<span class="gsb">${p > 0 ? `<button class="btn sm" data-sell="${slot}|${it.id}">💰 팔기 ${won(p)}</button>` : ''}<button class="btn sm" data-drop="${slot}|${it.id}">🗑️ 버리기</button></span>`;
}
function bindSellBtns(root, o){
  const arm = (b, txt, run) => b.onclick = e => {
    e.stopPropagation();
    if (b.dataset.armed) { run(); o.render(o); return; }
    b.dataset.armed = 1; b.dataset.t = b.textContent; b.textContent = txt; b.classList.add('warn');
    setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.textContent = b.dataset.t; b.classList.remove('warn'); } }, 3000);
  };
  root.querySelectorAll('[data-sell]').forEach(b => { const [s, id] = b.dataset.sell.split('|'), it = gearItem(s, id); arm(b, `${it.unique ? '⚠️ 하나뿐인 장비예요! ' : ''}정말 팔까요? 한 번 더`, () => dropGear(s, id, true)); });
  root.querySelectorAll('[data-drop]').forEach(b => { const [s, id] = b.dataset.drop.split('|'), it = gearItem(s, id); arm(b, `${it.unique ? '⚠️ 하나뿐인 장비예요! ' : ''}정말 버릴까요? 한 번 더`, () => dropGear(s, id, false)); });
}
// 능력치: 레벨이 오르면 힘·체력·솜씨가 늘어요
function farmer(){
  const g = ensureGear(), lv = G.fm.lv;
  return {lv, xp:G.fm.xp, need:xpNeed(lv), atk:slotStat('weapon') + (lv - 1) * 2, def:slotStat('armor'), spd:slotStat('boots') + (lv - 1),
    hp:100 + slotStat('hat') + (lv - 1) * 6, skill:Math.min(15, lv - 1), reach:gearItem('weapon', g.weapon).reach || 1};
}
const xpNeed = lv => 60 + lv * 40;
function gainXp(n){
  ensureGear(); G.fm.xp += Math.round(n);
  let up = 0;
  while (G.fm.xp >= xpNeed(G.fm.lv)) { G.fm.xp -= xpNeed(G.fm.lv); G.fm.lv++; up++; }
  if (up) { sfx('level'); toast(`⭐ ${HN()} 레벨 ${G.fm.lv}! 힘·체력·솜씨가 늘었어요.`, 'good'); floats.push({x:P.x, y:P.y - 130, s:`LEVEL UP!`, t:1.6, c:'#ff6b57'}); }
}

const SND = {ctx:null, master:null, bgmG:null, sfxG:null, on:{bgm:true, sfx:true}, vol:{bgm:.18, sfx:.6}, step:0, nextT:0, timer:null, mode:'home'};

  try { const s = JSON.parse(store.get('haru-sound', 'null')); if (s) { Object.assign(SND.on, s.on || {}); Object.assign(SND.vol, s.vol || {}); } } catch (e) {}

function sndInit(){
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = SND.ctx = new AC();
  SND.master = c.createGain(); SND.master.connect(c.destination);
  SND.bgmG = c.createGain(); SND.bgmG.connect(SND.master);
  SND.sfxG = c.createGain(); SND.sfxG.connect(SND.master);
  sndApply();
  SND.nextT = c.currentTime + .2;
  SND.timer = setInterval(bgmTick, 120);
}
function sndApply(){
  if (!SND.ctx) return;
  const t = SND.ctx.currentTime;
  SND.bgmG.gain.setTargetAtTime(SND.on.bgm ? SND.vol.bgm : 0, t, .15);
  SND.sfxG.gain.setTargetAtTime(SND.on.sfx ? SND.vol.sfx : 0, t, .05);
}

function tone(type, f, t0, dur, vol, out, f2){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();

  o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + dur + .05);
}

  const c = SND.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);

  const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
  fl.type = 'highpass'; fl.frequency.value = hp || 800; s.buffer = b; g.gain.value = vol;
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t0);
}

function noiseF(t0, dur, vol, out, type, f0, f1, q){
  const c = SND.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
  fl.type = type; fl.Q.value = q || 1; fl.frequency.setValueAtTime(f0, t0); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + Math.min(.015, dur / 5)); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

function bgmTick(){

function spawnObj(M){

  let x = rnd(-.85, .85);

const objHalf = k => k === 'branch' ? 120 : k === 'rock' ? 42 : 52;

// ----- 매 프레임 -----
function update(dt){
  if (UI.free() && speed > 0 && !ssAnim) advance(dt / DAY_SEC * 14 * speed * (inHunt(P.x, P.y) ? .5 : 1)); // 사냥터에선 시간이 조금 천천히 (2026-10-12 밸런스 .1 → .5)
  updateSS(dt);
  // 하루 이동
  let mx = 0, my = 0;
  if (UI.free() && !ssAnim) {
    if (actDown('up') || keys.ArrowUp) my -= 1; if (actDown('down') || keys.ArrowDown) my += 1;
    if (actDown('left') || keys.ArrowLeft) mx -= 1; if (actDown('right') || keys.ArrowRight) mx += 1;
    if (joy.on) { mx = joy.x; my = joy.y; }
    if (mx || my) { P.tgt = null; P.pend = null; }
    else if (P.tgt) {
      const dx = P.tgt.x - P.x, dy = P.tgt.y - P.y, d = Math.hypot(dx, dy);
      if (d < 10) { P.tgt = null; if (P.pend) { const pd = P.pend; P.pend = null; act(pd); } }
      else { mx = dx / d; my = dy / d; }
    }
  }
  const sp = P.spd * (1 + farmer().spd / 100) * (P.blk ? .45 : 1), m = Math.hypot(mx, my);
  if (P.kb) { moveBy(P, P.kb.x * dt, P.kb.y * dt); P.kb.t -= dt; if (P.kb.t <= 0) P.kb = null; }
  else if (m > .1 && P.act <= 0) {
    const nx = mx / Math.max(1, m), ny = my / Math.max(1, m);
    const ox = P.x, oy = P.y;
    moveBy(P, nx * sp * dt, ny * sp * dt);
    P.walk += dt * 11;
    P.dir = Math.abs(nx) > Math.abs(ny) ? (nx < 0 ? 2 : 3) : (ny < 0 ? 1 : 0);
    if (Math.abs(nx) > .2) P.face = nx < 0 ? -1 : 1;
    const moved = Math.hypot(P.x - ox, P.y - oy);
    if (P.tgt && moved < .5) { P.stuck = (P.stuck || 0) + dt; if (P.stuck > .4) { P.stuck = 0; detour(); } } else P.stuck = 0;
    cam.ox *= .9; cam.oy *= .9;
  } else P.walk = 0;
  if (P.sw > 0) P.sw -= dt;
  // 인부
  if (workerS.on) {
    const dx = workerS.tx - workerS.x, dy = workerS.ty - workerS.y, d = Math.hypot(dx, dy);
    if (d > 4) { const s = Math.min(d, 320 * dt); workerS.x += dx / d * s; workerS.y += dy / d * s; workerS.walk += dt * 11; workerS.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 2 : 3) : (dy < 0 ? 1 : 0); }
    else workerS.walk = 0;
    if (workerS.act > 0) workerS.act -= dt;
    if (G.worker <= 0) { workerS.tx = SPOT.shed.x; workerS.ty = SPOT.shed.y + 30; if (d < 8) workerS.on = false; }
  }
  updateCritters(dt); updateVillagers(dt); updateHunt(dt);
  for (const f of flies) { f.t += dt; f.x += Math.cos(f.t * .7) * 40 * dt + 10 * dt; f.y += Math.sin(f.t * 1.3) * 30 * dt; if (f.x > WORLD_W) f.x = 0; }
  for (const f of floats) { f.t -= dt; f.y -= dt * 40; }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t <= 0) floats.splice(i, 1);
  for (const m2 of mist) { m2.a -= dt * .35; m2.r += dt * 18; if (m2.vx) { m2.x += m2.vx * dt; m2.y += m2.vy * dt; m2.vx *= 1 - dt * .9; m2.vy *= 1 - dt * .9; } }
  for (let i = mist.length - 1; i >= 0; i--) if (mist[i].a <= 0) mist.splice(i, 1);
  // 카메라
  if (!ssAnim) { cam.x += (P.x + cam.ox - cam.x) * Math.min(1, dt * 6); cam.y += (P.y - 60 + cam.oy - cam.y) * Math.min(1, dt * 6); }
  const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  cam.x = clamp(cam.x, WX0 + hw, WX1 - hw); cam.y = clamp(cam.y, WY0 + hh, worldBot() - hh);
}
function detour(){
  if (!P.tgt) return;
  const dx = P.tgt.x - P.x, dy = P.tgt.y - P.y;
  const cands = [[-dy, dx], [dy, -dx], [0, 1], [0, -1], [1, 0], [-1, 0]].map(([a, b]) => { const l = Math.hypot(a, b) || 1; return [P.x + a / l * 110, P.y + b / l * 110]; }).filter(([x, y]) => !blocked(x, y));
  if (!cands.length) { P.tgt = null; P.pend = null; return; }
  const [x, y] = cands[0];
  const real = P.tgt, pend = P.pend;
  P.tgt = {x, y}; P.pend = {kind:'go', x:real.x, y:real.y, pend};
}

    if (n) toast(`🌱 묘목 ${n}그루를 한꺼번에 심었어요.`, 'good');

  if (quizReady('grandma')) return walkTo('grandma');

const AUTO_BUY = [['b', 'beehive'], ['d', 'flowers'], ['d', 'dog'], ['b', 'beehive'], ['b', 'wondumak'], ['b', 'beehive'], ['b', 'fence'], ['d', 'pond'], ['b', 'frostfan'], ['b', 'hailnet'], ['d', 'rabbit'], ['d', 'chicken'], ['d', 'cat'], ['d', 'blossom'], ['L'], ['b', 'cold'], ['d', 'jangdok'], ['d', 'sotdae'], ['b', 'drone'], ['L'], ['b', 'factory'], ['L'], ['b', 'sarang'], ['L'], ['L'], ['L'], ['L'], ['L'], ['L']];
