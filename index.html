<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff8a80">
<link rel="manifest" href="manifest.json">
</head>
<body>
<title>사과 과수원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a fixed 1920x1080 stage scaled to fit the window. Weather top-left, money top-right, task list right, tool bar bottom-centre. Wooden-plank storybook UI over a hazy 3D orchard. Single warm look on purpose. */
:root{
  color-scheme: light;
  --letterbox:#1f2a17;
  --wood:#a8652f;
  --wood-dk:#5b3216;
  --wood-lt:#d08a4a;
  --parch:#f3e6c9;
  --ink:#42291a;
  --muted:#7b6450;
  --ok:#3f8a2a;
  --warn:#d07a12;
  --bad:#c0362c;
  --blue:#3d7fe0;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--letterbox);color:var(--ink);font-family:var(--display);-webkit-user-select:none;user-select:none}
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#cfd096}
#c{position:absolute;inset:0;width:1920px;height:1080px;display:block;outline:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 60%,rgba(40,30,0,.25) 100%)}
.txt{color:#fff;text-shadow:0 2px 0 var(--wood-dk),1.5px 0 0 var(--wood-dk),-1.5px 0 0 var(--wood-dk),0 -1.5px 0 var(--wood-dk)}
.plank{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,rgba(0,0,0,0) 3px 12px),linear-gradient(var(--wood-lt),var(--wood));border:3px solid var(--wood-dk);border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.25)}
.parch{background:var(--parch);border:3px solid var(--wood-dk);border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--display);cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:3px solid #fff200;outline-offset:2px}

/* weather (top-left) */
#wx{position:absolute;left:24px;top:22px;width:410px;padding:0;overflow:hidden}
#wx .hd{padding:10px 18px;font-size:30px;display:flex;justify-content:space-between;align-items:baseline}
#wx .hd small{font-size:20px}
#wx .bd{background:var(--parch);padding:14px 18px 16px;display:grid;grid-template-columns:118px 1fr;gap:10px 16px;font-family:var(--body);font-size:19px}
.compass{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#fffaf0 0 56%,#e6d3ad 57%);border:3px solid var(--wood-dk);position:relative;grid-row:span 3}
.compass b{position:absolute;font-family:var(--display);font-size:15px;color:var(--muted);font-weight:400}
.compass .n{left:50%;top:3px;transform:translateX(-50%);color:var(--bad)}.compass .s{left:50%;bottom:3px;transform:translateX(-50%)}.compass .e{right:6px;top:50%;transform:translateY(-50%)}.compass .w{left:6px;top:50%;transform:translateY(-50%)}
.compass .arrow{position:absolute;left:50%;top:50%;width:14px;height:78px;margin:-39px 0 0 -7px;transition:transform .6s}
.compass .spd{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-size:16px;color:var(--ink);text-shadow:0 0 4px #fffaf0,0 0 4px #fffaf0}
.wxrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.wxrow b{font-family:var(--display);font-weight:400;font-size:22px}
.big{font-family:var(--display);font-size:40px;display:flex;align-items:center;gap:8px}
.risk{grid-column:1 / -1;display:grid;grid-template-columns:120px 1fr 54px;gap:6px 10px;align-items:center}
.bar{height:14px;border-radius:8px;background:#e1d1b0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.fc{grid-column:1 / -1;display:flex;gap:8px;border-top:2px dashed #d7c39b;padding-top:10px}
.fc div{flex:1;text-align:center;font-size:16px;color:var(--muted)}
.fc div b{display:block;font-size:26px;font-weight:400}
.advice{grid-column:1 / -1;font-size:18px;padding:8px 10px;border-radius:10px;background:#fff6dc;line-height:1.35}
.advice.bad{background:#ffe3d9;color:#8a2a16}

/* money (top-right) */
#top{position:absolute;right:24px;top:22px;display:flex;gap:10px;align-items:flex-start}
.chip{padding:6px 18px;font-size:28px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip small{font-size:18px;opacity:.9}

/* tasks (right) */
#tasks{position:absolute;right:24px;top:110px;width:400px}
#tasks .hd{padding:8px 16px;font-size:28px;margin:0 -6px;position:relative;z-index:1;text-align:center}
#tasks .bd{margin-top:-10px;padding:22px 18px 14px;display:flex;flex-direction:column;gap:9px;font-family:var(--body);font-size:19px;max-height:560px;overflow:auto}
.task{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:#fbf3df}
.task .ic{font-size:26px;text-align:center}
.task b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.task small{color:var(--muted);font-size:16px}
.task .st{font-family:var(--display);font-size:19px;white-space:nowrap}
.task.now{background:#fff2b8;box-shadow:inset 0 0 0 2px #e5b52a}
.task.done{opacity:.6}
.task.late .st{color:var(--bad)}

/* bottom */
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#prompt{padding:8px 22px;font-size:26px;display:flex;align-items:center;gap:12px;white-space:nowrap}
#prompt kbd{font-family:var(--display);background:#fff;color:var(--wood-dk);border-radius:8px;padding:0 12px;border:3px solid var(--wood-dk);box-shadow:0 3px 0 var(--wood-dk);text-shadow:none}
#varpick{display:flex;gap:8px;padding:8px}
.vbtn{padding:6px 14px;font-size:21px;border-radius:12px;background:var(--parch);border:3px solid var(--wood-dk);color:var(--ink);display:flex;align-items:center;gap:8px}
.vbtn.on{background:#fff2b8;box-shadow:0 0 0 3px #f2c230}
.vbtn i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.25)}
#bar{display:flex;align-items:flex-end;gap:8px;padding:10px 14px}
.tool{width:92px;height:104px;border-radius:16px;background:linear-gradient(#5d9bf0,var(--blue));border:3px solid #1d3f78;box-shadow:0 4px 0 #1d3f78;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:38px;position:relative;color:#fff}
.tool span{font-size:17px;text-shadow:0 1px 0 #1d3f78}
.tool kbd{position:absolute;left:6px;top:4px;font-family:var(--display);font-size:16px;opacity:.85}
.tool.on{background:linear-gradient(#ffd66b,#f0a21a);border-color:#8a5208;box-shadow:0 4px 0 #8a5208,0 0 0 4px #fff7c0;transform:translateY(-6px)}
.tool.on span{text-shadow:0 1px 0 #8a5208}
.tool.off{filter:grayscale(.8);opacity:.6}
.tool.alt{background:linear-gradient(#78c35a,#3f8a2a);border-color:#24561a;box-shadow:0 4px 0 #24561a}
.tool.alt span{text-shadow:0 1px 0 #24561a}
.sep{width:3px;align-self:stretch;background:var(--wood-dk);opacity:.5;margin:6px 4px;border-radius:2px}
#keys{position:absolute;left:24px;bottom:20px;font-family:var(--body);font-size:17px;padding:8px 14px;line-height:1.5;max-width:360px}
#keys b{font-family:var(--display);font-weight:400}

/* toast + log */
#toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:max-content;max-width:700px;padding:12px 22px;font-family:var(--body);font-size:21px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;transition:opacity .4s}
#toast .g{font-size:34px;line-height:1}
#toast b{font-family:var(--display);font-weight:400;color:#a0461c}

/* row labels */
#labels{position:absolute;inset:0;pointer-events:none}
.rl{position:absolute;left:0;top:0;padding:2px 10px;font-size:18px;white-space:nowrap;border-radius:10px;transform:translate(-50%,-50%)}
.rl.cur{background:#fff2b8;color:var(--ink);border:3px solid #e5b52a}

/* modal */
#modal{position:absolute;inset:0;background:rgba(30,20,8,.45);display:flex;align-items:center;justify-content:center;z-index:20}
#mc{width:720px;max-height:900px;overflow:auto;padding:0}
#mc .hd{padding:12px 22px;font-size:32px;text-align:center}
#mc .bd{background:var(--parch);padding:20px 26px;font-family:var(--body);font-size:21px;line-height:1.55;display:flex;flex-direction:column;gap:14px}
#mc .bd p{margin:0}
#mc .row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.btn{font-size:24px;padding:10px 26px;border-radius:14px;background:linear-gradient(#78c35a,#3f8a2a);border:3px solid #24561a;box-shadow:0 4px 0 #24561a;color:#fff;text-shadow:0 2px 0 #24561a}
.btn.sub{background:linear-gradient(#f1e2c3,#d9c299);color:var(--ink);text-shadow:none;border-color:var(--wood-dk);box-shadow:0 4px 0 var(--wood-dk)}
.btn:disabled{opacity:.5;cursor:default}
.check{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:#fbf3df;font-size:21px}
.check input{width:26px;height:26px;accent-color:#3f8a2a}
.check small{color:var(--muted);font-size:17px;display:block}
table.t{width:100%;border-collapse:collapse;font-size:20px}
table.t th{font-family:var(--display);font-weight:400;text-align:left;color:var(--muted);border-bottom:2px solid #d7c39b;padding:4px 6px}
table.t td{padding:6px;border-bottom:1px solid #e6d6b3}
table.t td.r,table.t th.r{text-align:right}
.lot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:#fbf3df}
.lot .p{font-family:var(--display);font-size:52px;color:#a0461c}
.bidders{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 18px;font-size:15px;color:var(--muted)}
.bidder.bigc .f{filter:drop-shadow(0 0 8px #ffd23f)}.bidder.bigc .pd{background:#ffd23f}
.bigmsg{font-size:22px;color:#b26b00;background:#fff4c2;border-radius:14px;padding:6px 14px;margin:6px 0}
.bidder{display:flex;flex-direction:column;align-items:center;gap:2px}
.bidder .f{font-size:36px}
.bidder .pd{font-family:var(--display);border:2px solid var(--wood-dk);border-radius:8px;padding:0 10px;background:#fff;transition:transform .2s}
.bidder.up .pd{transform:translateY(-10px);background:#ffd66b}
.bidder.win .pd{transform:translateY(-10px);background:var(--bad);color:#fff}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff}
/* 인터페이스 85% 축소 */
#wx{transform:scale(.85);transform-origin:0 0}
#top{transform:scale(.85);transform-origin:100% 0}
#tasks{top:96px;transform:scale(.85);transform-origin:100% 0}
#bottom{transform:translateX(-50%) scale(.85);transform-origin:50% 100%}
#keys{transform:scale(.85);transform-origin:0 100%}
#toast{transform:translateX(-50%) scale(.85);transform-origin:50% 0}
#mc{transform:scale(.9)}
.bcard{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;background:#fbf3df}
.bcard .i{font-size:40px;width:52px;text-align:center}
.bcard .tx{flex:1}
.bcard .tx small{display:block;color:var(--muted);font-size:17px;line-height:1.4}
.bcard .btn{font-size:20px;padding:6px 16px;white-space:nowrap}
#labels2{position:absolute;inset:0;pointer-events:none}
.rl.npc{background:#fff6dc;font-size:19px}
#ach{position:absolute;left:50%;top:210px;transform:translateX(-50%) scale(.85);transform-origin:50% 0;padding:10px 26px;font-size:24px;opacity:0;transition:opacity .4s;z-index:15;pointer-events:none;white-space:nowrap}
.tabs{display:flex;gap:8px}
.tab{font-size:21px;padding:6px 16px;border-radius:12px;background:#ead7b0;border:3px solid var(--wood-dk);color:var(--ink)}
.tab.on{background:#fff2b8;box-shadow:0 0 0 3px #f2c230}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard.lock{opacity:.55}
.sw{display:inline-block;width:40px;height:40px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
.vbtn.lk{opacity:.5}

/* ===== 깔끔·귀여운 테마 (파스텔 카드) ===== */
:root{--card:#fffdf9;--line:#f3e1d6;--ink:#4b3a34;--muted:#a08a80;--coral:#ff7d7d;--coral-dk:#e86262;--mint:#5ccaa8;--mint-dk:#3fae8c;--sun:#ffcf5c;--sun-dk:#eab03a;--ok:#36a883;--bad:#e5534b;--warn:#f0a030;--letterbox:#e9f3ec}
#stage{background:#dff0e6}
.txt{color:var(--ink);text-shadow:none}
.plank{background:var(--card);border:none;border-radius:24px;box-shadow:0 0 0 3px #fff,0 8px 22px rgba(90,60,40,.16)}
.parch{background:var(--card);border:none;border-radius:20px;box-shadow:0 0 0 3px #fff,0 8px 22px rgba(90,60,40,.14)}
#wx .hd,#mc .hd{background:linear-gradient(#ff9494,#ff7474);color:#fff;text-shadow:0 2px 0 rgba(190,60,60,.3)}
#wx .hd small{opacity:.9}
#tasks .hd{background:linear-gradient(#ff9494,#ff7474);color:#fff;border-radius:22px;margin:0;text-shadow:0 2px 0 rgba(190,60,60,.3)}
#tasks .bd{margin-top:8px;border-radius:22px;padding:14px}
#wx .bd,#mc .bd{background:var(--card)}
.compass{background:radial-gradient(circle,#fff 0 56%,#ffeae5 57%);border:3px solid #ffcdc4}
.bar{background:#f5ebe5}
.fc{border-top:2px dashed var(--line)}
.advice{background:#effaf5;border-radius:14px}.advice.bad{background:#fff0ee;color:#c2433b}
.task{background:#fff6f1;border-radius:14px}.task.now{background:#fff5d3;box-shadow:inset 0 0 0 2px var(--sun)}
.chip{font-size:25px;color:var(--ink);padding:6px 16px}.chip small{color:var(--muted)}
#prompt{color:var(--ink)}
#prompt kbd{background:var(--coral);color:#fff;border:none;box-shadow:0 3px 0 var(--coral-dk);border-radius:10px}
.vbtn{background:#fff;border:2px solid var(--line);border-radius:999px}.vbtn.on{background:#fff5d3;box-shadow:0 0 0 3px var(--sun)}
.tool{background:#fff;border:none;border-radius:22px;box-shadow:0 0 0 2px var(--line),0 5px 0 #efd5c7;color:var(--ink)}
.tool span{text-shadow:none;color:var(--ink)}
.tool kbd{color:var(--muted)}
.tool.on{background:#fff5d3;box-shadow:0 0 0 3px var(--sun),0 5px 0 var(--sun-dk)}.tool.on span{text-shadow:none}
.tool.alt{background:#effaf6;border:none;box-shadow:0 0 0 2px #c8eedf,0 5px 0 #a6dbc6}.tool.alt span{text-shadow:none}
.sep{background:var(--line);opacity:1}
.btn{background:linear-gradient(#ff9494,#ff7474);border:none;border-radius:999px;box-shadow:0 4px 0 var(--coral-dk);text-shadow:none}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line),0 4px 0 #efd5c7}
.btn.mint{background:linear-gradient(#77dbbb,#4fc49f);box-shadow:0 4px 0 var(--mint-dk)}
.bcard,.check,.lot{background:#fff6f1;border-radius:16px}
.lot .p{color:var(--coral-dk)}
.tab{background:#fff;border:2px solid var(--line);border-radius:999px}.tab.on{background:#fff5d3;box-shadow:0 0 0 3px var(--sun)}
#toast b{color:var(--coral-dk)}
.rl{background:rgba(255,253,249,.94)!important;color:var(--ink)!important;border-radius:999px;box-shadow:0 3px 10px rgba(90,60,40,.18)!important;border:none!important}
.rl.cur{background:#fff5d3!important;box-shadow:0 0 0 3px var(--sun)!important}
.vig{background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 66%,rgba(70,50,30,.1) 100%)}
table.t th{border-bottom:2px solid var(--line)}table.t td{border-bottom:1px solid var(--line)}
.bidder .pd{border:2px solid var(--line)}
/* 시계 */
.clockc{gap:6px}
.clockc #clk{min-width:118px;font-variant-numeric:tabular-nums}
.spd{font-size:15px;padding:3px 8px;border-radius:999px;background:#f6ede7;color:var(--ink);line-height:1.3}
.spd.on{background:var(--sun);box-shadow:0 2px 0 var(--sun-dk)}
.spd.bot.on{background:var(--mint);color:#fff;box-shadow:0 2px 0 var(--mint-dk)}
#autobtn{position:absolute;left:24px;top:430px;display:flex;flex-direction:column;align-items:center;gap:0;padding:12px 22px;border-radius:24px;border:none;font-family:var(--display);font-size:30px;line-height:1.1;color:#fff;background:linear-gradient(#a98bff,#7a5cf0);box-shadow:0 6px 0 #4d36b0,0 0 0 4px #fff,0 10px 24px rgba(90,60,160,.35);cursor:pointer;z-index:5}
#autobtn b{font-size:26px}#autobtn small{font-size:16px;opacity:.9}
#autobtn.on{background:linear-gradient(#ffb36b,#ff7a45);box-shadow:0 6px 0 #b24a1d,0 0 0 4px #fff,0 0 0 10px rgba(255,140,80,.35);animation:autopulse 1.2s ease-in-out infinite}
@keyframes autopulse{50%{box-shadow:0 6px 0 #b24a1d,0 0 0 4px #fff,0 0 0 18px rgba(255,140,80,0)}}
#stage.driving #autobtn{display:none}
#stage.mob #autobtn{top:auto;bottom:250px;left:110px;transform:scale(.8);transform-origin:0 100%}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;font-family:var(--display);font-size:18px}
.arena .big{font-size:84px;line-height:1.1;transition:transform .2s}
.arena .beast{transform:scaleX(-1)}
.arena .side.hurt .big{animation:hurt .45s}
.arena .side.gone .big{opacity:.25;transform:translateX(60px) scaleX(-1)}
@keyframes hurt{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-6deg)}75%{transform:translateX(10px) rotate(6deg)}}
.arena .beast{display:inline-block}
.arena .vs{font-size:22px;color:var(--coral-dk)}.arena .vs span{font-size:16px;color:var(--muted)}
.bbar{height:14px;border-radius:8px;background:#f2e6df;overflow:hidden;margin:4px 12px 0}.bbar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.blog{background:#fff;border-radius:14px;padding:10px 14px;min-height:92px;font-size:19px;box-shadow:0 0 0 2px var(--line)}
.bacts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bact{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:16px;border:none;background:#fff;box-shadow:0 0 0 2px var(--line),0 4px 0 #efd5c7;font-family:var(--display);font-size:20px;color:var(--ink);cursor:pointer;text-align:left}
.bact small{font-family:var(--body);font-size:14px;color:var(--muted)}
.bact:hover:not(:disabled){background:#fff4c2}.bact:disabled{opacity:.45;cursor:default}
/* 운전 모드 */
#stage.driving #wx,#stage.driving #top,#stage.driving #tasks,#stage.driving #bottom,#stage.driving #keys,#stage.driving #labels,#stage.driving #labels2,#stage.driving #toast{display:none}
#drive{position:absolute;inset:0;pointer-events:none;font-family:var(--display);color:var(--ink)}
#drive .dhud{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 26px;min-width:520px}
#dsc{font-size:24px}#dob{font-size:20px;color:var(--muted)}
#dcb{position:absolute;right:60px;top:200px;font-size:52px;color:var(--coral-dk);text-shadow:0 3px 0 #fff}
.dprog{width:460px;height:12px;border-radius:8px;background:#f5ebe5;overflow:hidden}.dprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:8px}
#dpop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:popa .5s ease-out forwards}
#dpop.p{color:#ffd23f}#dpop.g{color:#7ce0c0}#dpop.b{color:#ff7d7d}#dpop.m{color:#d9cfc9;font-size:40px}
@keyframes popa{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

const KEY = 'apple-orchard-v2';

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

const T_MONTH = [-1, 1, 6, 12, 18, 22, 25, 26, 21, 14, 7, 1];
const R_MONTH = [20, 25, 30, 35, 40, 50, 75, 60, 40, 25, 25, 20];
const DIRS = ['북','북동','동','남동','남','남서','서','북서'];
function weekDate(w){ const d = new Date(2027, 0, 1 + (w - 1) * 7 + 3); return {m:d.getMonth() + 1, wk:Math.ceil(d.getDate() / 7)}; }
function genWeather(){
  const out = [];
  for(let w = 1; w <= 52; w++){
    const {m} = weekDate(w);
    const rain = clamp(Math.round(R_MONTH[m - 1] + rnd(-25, 25)), 0, 100);
    const temp = Math.round((T_MONTH[m - 1] + rnd(-3, 3)) * 10) / 10;
    const hum = clamp(Math.round(45 + rain * .45 + rnd(-8, 8)), 30, 98);
    let wind = Math.round(rnd(.5, 4.8) * 10) / 10;
    if(Math.random() < .13) wind = Math.round(rnd(5, 8.5) * 10) / 10;
    let ev = null;
    if((m === 8 || m === 9) && Math.random() < .09){ ev = 'typhoon'; wind = Math.round(rnd(14, 22)); }
    else if((m === 5 || m === 6) && Math.random() < .04) ev = 'hail';
    else if(m === 4 && Math.random() < .12 && temp < 9) ev = 'frost';
    const dir = Math.floor(rnd(0, 8));
    const tSuit = clamp(1 - Math.abs(temp - 24) / 12, 0, 1);
    const disease = Math.round(clamp((rain * .65 + (hum - 50) * .9) * (.35 + tSuit * .75), 0, 100));
    const pest = Math.round(clamp((temp - 10) * 4.2 * (1.15 - rain / 220) + rnd(-8, 8), 0, 100));
    const icon = ev === 'typhoon' ? '🌀' : rain >= 70 ? '🌧️' : rain >= 45 ? '🌦️' : rain >= 28 ? '⛅' : '☀️';
    out.push({rain, temp, hum, wind, dir, ev, disease, pest, icon});
  }
  return out;
}

}

/* ================== 3D ================== */
let R, scene, cam, sun, inst = {}, farmer, sprayer, mist, rowFrame, fieldMeshes = [], crates;
const stage = $('stage');
const TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && innerWidth < 1400);
let SW = TOUCH ? 1280 : 1920, SH = TOUCH ? 720 : 1080;
if(TOUCH){ stage.classList.add('mob'); document.body.classList.add('touch'); }
let scale = 1;
function fit(){
  if(TOUCH){
    SW = Math.round(clamp(SH * innerWidth / Math.max(1, innerHeight), 1100, 2200));
    stage.style.width = SW + 'px'; stage.style.height = SH + 'px'; $('c').style.width = SW + 'px'; $('c').style.height = SH + 'px';
    try{ if(cam){ cam.aspect = SW / SH; cam.updateProjectionMatrix(); } }catch(e){}
  }
  scale = Math.min(innerWidth / SW, innerHeight / SH);
  stage.style.transform = `translate(${(innerWidth - SW * scale) / 2}px, ${(innerHeight - SH * scale) / 2}px) scale(${scale})`;
  if(R){ R.setPixelRatio(Math.min(1, scale * (devicePixelRatio || 1) * 1.0)); R.setSize(SW, SH, false); }
}
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.85, metalness:0}, o));
function M(geo, mat, x = 0, y = 0, z = 0, cast = true){ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; return m; }
function jitter(geo, amt, seed = 1){
  const p = geo.attributes.position, v = new THREE.Vector3();
  for(let i = 0; i < p.count; i++){ v.fromBufferAttribute(p, i); const n = Math.sin(v.x * 3.1 + seed) * Math.cos(v.y * 2.7 + seed * 1.7) * Math.sin(v.z * 3.3 + seed * .3); v.multiplyScalar(1 + n * amt); p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); return geo;
}
function tint(geo, top, bottom){
  const p = geo.attributes.position, c = new Float32Array(p.count * 3), a = new THREE.Color(top), b = new THREE.Color(bottom), t = new THREE.Color();
  let mn = 1e9, mx = -1e9; for(let i = 0; i < p.count; i++){ mn = Math.min(mn, p.getY(i)); mx = Math.max(mx, p.getY(i)); }
  for(let i = 0; i < p.count; i++){ t.copy(b).lerp(a, (p.getY(i) - mn) / (mx - mn || 1)); c.set([t.r, t.g, t.b], i * 3); }

function buildField(){
  fieldMeshes.forEach(m => { scene.remove(m); if(m.geometry) m.geometry.dispose(); });
  fieldMeshes = [];
  const add = m => { scene.add(m); fieldMeshes.push(m); return m; };
  const rows = S.rows, zTop = rowZ(rows - 1) - PITCH / 2, zBot = PITCH / 2;
  const depth = zBot - zTop;
  const at = scene.userData.alleyTex.clone(); at.needsUpdate = true; at.repeat.set(RULE.rowLen / 8, depth / PITCH); at.offset.y = .5;
  const alley = add(M(new THREE.PlaneGeometry(RULE.rowLen + 8, depth), std(0xffffff, {map:at}), 0, .02, (zTop + zBot) / 2, false));
  alley.rotation.x = -Math.PI / 2;
  for(let r = 0; r < rows; r++){
    const st = scene.userData.stripTex.clone(); st.needsUpdate = true; st.repeat.set(RULE.rowLen / 6, 1);
    add(M(new THREE.BoxGeometry(RULE.rowLen, .08, RULE.strip), std(0xffffff, {map:st, roughness:.95}), 0, .05, rowZ(r), false));
    // trellis end posts and wires
    [-RULE.rowLen / 2 - .3, RULE.rowLen / 2 + .3].forEach(x => add(M(new THREE.CylinderGeometry(.07, .08, 3.3, 6), std(0x9a9a9a, {roughness:.5}), x, 1.65, rowZ(r))));
    [1.6, 2.6].forEach(y => add(M(new THREE.CylinderGeometry(.012, .012, RULE.rowLen + .6, 4).rotateZ(Math.PI / 2), std(0xbfbfbf, {metalness:.6, roughness:.4}), 0, y, rowZ(r), false)));
  }
  // fence around owned field
  const fx = RULE.rowLen / 2 + 4, posts = [];
  for(let z = zBot + 1; z >= zTop - 1; z -= 3) posts.push([-fx, z], [fx, z]);
  for(let x = -fx; x <= fx; x += 3){ if(Math.abs(x) > 3.5) posts.push([x, zBot + 1]); posts.push([x, zTop - 1]); }
  const pg = new THREE.CylinderGeometry(.09, .1, 1.1, 6), pm = std(0xc99a5e);
  const pi = add(new THREE.InstancedMesh(pg, pm, posts.length)); pi.castShadow = true;
  const o = new THREE.Object3D(); posts.forEach(([x, z], i) => { o.position.set(x, .55, z); o.updateMatrix(); pi.setMatrixAt(i, o.matrix); });
  [[-fx, zBot + 1, -fx, zTop - 1], [fx, zBot + 1, fx, zTop - 1], [-fx, zTop - 1, fx, zTop - 1], [-fx, zBot + 1, -3.5, zBot + 1], [3.5, zBot + 1, fx, zBot + 1]].forEach(([x1, z1, x2, z2]) => {
    const len = Math.hypot(x2 - x1, z2 - z1); const rail = add(M(new THREE.BoxGeometry(len, .08, .06), pm, (x1 + x2) / 2, .85, (z1 + z2) / 2, false));
    rail.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
  });
  // expansion strip
  if(S.rows < RULE.maxRows){
    const ez = rowZ(S.rows);
    const ex = add(M(new THREE.PlaneGeometry(RULE.rowLen, PITCH - .4), new THREE.MeshBasicMaterial({color:0xfff2b8, transparent:true, opacity:.22, depthWrite:false}), 0, .04, ez, false));
    ex.rotation.x = -Math.PI / 2;
    const sign = new THREE.Group();
    sign.add(M(new THREE.BoxGeometry(.12, 1.4, .12), std(0x8a5a36), 0, .7, 0));
    sign.add(M(new THREE.BoxGeometry(1.8, .8, .1), std(0xd9b07a), 0, 1.4, 0));
    sign.position.set(-RULE.rowLen / 2 - 2, 0, ez); add(sign);
  }
}

    [[.18, 3], [.5, 3], [.82, 3]].forEach(([y, n]) => { for(let k = -n; k <= n; k++){ g.beginPath(); g.moveTo(6, h * y + k * 8); g.lineTo(w - 6, h * y + k * 8); g.stroke(); } });
  });

// 처마 끝이 살짝 들리는 곡선 지붕 한쪽 면
function roofSlope(L, W, H, side){
  const geo = new THREE.PlaneGeometry(L, W, 28, 10), p = geo.attributes.position;
  for(let i = 0; i < p.count; i++){
    const x = p.getX(i), u = (p.getY(i) + W / 2) / W;        // u: 0 처마 ~ 1 용마루
    const t = 1 - u, ends = Math.pow(Math.abs(x) / (L / 2), 4);
    const y = H * (1 - Math.pow(t, .75)) + ends * .55 * t * t;  // 오목한 곡선 + 양 끝 치켜올림
    p.setXYZ(i, side * x, y, side * t * W * .95);      // side로 뒤집어 앞면이 늘 위를 보게
  }
  geo.computeVertexNormals();
  return geo;
}
function makeHanok(L, D, scaleK){
  const T = hanokTextures(), g = new THREE.Group();
  const wood = std(0x7a4a28, {roughness:.8}), dark = std(0x3a3f45, {roughness:.7});
  const st = T.stone.clone(); st.needsUpdate = true; st.repeat.set(L / 3, 1);
  g.add(M(new THREE.BoxGeometry(L + 1.2, .6, D + 1.4), std(0xffffff, {map:st}), 0, .3, 0));          // 기단
  g.add(M(new THREE.BoxGeometry(1.4, .3, .5), std(0xa9a194), 0, .15, D / 2 + .95));                 // 디딤돌
  g.add(M(new THREE.BoxGeometry(L - .4, .14, 1.2), std(0xb5824e, {roughness:.7}), 0, .9, D / 2 - .45)); // 툇마루
  const H = 2.6, base = .6;
  // 벽과 창호 (앞면은 문, 옆·뒤는 벽)
  const bays = Math.round(L / 2.2), bw = (L - .4) / bays;
  for(let k = 0; k < bays; k++){

    const fm = new THREE.MeshStandardMaterial({map:front, roughness:.9});
    g.add(M(new THREE.PlaneGeometry(bw - .08, H - .2), fm, x, base + H / 2, D / 2 - 1.05 + .01, false));
    const bk = M(new THREE.PlaneGeometry(bw - .08, H - .2), new THREE.MeshStandardMaterial({map:T.wall, roughness:.9}), x, base + H / 2, -D / 2 + .02, false); bk.rotation.y = Math.PI; g.add(bk);
  }
  const inner = M(new THREE.BoxGeometry(L - .5, H, D - 1.2), std(0xf3ecdc), 0, base + H / 2, -.55); g.add(inner);
  // 기둥 (원형 기둥 + 주춧돌)
  for(let k = 0; k <= bays; k++){

    [D / 2 - .05, D / 2 - 1.05, -D / 2 + .05].forEach(z => {
      g.add(M(new THREE.CylinderGeometry(.13, .15, H + .1, 10), wood, x, base + H / 2 + .05, z));
      g.add(M(new THREE.CylinderGeometry(.22, .26, .14, 8), std(0xa9a194), x, base + .07, z));
    });
  }
  // 도리와 단청 띠
  [D / 2 - .05, -D / 2 + .05].forEach(z => {
    g.add(M(new THREE.BoxGeometry(L + .2, .22, .22), wood, 0, base + H + .1, z));
    g.add(M(new THREE.BoxGeometry(L + .2, .1, .24), std(0x3f8f7a), 0, base + H - .06, z, false));
  });
  // 지붕 (맞배 곡선 기와)
  const RL = L + 2.4, RW = D / 2 + 1.5, RH = 1.9, top = base + H + .25;
  const tm = T.tile.clone(); tm.needsUpdate = true; tm.repeat.set(RL / .55, 3);
  const roofM = std(0xffffff, {map:tm, roughness:.75}), eaveM = std(0x8a6242, {side:THREE.BackSide});   // 위는 기와, 아래는 서까래색
  [1, -1].forEach(side => { const geo = roofSlope(RL, RW, RH, side); g.add(M(geo, roofM, 0, top, 0)); g.add(M(geo, eaveM, 0, top - .02, 0, false)); });
  // 용마루 (흰 줄 + 짙은 기와) 와 양 끝 치미
  g.add(M(new THREE.BoxGeometry(RL - .6, .32, .5), dark, 0, top + RH + .1, 0));

  [-1, 1].forEach(sx => { const c = M(new THREE.BoxGeometry(.35, .55, .5), dark, sx * (RL / 2 - .3), top + RH + .3, 0); c.rotation.z = sx * -.35; g.add(c); });
  // 박공 (옆면 삼각벽)
  const tri = new THREE.Shape(); tri.moveTo(-D / 2 - .1, 0); tri.lineTo(D / 2 + .1, 0); tri.lineTo(0, RH * .95); tri.lineTo(-D / 2 - .1, 0);
  [-1, 1].forEach(sx => { const t = M(new THREE.ShapeGeometry(tri), std(0x8a5a36, {side:THREE.DoubleSide}), sx * (L / 2 + .1), top - .05, 0, false); t.rotation.y = Math.PI / 2; g.add(t); });
  g.scale.setScalar(scaleK);
  return g;
}

const GR = {'특':3, '상':2, '보통':1, '하':0};
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return w + (c >= 0 && c % 28 ? a : b); };
function ensureState(s){
  s.own = s.own || {}; s.rep = s.rep || 0; s.unl = s.unl || {}; s.ach = s.ach || {}; s.dex = s.dex || {};

const ORDER_T = [

];
const OT = id => ORDER_T.find(o => o.id === id);
function genOrders(){
  const bear = allTrees().filter(({t}) => bearing(t)).map(({t}) => t);
  S.orders = [];
  ORDER_T.forEach(o => {
    const elig = o.vs ? bear.filter(t => o.vs.includes(t.v)).length : bear.length;
    if(!elig) return;
    S.orders.push({id:o.id, n:clamp(Math.round(elig * o.f * rnd(.8, 1.2)), 3, 60), state:'open'});
  });
}
const orderLots = o => { const T = OT(o.id); return S.boxes.filter(b => (!T.vs || T.vs.includes(b.v)) && GR[b.g] >= GR[T.g]); };
const orderHave = o => orderLots(o).reduce((a, b) => a + b.n, 0);
const dueText = w => { const d = weekDate(w); return `${d.m}월 ${d.wk}주`; };
function openOrders(){
  const rows = S.orders.length ? S.orders.map((o, i) => {
    const T = OT(o.id), have = orderHave(o);
    const vs = T.vs ? T.vs.map(k => VAR[k].name).join('·') : '아무 품종';
    const st = o.state === 'done' ? '<button class="btn sub" disabled>완료</button>' : o.state === 'miss' ? '<button class="btn sub" disabled>놓침</button>'
      : `<button class="btn" data-dv="${i}" ${have < o.n ? 'disabled' : ''}>${have < o.n ? `창고 ${have}/${o.n}` : '납품하기'}</button>`;
    return `<div class="bcard"><div class="i">${T.who.split(' ')[0]}</div><div class="tx"><b>${T.who.slice(T.who.indexOf(' ') + 1)} · ${o.n}상자</b>
      <small>${vs} · ${T.g}등급 이상 · ${dueText(T.due)}까지<br>보상: 경매값 + 상자당 ${won(T.per)} 웃돈, 평판 +${T.rep}</small></div>${st}</div>`;
  }).join('') : `<p>${S.year === 1 ? '올해 심은 나무는 내년부터 열매를 맺어요. 주문은 <b>2년차</b>부터 들어와요.' : '올해는 맞출 수 있는 주문이 없어요. 나무를 더 심어 보세요.'}</p>`;
  modal('📦 주문 의뢰', `<p>약속한 날짜까지 품종과 등급을 맞춰 보내면 웃돈과 평판을 받아요. 평판 <b>⭐ ${S.rep}</b>. 날짜를 놓치면 평판이 3 떨어져요.</p>${rows}
    <div class="row"><button class="btn sub" data-close>닫기</button></div>`,
  c => c.querySelectorAll('[data-dv]').forEach(b => b.onclick = () => deliver(+b.dataset.dv)));
}
function deliver(i){
  const o = S.orders[i], T = OT(o.id);
  if(o.state !== 'open' || orderHave(o) < o.n) return;
  const lots = orderLots(o).sort((a, b) => GR[a.g] - GR[b.g]);
  let need = o.n, pay = 0;
  for(const b of lots){ const k = Math.min(need, b.n); pay += boxPrice(b.v, b.g) * k; b.n -= k; need -= k; if(!need) break; }
  S.boxes = S.boxes.filter(b => b.n > 0);
  const bonus = T.per * o.n; S.money += pay + bonus; S.earned += pay + bonus; o.state = 'done'; S.stat.orders++;
  addRep(T.rep); save(); rebuildCrates(); renderUI();
  modal('📦 납품 완료', `<p>${T.who} ${o.n}상자를 보냈어요. 사과값 <b class="num">${won(pay)}</b> + 웃돈 <b class="num">${won(bonus)}</b>. 평판이 ${T.rep} 올랐어요!</p><div class="row"><button class="btn" id="bk">주문 목록</button></div>`, c => c.querySelector('#bk').onclick = openOrders);
}
function orderWeek(w, lines){
  S.orders.forEach(o => { const T = OT(o.id); if(o.state === 'open' && w >= T.due){ o.state = 'miss'; addRep(-3); lines.push(`📦 ${T.who} 주문 날짜를 놓쳤어요. 평판 −3`); } });
}

/* ---- 수확 기록 (도감·품평회) ---- */
function onHarvest(v, g, n, q){
  const d = S.dex[v] = S.dex[v] || {n:0, best:'하'};
  d.n += n; if(GR[g] > GR[d.best]) d.best = g;
  S.stat.boxes += n; if(g === '특') S.stat.teuk += n;
  if(!S.yb || q > S.yb.q) S.yb = {q, v};
}

function makeDrone(){

function makeEfence(){
  const g = new THREE.Group(), x0 = -RULE.rowLen / 2 - 3.2, x1 = RULE.rowLen / 2 + 3.2, z0 = PITCH / 2 + 1.6, z1 = rowZ(S.rows - 1) - PITCH / 2 - 1.6;
  const wire = std(0xffd23f, {emissive:0x6b5300}), post = std(0x8a8d92), ins = std(0xff8a3d);
  [[x0, z0, x1, z0], [x1, z0, x1, z1], [x1, z1, x0, z1], [x0, z1, x0, z0 - 1]].forEach(([a, b, c, e]) => {
    const L = Math.hypot(c - a, e - b), ang = Math.atan2(e - b, c - a);
    [.35, .7].forEach(y => { const w = M(new THREE.CylinderGeometry(.018, .018, L, 4), wire, (a + c) / 2, y, (b + e) / 2, false); w.rotation.z = Math.PI / 2; w.rotation.y = -ang; g.add(w); });
    for(let t = 0; t <= L; t += 4){ const px = a + (c - a) * t / L, pz = b + (e - b) * t / L; g.add(M(new THREE.CylinderGeometry(.04, .04, .9, 6), post, px, .45, pz)); g.add(M(new THREE.SphereGeometry(.06, 6, 5), ins, px, .7, pz, false)); }

  const sign = M(new THREE.BoxGeometry(.6, .4, .04), std(0xffd23f), x0 + 1.5, .7, z0, false); g.add(sign);

}
function makeNet(){

/* ================== 1인칭 SS기 운전 방제 (벌레 잡기 + 장애물 피하기) ================== */

}
function sprayPoints(){

  for(let k = 0; k <= S.rows; k++){ const z = PITCH / 2 - k * PITCH; if(k % 2) pts.push([xs, z], [-xs, z]); else pts.push([-xs, z], [xs, z]); }

function makeHood(){

function pathAt(d, s){

function startDrive(f, i, n){
  closeModal();

  const pts = sprayPoints(), segs = []; let s = 0;

    const a = pts[k], b = pts[k + 1], len = Math.hypot(b[0] - a[0], b[1] - a[1]); if(len < .01) continue;
    segs.push({a, b, len, s0:s, s1:s + len, dx:(b[0] - a[0]) / len, dz:(b[1] - a[1]) / len, field:Math.abs(a[1] - b[1]) < .01 && a[1] <= PITCH / 2 + .01 && Math.abs(a[0]) > 10});

  const d = drive = {f, i, n, segs, total, s:0, t:0, wait:.9, lat:0, SPD, dur, obs:[], hits:0, dodged:0, bugs:0, caught:0, shake:0, auto:auto};
  // 장애물: 과수원 안 줄 사이 길에만

  const kinds = ['rock', 'branch', 'box', 'rabbit'];
  segs.forEach(g => {
    if(!g.field) return;
    let along = 8;
    while(along < g.len - 3){
      const kind = pick(kinds), lat = pick([-1, 0, 1]);
      const o = {kind, s:g.s0 + along, lat, base:lat, done:false, ph:Math.random() * 6};
      const m = new THREE.Group();
      if(kind === 'rock'){ const r = M(new THREE.DodecahedronGeometry(.45, 0), std(0x9a9590, {flatShading:true}), 0, .3, 0); r.scale.y = .7; m.add(r); }
      if(kind === 'branch'){ const b = M(new THREE.CylinderGeometry(.08, .12, 1.6, 6), std(0x7a4a2a), 0, .12, 0); b.rotation.z = Math.PI / 2; b.rotation.y = rnd(-.4, .4); m.add(b); m.add(M(new THREE.SphereGeometry(.22, 8, 6), std(0x5f9a3a), .6, .25, 0)); }
      if(kind === 'box'){ m.add(M(new THREE.BoxGeometry(.6, .4, .45), std(0xd99a5a), 0, .2, 0)); for(let q = 0; q < 4; q++) m.add(M(new THREE.SphereGeometry(.08, 8, 6), std(0xd8323a), -.18 + q * .12, .44, 0, false)); }
      if(kind === 'rabbit'){
        const w = std(0xf8f4ee); m.add(M(new THREE.SphereGeometry(.22, 10, 8), w, 0, .22, 0)); m.add(M(new THREE.SphereGeometry(.14, 10, 8), w, 0, .42, .14));
        [-.05, .05].forEach(x => { const e = M(new THREE.CylinderGeometry(.035, .035, .26, 6), w, x, .6, .12); e.rotation.x = -.2; m.add(e); });
        [-.05, .05].forEach(x => m.add(M(new THREE.SphereGeometry(.02, 6, 4), std(0x222222), x, .45, .27, false)));

        const ring = M(new THREE.TorusGeometry(.55, .04, 6, 20), new THREE.MeshBasicMaterial({color:0xffe066, transparent:true, opacity:.8}), 0, .9, 0, false); ring.rotation.x = Math.PI / 2; bm.add(ring);

function pop(t, cls){ const el = $('dpop'); el.textContent = t; el.className = cls; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
function updateDriveHud(){
  const d = drive; if(!d) return;
  $('dsc').textContent = `🐛 벌레 잡기 ${d.caught} / ${d.bugs} · 🪨 부딪힘 ${d.hits}`;

function updateDrive(dt){

  else { d.t += dt; d.s = Math.min(d.total, d.s + d.SPD * dt); }
  // 조향
  let steer = 0;
  if(d.auto || auto){
    const ahead = d.obs.filter(o => !o.done && !o.bug && o.s > d.s && o.s - d.s < 9);
    const bugA = d.obs.find(o => !o.done && o.bug && o.s > d.s && o.s - d.s < 9);
    let want = bugA ? bugA.lat * 1.0 : 0;
    if(ahead.length && !(bugA && bugA.s < ahead[0].s)){ const o = ahead[0], c = [-1.2, 0, 1.2].filter(l => Math.abs(l - o.lat) > 1); want = c.sort((a, b) => Math.abs(a - d.lat) - Math.abs(b - d.lat))[0]; }

      if(o.done) return;
      if(Math.abs(o.s - d.s) < .8 && Math.abs(o.lat - d.lat) < .85){ o.done = true; d.caught++; pop('벌레 퇴치!', 'g'); beep(880, .07, 'triangle'); const pp = pathAt(d, o.s); for(let q = 0; q < 6; q++) emitMist(pp.x - pp.dz * o.lat, pp.z + pp.dx * o.lat, Math.atan2(-pp.dz, pp.dx)); o.mesh.visible = false; updateDriveHud(); }

      if(!pruned && !young && k % 5 === 4){ /* 안 자른 웃자란 가지 */ }
      _q.setFromUnitVectors(UP, b.dir);
      _m.compose(b.base, _q, _s.set(b.r, b.len * (young ? .5 : 1), b.r)); set('branch', _t.multiplyMatrices(base, _m));
    });
    if(!pruned && !young){ // 웃자란 가지: 가지치기 전엔 위로 솟은 가지가 보여요
      [0, 1].forEach(k => { const d = new THREE.Vector3(Math.cos(k * 3 + r), 3, Math.sin(k * 3 + c)).normalize(); _q.setFromUnitVectors(UP, d); _m.compose(_v.set(0, 1.2 + k * .5, 0), _q, _s.set(.012, 1.1, .012)); set('branch', _t.multiplyMatrices(base, _m)); });
    }
    if(leafOn){
      const ls = young ? T.leaves.slice(-4) : T.leaves;
      ls.forEach((L, k) => {
        _m.compose(L.p, _q.setFromAxisAngle(UP, k), _s.set(L.s * leafSize, L.s * .72 * leafSize, L.s * leafSize));
        _c.setHex(leafCol[k % 2]); _c.offsetHSL(0, 0, ((k * 37) % 10 - 5) / 120);
        set('leaf', _t.multiplyMatrices(base, _m), _c);
      });
    }
    if(young || !bearing(t)) return;
    // blossoms 16~19주
    if(w >= 16 && w <= 19){
      const n = t.thinF ? Math.floor(T.spots.length * .4) : T.spots.length;
      T.spots.slice(0, n).forEach((p, k) => {
        const reps = t.thinF ? 1 : 3;
        for(let j = 0; j < reps; j++){ _m.compose(_v.set(p.x + (j - 1) * .06, p.y + .1 + (j % 2) * .04, p.z), _q.identity(), _s.setScalar(.05)); _c.setHex(j === 1 ? 0xffd9e3 : 0xfffafa); set('blossom', _t.multiplyMatrices(base, _m), _c); }
      });
    }
    // fruit 20주~수확
    const V = VAR[t.v];
    if(w >= 20 && !t.harvested && t.fruit !== false && w <= V.harvest[1]){
      const thinned = t.thinFr;
      const n = thinned ? Math.floor(T.spots.length * .55) : T.spots.length;
      const grow = clamp((w - 19) / (V.harvest[0] - 19), 0, 1);
      const rad = (.03 + grow * .06) * (thinned ? 1.1 : .8);
      const ripe = clamp((w - (V.harvest[0] - 7)) / 7, 0, 1);
      T.spots.slice(0, n).forEach((p, k) => {
        _m.compose(p, _q.identity(), _s.set(rad, rad * .9, rad));
        _c.setHex(0x9cc24a).lerp(new THREE.Color(k % 3 ? V.a : V.b), ripe);
        set('apple', _t.multiplyMatrices(base, _m), _c);
      });
    }
  });
  // saplings planted this year: little leaf tufts
  Object.keys(counts).forEach(n => { inst[n].count = counts[n]; inst[n].instanceMatrix.needsUpdate = true; if(inst[n].instanceColor) inst[n].instanceColor.needsUpdate = true; });
}
function rebuildCrates(){

  for(let i = 0; i < n; i++){ const col = i % 6, lay = Math.floor(i / 6) % 5, row = Math.floor(i / 30); o.position.set(-20 + col * .65, .18 + lay * .36, 21 + row * .45); o.updateMatrix(); crates.setMatrixAt(i, o.matrix); }

/* ================== input & camera ================== */
const keys = {};
let camYaw = 0, camPitch = .7, camDist = 34, moveTarget = null, dragging = null;
function bindInput(cv){
  addEventListener('keydown', e => {
    if(drive){ const k = e.key.toLowerCase(); keys[k] = true; if([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault(); return; }
    if(!$('modal').hidden) { if(e.key === 'Escape') closeModal(); return; }
    const k = e.key.toLowerCase();
    keys[k] = true;
    if(['w','a','s','d'].includes(k)) moveTarget = null;
    if(k === 'f' && !e.repeat) doAction();
    if(k === 'n' && !e.repeat) nextWeek();
    const t = TOOLS.find(t => t.key === k); if(t) selectTool(t.id);
    if([' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));
  const pts = new Map(); let pinch = null;
  cv.addEventListener('pointerdown', e => {
    cv.focus(); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 2){ const [a, b] = [...pts.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), dist:camDist}; dragging = null; return; }
    dragging = {x:e.clientX, y:e.clientY, yaw:camYaw, pitch:camPitch, moved:false}; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size === 2){ const [a, b] = [...pts.values()]; camDist = clamp(pinch.dist * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 9, 70); }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) pinch = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointermove', e => {
    if(!dragging) return;
    const dx = (e.clientX - dragging.x) / scale, dy = (e.clientY - dragging.y) / scale;
    if(Math.hypot(dx, dy) > 6) dragging.moved = true;
    if(dragging.moved){ camYaw = dragging.yaw - dx * .006; camPitch = clamp(dragging.pitch + dy * .004, .25, 1.35); }
  });
  cv.addEventListener('pointerup', e => {
    if(dragging && !dragging.moved){
      const r = cv.getBoundingClientRect();
      const ndc = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
      const ray = new THREE.Raycaster(); ray.setFromCamera(ndc, cam);
      const p = new THREE.Vector3(); if(ray.ray.intersectPlane(new THREE.Plane(UP, 0), p)) moveTarget = {x:clamp(p.x, -60, 60), z:clamp(p.z, -150, 40)};
    }
    dragging = null;
  });
  cv.addEventListener('wheel', e => { camDist = clamp(camDist * (e.deltaY > 0 ? 1.1 : .9), 9, 70); e.preventDefault(); }, {passive:false});
}
function currentRow(){
  const z = S.farmer.z, r = Math.round(-z / PITCH);
  if(r < 0 || r >= S.rows) return null;
  if(Math.abs(S.farmer.x) > RULE.rowLen / 2 + 4) return null;
  if(Math.abs(z - rowZ(r)) > PITCH / 2 + .01) return null;
  return r;
}
function nearExpansion(){ return S.rows < RULE.maxRows && Math.abs(S.farmer.z - rowZ(S.rows)) < PITCH / 2 && Math.abs(S.farmer.x) < RULE.rowLen / 2 + 4; }

/* ================== actions ================== */
function toast(html, ms = 6000){ $('toasttxt').innerHTML = html; $('toast').style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').style.opacity = .0, ms); }
function selectTool(id){ S.tool = id; renderUI(); const t = TOOLS.find(x => x.id === id); toast(`<b>${t.name}</b>: ${TIP[id]}`); }
function rowEligible(tool, r){
  const out = [];
  for(let c = 0; c < RULE.perRow; c++){
    const t = S.trees[tkey(r, c)];
    if(tool === 'plant'){ if(!t) out.push(c); continue; }
    if(!t) continue;
    if(tool === 'prune' && !t.pruned) out.push(c);
    if(tool === 'flower' && bearing(t) && !t.thinF) out.push(c);
    if(tool === 'fruit' && bearing(t) && !t.thinFr && t.fruit !== false) out.push(c);
    if(tool === 'harvest' && isRipe(t)) out.push(c);
  }
  return out;
}
function toolWindow(tool){
  const w = S.week;
  if(tool === 'plant') return inWin(w, WIN.plant) || inWin(w, WIN.plant2);
  if(tool === 'prune') return inWin(w, WIN.prune);
  if(tool === 'flower') return inWin(w, WIN.flower);
  if(tool === 'fruit') return inWin(w, WIN.fruit);
  if(tool === 'harvest') return Object.values(VAR).some(v => inWin(w, v.harvest));
  if(tool === 'spray') return true;
  return false;
}
function doAction(){
  const np = nearNPC(); if(np) return talk(np);
  const tool = S.tool;
  if(tool === 'spray') return openSpray();
  if(nearExpansion()) return openExpand();
  const r = currentRow();
  if(r === null) return toast('과수원 안 <b>줄</b> 가까이로 가서 F를 눌러요. 지금 서 있는 줄이 노란 테두리로 표시돼요.');
  if(!toolWindow(tool)) return toast(`지금은 <b>${TOOLS.find(t => t.id === tool).name}</b> 시기가 아니에요. ${windowText(tool)}`);
  const list = rowEligible(tool, r);
  if(!list.length) return toast(`${r + 1}번 줄은 이미 다 했거나 할 나무가 없어요.`);
  const T = TOOLS.find(t => t.id === tool);
  let done = 0, boxes = 0;
  for(const c of list){
    if(S.hours < T.hours) break;
    if(tool === 'plant'){ if(!unlocked(S.variety)) break; if(S.money < RULE.seedling) break; S.money -= RULE.seedling; S.spent += RULE.seedling; S.trees[tkey(r, c)] = {v:S.variety, y0:S.year, q:70, pruned:true, thinF:false, thinFr:false, harvested:false}; }
    else {
      const t = S.trees[tkey(r, c)];
      if(tool === 'prune'){ t.pruned = true; t.q = clamp(t.q + 5, 0, 100); }
      if(tool === 'flower'){ t.thinF = true; t.q = clamp(t.q + 6, 0, 100); }
      if(tool === 'fruit'){ t.thinFr = true; t.q = clamp(t.q + 10, 0, 100); }
      if(tool === 'harvest'){
        t.harvested = true;
        const p3 = clamp((t.q - 62) / 45, 0, .7), p1 = clamp((78 - t.q) / 40, 0, .7);
        const x = Math.random(); let n = x < p1 ? 1 : x < 1 - p3 ? 2 : 3;
        if(!t.thinFr) n = Math.max(1, n - 1);
        const qq = clamp(t.q + rnd(-4, 4), 0, 100), g = gradeOf(qq).name; onHarvest(t.v, g, n, qq);
        const lot = S.boxes.find(b => b.v === t.v && b.g === g); if(lot) lot.n += n; else S.boxes.push({v:t.v, g, n});
        boxes += n;
      }
    }
    S.hours = Math.round((S.hours - T.hours) * 100) / 100; done++;
  }
  if(!done) return toast(S.hours < T.hours ? '이번 주 일손이 다 떨어졌어요. <b>인부</b>를 쓰거나 <b>다음 주</b>로 넘어가요.' : '돈이 모자라요.');
  const left = list.length - done;
  let msg = tool === 'plant' ? `${r + 1}번 줄에 <b>${VAR[S.variety].name}</b> 묘목 ${done}그루를 심었어요 (−${won(done * RULE.seedling)}).`
    : tool === 'harvest' ? `${r + 1}번 줄에서 ${done}그루, <b>${boxes}상자</b>를 땄어요.`
    : `${r + 1}번 줄 ${done}그루 <b>${T.name}</b> 끝!`;
  if(left) msg += ` 일손이나 돈이 모자라 ${left}그루는 못 했어요.`;
  toast(msg + ' ' + TIP[tool]);
  save(); rebuildTrees(); rebuildCrates(); buildLabels(); renderUI();
}
function windowText(tool){
  const f = ([a, b]) => { const A = weekDate(a), B = weekDate(b); return `${A.m}월 ${A.wk}주~${B.m}월 ${B.wk}주`; };
  if(tool === 'plant') return `묘목 심기는 ${f(WIN.plant)}, ${f(WIN.plant2)}에 해요.`;
  if(tool === 'harvest') return '수확 시기: ' + Object.values(VAR).map(v => `${v.name} ${f(v.harvest)}`).join(', ');

function applySpray(f, i, n, mult = 1, extra = 0, qb = 0){
  const wx = wxNow();
  const eff = (wx.wind >= 5 && !own('drone') ? .5 : 1) * mult, until = (wx.rain >= 60 ? S.week : S.week + 1) + extra;
  if(f){ S.prot.fung = until; S.prot.fungE = eff; }
  if(i){ S.prot.ins = until; S.prot.insE = eff; }
  if(n && S.nutr < 4){ S.nutr++; allTrees().forEach(({t}) => { if(bearing(t)) t.q = clamp(t.q + 1.5, 0, 100); }); }
  if(qb) allTrees().forEach(({t}) => { if(bearing(t)) t.q = clamp(t.q + qb, 0, 100); });
  if(S.sprays > RULE.sprayMax){ allTrees().forEach(({t}) => { if(bearing(t)) t.q = clamp(t.q - 2, 0, 100); }); }
  return [wx.wind >= 5 && !own('drone') ? '바람이 세서 효과가 절반이에요.' : '', wx.rain >= 60 ? '비 때문에 이번 주만 효과가 있어요.' : ''].filter(Boolean).join(' ');
}
function spray(f, i, n){
  const cost = sprayCost();
  S.money -= cost; S.spent += cost; S.sprays++; S.stat.sprays++;
  const note = applySpray(f, i, n);
  const kinds = [f && '살균제', i && '살충제', n && '영양제'].filter(Boolean).join('+');
  toast(`🚜 ${kinds} ${S.sprays}회째 자동 방제를 시작해요 (−${won(cost)}). ${note || '이번 주와 다음 주까지 막아줘요.'}`);
  startSprayRun();
  save(); renderUI();
}
function startSprayRun(){
  const pts = [], xs = RULE.rowLen / 2 + 2;

  pts.unshift([-20, 12], [-xs, 12], [-xs, PITCH / 2]);
  pts.push([pts[pts.length - 1][0], 12], [-20, 12]);
  sprayer.userData.path = pts; sprayer.userData.t = 0; sprayer.userData.seg = 0;
}

function runAuction(sum){

    S.earned += sum; save(); rebuildCrates(); renderUI();

/* ---- week flow ---- */
function nextWeek(){
  if(sprayer.userData.path) return toast('SS기가 아직 약을 뿌리는 중이에요.');
  const w = S.week, wx = wxNow(), lines = [], bear = allTrees().filter(({t}) => bearing(t));
  const hit = (amt, list = bear) => list.forEach(({t}) => t.q = clamp(t.q - amt, 0, 100));
  if(inWin(w, WIN.spray) && bear.length){
    if(wx.disease >= 50){
      const name = w >= 26 && w <= 33 ? '탄저병' : pick(['갈색무늬병', '탄저병', '겹무늬썩음병']);
      let d = Math.round((wx.disease - 40) / 5); const p = w <= S.prot.fung ? S.prot.fungE : 0; d = Math.round(d * (1 - p));
      if(d > 0){ hit(d); lines.push(`🦠 비가 잦아 <b>${name}</b>이 돌았어요. 품질 −${d}${p ? ' (살균제로 절반 막음)' : ''}`); }
      else lines.push(`🦠 ${name} 위험이 높았지만 살균제 덕분에 무사해요.`);
    }
    if(wx.pest >= 50){
      const name = pick(['진딧물', '응애', '복숭아순나방']);
      let d = Math.round((wx.pest - 40) / 6); const p = w <= S.prot.ins ? S.prot.insE : 0; d = Math.round(d * (1 - p));
      if(d > 0){ hit(d); lines.push(`🐛 <b>${name}</b>가 늘었어요. 품질 −${d}${p ? ' (살충제로 절반 막음)' : ''}`); }
      else lines.push(`🐛 ${name}가 늘 때였지만 살충제 덕분에 무사해요.`);
    }
  }
  if(wx.ev === 'typhoon' && bear.length){
    const unh = bear.filter(({t}) => !t.harvested && t.fruit !== false);
    unh.forEach(({t}) => { if(Math.random() < (own('net') ? .1 : .25)) t.fruit = false; else t.q = clamp(t.q - 4, 0, 100); });
    lines.push(`🌀 <b>태풍</b>(${wx.wind}m/s)이 지나갔어요. 일부 나무의 사과가 떨어졌어요(낙과).`);
  }
  if(wx.ev === 'hail' && bear.length){ if(own('net')) lines.push('🧊 우박이 내렸지만 <b>우박 방지망</b> 덕분에 무사해요.'); else { hit(8); lines.push('🧊 <b>우박</b>이 내려 사과에 상처가 났어요. 품질 −8'); } }
  if(wx.ev === 'frost' && bear.length){ if(own('fan')) lines.push('❄️ 늦서리가 왔지만 <b>방상팬</b>이 돌아 꽃이 무사해요.'); else { hit(6); lines.push('❄️ <b>늦서리</b>가 내려 꽃이 얼었어요. 품질 −6'); } }
  orderWeek(w, lines);
  // 시기 마감 처리
  if(w === WIN.prune[1]){ const n = allTrees().filter(({t}) => !t.pruned); n.forEach(({t}) => { t.pruned = true; if(bearing(t)) t.q = clamp(t.q - 6, 0, 100); }); if(n.length) lines.push(`✂️ 가지치기 못 한 나무 ${n.length}그루: 햇빛이 덜 들어 품질 −6`); }
  if(w === WIN.flower[1]){ const n = bear.filter(({t}) => !t.thinF); hit(8, n); if(n.length) lines.push(`🌸 꽃솎기 못 한 나무 ${n.length}그루: 열매가 작아져요. 품질 −8`);
    if(own('hive') && bear.length){ hit(-2 * own('hive')); lines.push(`🐝 꿀벌 ${own('hive')}통이 꽃가루받이를 도왔어요. 품질 +${2 * own('hive')}`); } }
  if(w === WIN.fruit[1]){ const n = bear.filter(({t}) => !t.thinFr); hit(12, n); if(n.length) lines.push(`🍏 열매솎기 못 한 나무 ${n.length}그루: 사과가 작고 상자 수가 줄어요. 품질 −12`); }
  Object.entries(VAR).forEach(([k, v]) => { if(w === v.harvest[1]){ const n = bear.filter(({t}) => t.v === k && !t.harvested && t.fruit !== false); n.forEach(({t}) => t.fruit = false); if(n.length) lines.push(`🍂 ${v.name} ${n.length}그루를 제때 못 따서 사과가 떨어졌어요.`); } });

  S.week++; S.hours = weekHours(); S.day = 0; S.tod = 0;
  if(S.week > 47) return yearEnd(lines);
  afterWeek(lines);
}
function afterWeek(lines){
  save(); rebuildTrees(); seasonLook(); buildLabels(); renderUI();
  const d = weekDate(S.week), wx = wxNow();
  const head = `${d.m}월 ${d.wk}주가 됐어요. ${wx.icon} ${wx.temp}°C, ${DIRS[wx.dir]}풍 ${wx.wind}m/s.`;
  if(lines.length) modal('📅 지난주 소식', `<p>${head}</p><ul style="margin:0;padding-left:1.1em">${lines.map(l => `<li>${l}</li>`).join('')}</ul><div class="row"><button class="btn" data-close>확인</button></div>`);

}
function seasonHint(){
  const w = S.week;
  if(inWin(w, WIN.prune)) return '겨울~이른 봄엔 <b>가지치기</b>를 해요.';
  if(inWin(w, WIN.flower)) return '사과꽃이 폈어요. <b>꽃솎기</b> 시기예요.';

let lastPrompt = '';
function updatePrompt(){
  let html;
  const T = TOOLS.find(t => t.id === S.tool);
  const np = nearNPC();
  if(np) html = `<kbd>F</kbd> ${josa(NPCS[np].name, '과', '와')} 이야기하기`;
  else if(S.tool === 'spray') html = `<kbd>F</kbd> SS기로 과수원 전체 방제 · ${won(sprayCost())}`;
  else if(nearExpansion()) html = `<kbd>F</kbd> 이 땅 사서 밭 넓히기 · ${won(Math.round(rowPyeong) * RULE.pyeongPrice)}`;
  else {
    const r = currentRow();
    if(r === null) html = '과수원 줄 가까이 가면 작업할 수 있어요';
    else {
      const n = rowEligible(S.tool, r).length;
      html = !toolWindow(S.tool) ? `${r + 1}번 줄 · 지금은 ${T.name} 시기가 아니에요`
        : n ? `<kbd>F</kbd> ${r + 1}번 줄 ${S.tool === 'plant' ? VAR[S.variety].name + ' ' : ''}${T.name} · ${n}그루 · ${Math.round(n * T.hours * 10) / 10}시간${S.tool === 'plant' ? ' · ' + won(n * RULE.seedling) : ''}`
        : `${r + 1}번 줄 · ${T.name} 할 나무가 없어요`;
    }
  }
  if(html !== lastPrompt){ $('prompt').innerHTML = html; lastPrompt = html; }
}
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tool]'); if(tb){ selectTool(tb.dataset.tool); $('c').focus(); return; }
  const vb = e.target.closest('[data-var]'); if(vb){ if(!unlocked(vb.dataset.var)){ toast(`🔒 <b>${VAR[vb.dataset.var].name}</b>은 평판 ${VAR[vb.dataset.var].lock}이 되면 심을 수 있어요. 주문을 지키고 업적을 모아 평판을 올려요.`); return; } S.variety = vb.dataset.var; save(); renderUI(); toast(`<b>${VAR[S.variety].name}</b>: ${VAR[S.variety].desc}`); $('c').focus(); return; }
  const sp = e.target.closest('[data-spd]'); if(sp){ tspeed = +sp.dataset.spd; renderUI(); $('c').focus(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act === 'market') openMarket();
  if(a.dataset.act === 'expand') openExpand();
  if(a.dataset.act === 'worker') hireWorker();
  if(a.dataset.act === 'build') openBuild();
  if(a.dataset.act === 'orders') openOrders();
  if(a.dataset.act === 'dex') openDex();
  if(a.dataset.act === 'saveio') openSaveIO();
  if(a.dataset.act === 'auto') toggleAuto();
  if(a.dataset.act === 'next') nextWeek();
  if($('modal').hidden) $('c').focus();
});

/* ---- row labels ---- */
let labelEls = [];
function buildLabels(){
  $('labels').innerHTML = '';
  labelEls = [];
  for(let r = 0; r < S.rows; r++){
    const el = document.createElement('div'); el.className = 'rl plank txt';
    const ts = []; for(let c = 0; c < RULE.perRow; c++){ const t = S.trees[tkey(r, c)]; if(t) ts.push(t); }
    const names = [...new Set(ts.map(t => VAR[t.v].name))];
    el.textContent = `${r + 1}줄 · ${ts.length ? names.join('·') + ' ' + ts.length + '그루' : '빈 줄'}`;
    $('labels').appendChild(el); labelEls.push({el, r});
  }
  if(S.rows < RULE.maxRows){ const el = document.createElement('div'); el.className = 'rl plank txt'; el.textContent = `🧱 넓힐 수 있는 땅 · ${won(Math.round(rowPyeong) * RULE.pyeongPrice)}`; $('labels').appendChild(el); labelEls.push({el, r:S.rows}); }
}

/* ================== loop ================== */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), frame = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; frame++;
  // movement
  tickTime(dt); botTick(dt);
  let mx = 0, mz = 0;
  if(keys.w || keys.arrowup) mz -= 1; if(keys.s || keys.arrowdown) mz += 1; if(keys.a || keys.arrowleft) mx -= 1; if(keys.d || keys.arrowright) mx += 1;
  if(joy.on && (Math.abs(joy.x) > .15 || Math.abs(joy.y) > .15)){ mx = joy.x; mz = joy.y; moveTarget = null; }
  if(drive){ mx = mz = 0; moveTarget = null; }
  const P = S.farmer; let moving = false, speed = auto ? 7 : keys.shift ? 9 : 5;
  if(mx || mz){
    const l = joy.on ? Math.max(1, Math.hypot(mx, mz)) : Math.hypot(mx, mz); mx /= l; mz /= l;
    const sx = Math.cos(camYaw), sz = -Math.sin(camYaw); // camera right vector
    const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
    const dx = sx * mx - fx * mz, dz = sz * mx - fz * mz;
    P.x += dx * speed * dt; P.z += dz * speed * dt; farmer.rotation.y = Math.atan2(dx, dz); moving = true;
  } else if(moveTarget){
    const dx = moveTarget.x - P.x, dz = moveTarget.z - P.z, d = Math.hypot(dx, dz);
    if(d < .15) moveTarget = null; else { const s = Math.min(d, speed * dt); P.x += dx / d * s; P.z += dz / d * s; farmer.rotation.y = Math.atan2(dx, dz); moving = true; }
  }
  P.x = clamp(P.x, -60, 60); P.z = clamp(P.z, -150, 40);
  farmer.position.set(P.x, 0, P.z);
  const u = farmer.userData;
  if(moving){ u.phase += dt * speed * 2.2; } else u.phase *= .85;
  const sw = Math.sin(u.phase) * (moving ? .7 : 0);
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * .8; u.armR.rotation.x = sw * .8;
  u.body.position.y = moving ? Math.abs(Math.sin(u.phase)) * .06 : (reduced ? 0 : Math.sin(now / 600) * .01);
  // camera
  const tx = P.x, tz = P.z;
  cam.position.set(tx + Math.sin(camYaw) * Math.cos(camPitch) * camDist, Math.sin(camPitch) * camDist + 1, tz + Math.cos(camYaw) * Math.cos(camPitch) * camDist);
  cam.lookAt(tx, 1.2, tz);
  sunByTime(tx, tz);
  // row frame
  const r = currentRow();
  rowFrame.visible = r !== null && S.tool !== 'spray' && !drive; if(r !== null) rowFrame.position.set(0, 0, rowZ(r));
  // sprayer
  const sp = sprayer.userData;
  if(sp.path){
    const a = sp.path[sp.seg], b = sp.path[sp.seg + 1];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || .01;
    if(!sp.spd){ let L = 0; for(let k = 0; k < sp.path.length - 1; k++) L += Math.hypot(sp.path[k + 1][0] - sp.path[k][0], sp.path[k + 1][1] - sp.path[k][1]); sp.spd = L / 3; }
    sp.t += dt * sp.spd / len;
    if(sp.t >= 1){ sp.t = 0; sp.seg++; if(sp.seg >= sp.path.length - 1){ sp.path = null; sp.spd = 0; sprayer.position.set(-20, 0, 12); sprayer.rotation.y = Math.PI / 2; toast('🚜 방제를 마쳤어요. 약이 잘 묻었는지 날씨를 확인해요.'); } }
    if(sp.path){
      const x = a[0] + (b[0] - a[0]) * sp.t, z = a[1] + (b[1] - a[1]) * sp.t;
      sprayer.position.set(x, 0, z); sprayer.rotation.y = Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
      if(z < PITCH / 2 + .1 && z > rowZ(S.rows - 1) - PITCH / 2 - .1) emitMist(x, z, sprayer.rotation.y);
    }
  }
  if(drive) updateDrive(dt);
  updateMist(dt);
  bldAnim.forEach(o => { if(o.userData.blades) o.userData.blades.rotation.z += dt * (inWin(S.week, [14, 18]) ? 9 : 1.5); if(o.userData.tail) o.userData.tail.rotation.y = Math.sin(now / 120) * .6; });
  R.render(scene, cam);
  // labels
  if(frame % 2 === 0){
    labelEls.forEach(({el, r: rr}) => {
      _v.set(-RULE.rowLen / 2 - 1.5, 1.2, rowZ(rr)).project(cam);
      if(_v.z > 1){ el.style.display = 'none'; return; }
      el.style.display = ''; el.style.transform = `translate(${(_v.x * .5 + .5) * SW}px, ${(-_v.y * .5 + .5) * SH}px) translate(-100%, -50%)`;
      el.classList.toggle('cur', rr === r);
    });
    updateNPCs();
    updatePrompt();
    const ck = $('clk'); if(ck) ck.textContent = '🕐 ' + clockText();
  }
  requestAnimationFrame(loop);
}
function emitMist(x, z, ry){
  const m = mist.userData, pos = mist.geometry.attributes.position, N = pos.count;
  for(let k = 0; k < 6; k++){
    const i = m.i = (m.i + 1) % N, side = k % 2 ? 1 : -1;
    pos.setXYZ(i, x - Math.cos(ry) * 2, 1, z + Math.sin(ry) * 2);
    m.vel.set([side * Math.sin(ry) * rnd(2, 4) + rnd(-.5, .5), rnd(1, 3), side * Math.cos(ry) * rnd(2, 4) + rnd(-.5, .5)], i * 3);
    m.life[i] = 1.2;
  }
}
function updateMist(dt){
  const m = mist.userData, pos = mist.geometry.attributes.position;
  for(let i = 0; i < pos.count; i++){
    if(m.life[i] <= 0) continue;
    m.life[i] -= dt;
    if(m.life[i] <= 0){ pos.setXYZ(i, 0, -999, 0); continue; }
    pos.setXYZ(i, pos.getX(i) + m.vel[i * 3] * dt, pos.getY(i) + m.vel[i * 3 + 1] * dt, pos.getZ(i) + m.vel[i * 3 + 2] * dt);
    m.vel[i * 3 + 1] -= dt * 1.5;
  }
  pos.needsUpdate = true;
}

function start(data){
  bindMobile();
  S = ensureState((data && data.state && data.state.wx) ? data.state : (load() || newGame()));
  if(S.year >= 2 && !S.orders.length && S.week < 30) genOrders();
  if(typeof THREE === 'undefined'){ stage.insertAdjacentHTML('beforeend', '<div class="nogl">3D 도구를 불러오지 못했어요. 새로고침해 주세요.</div>'); fit(); return; }
  if(!initScene()) return;
  buildField(); buildBuildings(); buildNPCs(); rebuildTrees(); rebuildCrates(); seasonLook(); buildLabels(); renderUI();
  camYaw = 0;
  if(!S.seen.intro){
    S.seen.intro = true; save();
    modal('🍎 사과 과수원에 오신 걸 환영해요', `
      <p>1년차 3월이에요. 약 <b>${pyeongOf(S.rows)}평</b> 빈 밭과 <b>${won(S.money)}</b>으로 시작해요.</p>
      <p>밭에는 나무를 심을 줄이 ${S.rows}개 있어요. 줄마다 나무 ${RULE.perRow}그루가 ${RULE.treeGap}m 간격으로 서고, 줄과 줄 사이엔 농기계가 다니는 ${RULE.alley}m 길이 있어요.</p>
      <p>${TOUCH ? '왼쪽 <b>동그라미 조이스틱</b>이나 <b>화면 탭</b>으로 농부를 움직여 줄 옆에 서고, 아래에서 도구를 골라 오른쪽 <b>F 버튼</b>을 누르면' : '<b>WASD</b>나 <b>마우스 클릭</b>으로 농부를 움직여 줄 옆에 서고, 아래에서 도구를 골라 <b>F</b>를 누르면'} 그 줄 전체를 작업해요. 먼저 품종을 골라 묘목을 심어 보세요!</p>
      <div class="row"><button class="btn" data-close>시작하기</button></div>`);
  } else toast(seasonHint() || '어서 와요! 이어서 농사를 지어요.');
  requestAnimationFrame(loop);
  $('c').focus();
}
try{ window.claude?.hot?.snapshot?.(() => ({state:S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
